- id: "q.{m}{M}.2NT.4NT"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}]
  seq: "1{m} 1{M} 2NT"
  call: 4NT
  cond: "hl >= 13 and {M} < 6"
  forcing: INV
  meaning: "Quantitatif"
  meaning_en: "Quantitative"
  status: infere
- id: "q.{m}{M}.2NT.4NT.r"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}]
  seq: "1{m} 1{M} 2NT 4NT"
  call: 6NT
  cond: "hl >= 19"
  forcing: SO
  meaning: "Maximum : accepte"
  meaning_en: "Maximum: accepts"
  status: infere
- id: "q.{m}{M}.2NT.4NT.p"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}]
  seq: "1{m} 1{M} 2NT 4NT"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Minimum"
  meaning_en: "Minimum"
  status: infere
- id: q.js.3NT.6NT
  seq: ["1C 2D 3NT", "1D 3C 3NT", "1C|1D 2H|2S 3NT", "1H 2S 3NT", "1S 3H 3NT", "1H|1S 3C|3D 3NT"]
  call: 6NT
  cond: "hl >= 19"
  forcing: SO
  meaning: "Petit chelem à SA"
  meaning_en: "Small slam in NT"
  status: infere

# ======================================================================
# A.14 Roudi
# ======================================================================
# Après 1♣/♦ – 1♥/♠ – 1SA, 2♣ du répondant (11+ HL, majeure 5e) demande à l'ouvreur son soutien. SEF 2024 : toutes les enchères du répondant au niveau de 3 après le Roudi sont forcing de manche.
- id: "roudi.{m}.{M}"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}]
  seq: "1{m} 1{M} 1NT"
  call: 2C
  cond: "{M} >= 5 and hl >= 11"
  forcing: F1
  meaning: "Roudi : 11+ HL, majeure 5e, demande le soutien"
  meaning_en: "Roudi: 11+ HL, 5-card major, asks for support"
  status: sef
  alert: true
# --- réponses de l'ouvreur (réponse 1♥ : fiche ; réponse 1♠ : transposition)
- id: "roudi.{m}.H.2S"
  for: [{m: C}, {m: D}]
  seq: "1{m} 1H 1NT 2C"
  call: 2S
  cond: "H == 3 and hl >= 14"
  forcing: F1
  meaning: "3 cartes à ♥, maximum"
  meaning_en: "3 hearts, maximum"
  status: sef
  alert: true
- id: "roudi.{m}.H.2H"
  for: [{m: C}, {m: D}]
  seq: "1{m} 1H 1NT 2C"
  call: 2H
