# ======================================================================
# A.15 3e couleur forcing
# ======================================================================
# Le répondant nomme la 3e couleur après la répétition de la mineure d'ouverture : il rallonge sa couleur, demande un arrêt pour SA ou rend l'enchère forcing (9+ HL, pas auto-forcing). Réponses non forcing de l'ouvreur : retour à 2 dans la majeure du répondant, 2SA avec arrêt, répétition de sa couleur. Le soutien de la 3e couleur est naturel.
# cas : o = ouverture, M = majeure du répondant, t = 3e couleur, f = 4e couleur (non nommée)
- id: 1C.1S.2C.2H
  seq: "1C 1S 2C"
  call: 2H
  cond: "S >= 5 and H >= 4 and hl >= 11"
  forcing: F1
  meaning: "5+♠ et 4+♥, forcing"
  meaning_en: "5+♠ and 4+♥, forcing"
  status: sef
- id: 1D.1S.2D.3C
  seq: "1D 1S 2D"
  call: 3C
  cond: "S == 4 and C >= 4 and hl >= 12"
  forcing: FM
  meaning: "Dénie 5♠, force à ♣"
  meaning_en: "Denies 5♠, forces with ♣"
  status: sef
- id: "tcf.{o}{M}.ask"
  for: [{o: C, M: H, t: D, f: S, call: 2D}, {o: C, M: S, t: D, f: H, call: 2D}, {o: D, M: H, t: S, f: C, call: 2S}, {o: D, M: S, t: H, f: C, call: 2H}]
  seq: "1{o} 1{M} 2{o}"
  call: "{call}"
  cond: "hl >= 11 and not ((balanced or semibalanced) and stop('{t}') and stop('{f}'))"
  forcing: F1
  meaning: "3e couleur forcing"
  meaning_en: "Third suit forcing"
  status: sef
  alert: true
# --- réponses de l'ouvreur
- id: "tcf.{o}{M}.fit3"
  for: [{o: C, M: H, t: D, f: S, fit: 2H}, {o: C, M: S, t: D, f: H, fit: 2S}, {o: D, M: H, t: S, f: C, fit: 3H}, {o: D, M: S, t: H, f: C, fit: 2S}]
  seq: "1{o} 1{M} 2{o} 2{t}"
  call: "{fit}"
  cond: "{M} >= 3"
  forcing: NF
  meaning: "3 cartes dans la majeure du répondant"
  meaning_en: "3 cards in responder's major"
  status: sef
- id: "tcf.{o}{M}.raise"
  for: [{o: C, M: H, t: D, f: S}, {o: C, M: S, t: D, f: H}, {o: D, M: H, t: S, f: C}, {o: D, M: S, t: H, f: C}]
  seq: "1{o} 1{M} 2{o} 2{t}"
  call: "3{t}"
  cond: "{t} >= 4"
  forcing: NF
  meaning: "Soutien naturel de la 3e couleur (4 cartes)"
  meaning_en: "Natural support of the third suit (4 cards)"
  status: sef
- id: "tcf.{o}{M}.2NT"
  for: [{o: C, M: H, t: D, f: S}, {o: C, M: S, t: D, f: H}, {o: D, M: H, t: S, f: C}, {o: D, M: S, t: H, f: C}]
  seq: "1{o} 1{M} 2{o} 2{t}"
  call: 2NT
  cond: "stop('{f}')"
  forcing: NF
  meaning: "Arrêt dans la 4e couleur"
  meaning_en: "Stopper in the fourth suit"
  status: sef
- id: "tcf.{o}{M}.rebid"
  for: [{o: C, M: H, t: D, f: S}, {o: C, M: S, t: D, f: H}, {o: D, M: H, t: S, f: C}, {o: D, M: S, t: H, f: C}]
  seq: "1{o} 1{M} 2{o} 2{t}"
  call: "3{o}"
  cond: "true"
  forcing: NF
  meaning: "Répétition de la couleur (6+ cartes ou rien de mieux)"
  meaning_en: "Rebid of the suit (6+ cards or nothing better)"
  status: sef
- id: 1C.1S.2C.2H.r
  seq: "1C 1S 2C 2H"
  call: 3H
  cond: "H >= 4"
  forcing: F1
  meaning: "Fit ♥"
  meaning_en: "♥ fit"
  status: infere
- id: 1C.1S.2C.2H.2S
  seq: "1C 1S 2C 2H"
  call: 2S
  cond: "S >= 3"
  forcing: NF
  meaning: "Fit ♠"
  meaning_en: "♠ fit"
  status: infere
- id: 1C.1S.2C.2H.2NT
  seq: "1C 1S 2C 2H"
  call: 2NT
  cond: "stop('D')"
  forcing: NF
  meaning: "Arrêt ♦"
  meaning_en: "♦ stopper"
  status: infere
- id: 1C.1S.2C.2H.3C
  seq: "1C 1S 2C 2H"
  call: 3C
  cond: "true"
  forcing: NF
  meaning: "Répétition des ♣"
  meaning_en: "Rebid of ♣"
  status: infere
- id: 1D.1S.2D.3C.r
  seq: "1D 1S 2D 3C"
  call: 3NT
  cond: "stop('H')"
  forcing: SO
  meaning: "Arrêt ♥"
  meaning_en: "♥ stopper"
  status: infere
- id: 1D.1S.2D.3C.4S
  seq: "1D 1S 2D 3C"
  call: 3S
  cond: "S >= 3"
  forcing: FM
  meaning: "3 cartes à ♠"
  meaning_en: "3 spades"
  status: infere
- id: 1D.1S.2D.3C.4C
  seq: "1D 1S 2D 3C"
  call: 4C
  cond: "C >= 4"
  forcing: FM
  meaning: "Fit ♣"
  meaning_en: "♣ fit"
  status: infere
- id: 1D.1S.2D.3C.3D
  seq: "1D 1S 2D 3C"
  call: 3D
  cond: "true"
  forcing: FM
  meaning: "Pas d'arrêt ♥"
  meaning_en: "No ♥ stopper"
  status: infere
# --- conclusion du répondant
- id: "tcf.{o}{M}.c4Mfit"
  for: [{o: C, M: H, t: D, x: 2H}, {o: C, M: S, t: D, x: 2S}, {o: D, M: H, t: S, x: 3H}, {o: D, M: S, t: H, x: 2S}]
  seq: ["1{o} 1{M} 2{o} 2{t} {x}", "1{o} 1{M} 2{o} 3C 3{M}", "1C 1S 2C 2H 2S"]
  call: "4{M}"
  cond: "hl >= 12 and {M} >= 5"
  forcing: SO
  meaning: "Fit 5-3 : manche"
  meaning_en: "5-3 fit: game"
  status: infere
- id: "tcf.{o}{M}.c3Mfit"
  for: [{o: C, M: H, t: D, x: 2H}, {o: C, M: S, t: D, x: 2S}, {o: D, M: S, t: H, x: 2S}]
  seq: "1{o} 1{M} 2{o} 2{t} {x}"
  call: "3{M}"
  cond: "{M} >= 5"
  forcing: INV
  meaning: "Fit 5-3, 11 H : invitation"
  meaning_en: "5-3 fit, 11 HCP: invitation"
  status: infere
- id: "tcf.{o}{M}.c4M6"
  for: [{o: C, M: H, t: D, x: "2H|3H|3D|2NT|3C"}, {o: C, M: S, t: D, x: "2S|3S|3D|2NT|3C|2H"}, {o: D, M: H, t: S, x: "3H|3S|2NT|3D"}, {o: D, M: S, t: H, x: "2S|3S|3H|2NT|3D|3C"}]
  seq: ["1{o} 1{M} 2{o} 2{t} {x}", "1{o} 1{M} 2{o} 3C {x}"]
  call: "4{M}"
  cond: "hl >= 12 and {M} >= 6"
  forcing: SO
  meaning: "6 cartes : manche dans la majeure"
  meaning_en: "6 cards: game in the major"
  status: infere
- id: "tcf.{o}{M}.c3NT"
  for: [{o: C, M: H, t: D, x: "2H|3H|3D|2NT|3C"}, {o: C, M: S, t: D, x: "2S|3S|3D|2NT|3C|2H"}, {o: D, M: H, t: S, x: "3H|3S|2NT|3D"}, {o: D, M: S, t: H, x: "2S|3S|3H|2NT|3D|3C"}]
  seq: ["1{o} 1{M} 2{o} 2{t} {x}", "1{o} 1{M} 2{o} 3C {x}"]
  call: 3NT
  cond: "hl >= 12"
  forcing: SO
  meaning: "Manche à SA"
  meaning_en: "Game in NT"
  status: infere
- id: "tcf.{o}{M}.cp"
  for: [{o: C, M: H, t: D, x: "2H|3H|3D|2NT|3C"}, {o: C, M: S, t: D, x: "2S|3S|3D|2NT|3C|2H"}, {o: D, M: H, t: S, x: "3H|3S|2NT|3D"}, {o: D, M: S, t: H, x: "2S|3S|3H|2NT|3D|3C"}]
  seq: ["1{o} 1{M} 2{o} 2{t} {x}", "1{o} 1{M} 2{o} 3C {x}"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "11 H : partielle"
  meaning_en: "11 HCP: partscore"
  status: infere
- id: tcf.2H.2NT.r
  seq: "1C 1S 2C 2H 2NT"
  call: 3NT
  cond: "hl >= 12"
  forcing: SO
  meaning: "Manche à SA"
  meaning_en: "Game in NT"
  status: infere
- id: tcf.2H.2S.r
  seq: "1C 1S 2C 2H 2S"
  call: 4S
  cond: "hl >= 12"
  forcing: SO
  meaning: "Manche à ♠"
  meaning_en: "Game in ♠"
  status: infere
- id: tcf.2H.p
  seq: ["1C 1S 2C 2H 2NT|2S"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "Partielle"
  meaning_en: "Partscore"
  status: infere
- id: "tcf.inv.{k}"
  for: [{k: a, M: S, s: "1C 1S 2C 2D 2S 3S"}, {k: b, M: S, s: "1D 1S 2D 2H 2S 3S"}, {k: c, M: H, s: "1C 1H 2C 2D 2H 3H"}]
  seq: "{s}"
  call: "4{M}"
  cond: "hl >= 14"
  forcing: SO
  meaning: "Accepte l'invitation"
  meaning_en: "Accepts the invitation"
  status: infere
- id: tcf.inv.p
  seq: ["1C 1S 2C 2D 2S 3S", "1D 1S 2D 2H 2S 3S", "1C 1H 2C 2D 2H 3H"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "Minimum"
  meaning_en: "Minimum"
  status: infere
- id: q.st.4NT
  seq: "1NT 2C 2D|2H|2S 4NT"
  call: 6NT
  cond: "hl >= 16"
  forcing: SO
  meaning: "Accepte le quantitatif"
  meaning_en: "Accepts the quantitative bid"
  status: infere
- id: q.1m.4NT
  seq: "1C|1D 4NT"
  call: 6NT
  cond: "hl >= 13"
  forcing: SO
  meaning: "Accepte le quantitatif (19-20 en face)"
  meaning_en: "Accepts the quantitative bid (19-20 opposite)"
  status: infere
- id: q.p
  seq: ["1NT 2C 2D|2H|2S 4NT", "1C|1D 4NT"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "Refuse"
  meaning_en: "Declines"
  status: infere

# ======================================================================
# A.16 4e couleur forcing
# ======================================================================
# Le répondant nomme la 4e couleur pour rallonger sa couleur, demander l'arrêt pour SA ou rendre l'enchère forcing ; au palier de 2 (économique) elle est auto-forcing, et toute enchère au palier de 3 qui suit est forcing de manche. Réponses de l'ouvreur : 2SA avec l'arrêt (mini-maxi : 12-15 ou 18-19 HL), 3 cartes dans la majeure du répondant, soutien de la 4e couleur mineure au palier de 3 avec As troisième et ouverture non minimum, répétition de ses couleurs.
- id: "fcf.{k}.ask"
  for: [{k: a, s: "1C 1H 1S", call: 2D, F: D, M: H, o2: S}, {k: b, s: "1D 1H 1S", call: 2C, F: C, M: H, o2: S}, {k: c, s: "1D 1S 2C", call: 2H, F: H, M: S, o2: C}, {k: e, s: "1H 1S 2C", call: 2D, F: D, M: S, o2: C}, {k: f, s: "1H 1S 2D", call: 3C, F: C, M: S, o2: D}]
  seq: "{s}"
  call: "{call}"
  cond: "hl >= 12 and not ({o2} >= 4 and '{o2}' in ('H', 'S')) and {M} < 6 and not ((balanced or semibalanced) and stop('{F}'))"
  forcing: FM
  meaning: "4e couleur forcing"
  meaning_en: "Fourth suit forcing"
  status: sef
  alert: true
# --- réponses de l'ouvreur
- id: "fcf.{k}.nt"
  for: [{k: a, s: "1C 1H 1S 2D", F: D, nt: 2NT, fo: F1}, {k: b, s: "1D 1H 1S 2C", F: C, nt: 2NT, fo: F1}, {k: c, s: "1D 1S 2C 2H", F: H, nt: 2NT, fo: F1}, {k: e, s: "1H 1S 2C 2D", F: D, nt: 2NT, fo: F1}, {k: f, s: "1H 1S 2D 3C", F: C, nt: 3NT, fo: SO}]
  seq: "{s}"
  call: "{nt}"
  cond: "stop('{F}')"
  forcing: "{fo}"
  meaning: "Arrêt dans la 4e couleur (2SA : 12-15 ou 18-19 HL)"
  meaning_en: "Stopper in the fourth suit (2NT: 12-15 or 18-19 HL)"
  status: sef
- id: "fcf.{k}.fitM"
  for: [{k: a, s: "1C 1H 1S 2D", M: H, c: 2H}, {k: b, s: "1D 1H 1S 2C", M: H, c: 2H}, {k: c, s: "1D 1S 2C 2H", M: S, c: 2S}, {k: e, s: "1H 1S 2C 2D", M: S, c: 2S}, {k: f, s: "1H 1S 2D 3C", M: S, c: 3S}]
  seq: "{s}"
  call: "{c}"
  cond: "{M} >= 3"
  forcing: F1
  meaning: "3 cartes dans la majeure du répondant"
  meaning_en: "3 cards in responder's major"
  status: sef
- id: "fcf.{k}.raiseF"
  for: [{k: a, s: "1C 1H 1S 2D", F: D}, {k: b, s: "1D 1H 1S 2C", F: C}, {k: e, s: "1H 1S 2C 2D", F: D}]
  seq: "{s}"
  call: "3{F}"
  cond: "{F} >= 3 and ace('{F}') and hl >= 14"
  forcing: FM
  meaning: "As troisième dans la 4e couleur, ouverture non minimum"
  meaning_en: "Third-round ace in the fourth suit, non-minimum opening"
  status: sef
- id: "fcf.{k}.rebid"
  for: [{k: a, s: "1C 1H 1S 2D", c: 3C}, {k: b, s: "1D 1H 1S 2C", c: 2D}, {k: c, s: "1D 1S 2C 2H", c: 3D}, {k: e, s: "1H 1S 2C 2D", c: 2H}, {k: f, s: "1H 1S 2D 3C", c: 3H}]
  seq: "{s}"
  call: "{c}"
  cond: "true"
  forcing: F1
  meaning: "Répétition de la couleur d'ouverture"
  meaning_en: "Rebid of the opening suit"
  status: sef
# --- conclusion du répondant
- id: "fcf.{k}.c4Mfit"
  for: [{k: a, s: "1C 1H 1S 2D 2H", M: H}, {k: b, s: "1D 1H 1S 2C 2H", M: H}, {k: c, s: "1D 1S 2C 2H 2S", M: S}, {k: e, s: "1H 1S 2C 2D 2S", M: S}, {k: f, s: "1H 1S 2D 3C 3S", M: S}]
  seq: "{s}"
  call: "4{M}"
  cond: "{M} >= 5"
  forcing: SO
  meaning: "Fit 5-3 : manche"
  meaning_en: "5-3 fit: game"
  status: infere
- id: "fcf.{k}.c4M6"
  for: [{k: a, s: "1C 1H 1S 2D", M: H}, {k: b, s: "1D 1H 1S 2C", M: H}, {k: c, s: "1D 1S 2C 2H", M: S}, {k: e, s: "1H 1S 2C 2D", M: S}, {k: f, s: "1H 1S 2D 3C", M: S}]
  seq: "{s} *"
  call: "4{M}"
  cond: "{M} >= 6"
  forcing: SO
  meaning: "6 cartes : manche dans la majeure"
  meaning_en: "6 cards: game in the major"
  status: infere
- id: "fcf.{k}.c3NT"
  for: [{k: a, s: "1C 1H 1S 2D"}, {k: b, s: "1D 1H 1S 2C"}, {k: c, s: "1D 1S 2C 2H"}, {k: e, s: "1H 1S 2C 2D"}, {k: f, s: "1H 1S 2D 3C"}]
  seq: "{s} 2NT|2D|2H|2S|3C|3D|3H|3S"
  call: 3NT
  cond: "true"
  forcing: SO
  meaning: "Manche à SA"
  meaning_en: "Game in NT"
  status: infere
- id: "fcf.{k}.c3NT.p"
  for: [{k: f, s: "1H 1S 2D 3C"}]
  seq: "{s} 3NT"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Fin"
  meaning_en: "End"
  status: infere
# --- l'ouvreur 18-19 après 2SA – 3SA : continue (fiche : 4 dans la majeure avec 3 cartes, sinon 4SA)
- id: "fcf.{k}.mm.4M"
  for: [{k: a, s: "1C 1H 1S 2D", M: H}, {k: b, s: "1D 1H 1S 2C", M: H}, {k: c, s: "1D 1S 2C 2H", M: S}, {k: e, s: "1H 1S 2C 2D", M: S}]
  seq: "{s} 2NT 3NT"
  call: "4{M}"
  cond: "hl >= 18 and {M} >= 3"
  forcing: NF
  meaning: "18-19 avec 3 cartes dans la majeure"
  meaning_en: "18-19 with 3 cards in the major"
  status: sef
- id: "fcf.{k}.mm.4NT"
  for: [{k: a, s: "1C 1H 1S 2D"}, {k: b, s: "1D 1H 1S 2C"}, {k: c, s: "1D 1S 2C 2H"}, {k: e, s: "1H 1S 2C 2D"}]
  seq: "{s} 2NT 3NT"
  call: 4NT
  cond: "hl >= 18"
  forcing: INV
  meaning: "18-19 : quantitatif"
  meaning_en: "18-19: quantitative"
  status: sef
- id: "fcf.{k}.mm.6NT"
  for: [{k: a, s: "1C 1H 1S 2D"}, {k: b, s: "1D 1H 1S 2C"}, {k: c, s: "1D 1S 2C 2H"}, {k: e, s: "1H 1S 2C 2D"}]
  seq: "{s} 2NT 3NT 4NT"
  call: 6NT
  cond: "hl >= 14"
  forcing: SO
  meaning: "Accepte"
  meaning_en: "Accepts"
