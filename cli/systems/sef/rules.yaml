# ======================================================================
# A.7 bis Drury (réponses d'une main passée)
# ======================================================================
# en: A.7 bis Drury (passed-hand responses)
# Ces règles commencent par `P` : elles ne s'appliquent que si le répondant a déjà passé. Elles précèdent les réponses ordinaires à 1♥/1♠.
# en: These rules start with `P`: they apply only when responder has already passed. They come before the ordinary responses to 1♥/1♠.
- id: "drury.{M}.2NT"
  for: [{M: H}, {M: S}]
  seq: "P 1{M}"
  call: 2NT
  cond: "{M} >= 4 and min(S, H, D, C) <= 1 and 10 <= hld <= 12"
  forcing: F1
  meaning: "Super Drury : 4 atouts, un singleton ou une chicane, 11 HLD"
  meaning_en: "Super Drury: 4-card support, a singleton or void, 11 HLD"
  status: sef
  alert: true
  trump: "{M}"
- id: "drury.{M}.2C"
  for: [{M: H}, {M: S}]
  seq: "P 1{M}"
  call: 2C
  cond: "{M} >= 3 and dh >= 11 and not ({M} >= 4 and min(S, H, D, C) <= 1)"
  forcing: F1
  meaning: "Drury : soutien 3 atouts (ou 4 sans singleton), 11-12 HLD"
  meaning_en: "Drury: 3-card support (or 4 without a singleton), 11-12 HLD"
  status: sef
  alert: true
  trump: "{M}"
