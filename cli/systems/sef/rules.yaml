# ======================================================================
# A.14 Roudi
# ======================================================================
# en: A.14 Roudi
# Après 1♣/♦ – 1♥/♠ – 1SA (ou 1♥ – 1♠ – 1SA), 2♣ du répondant (11+ HL, majeure 5e) demande à l'ouvreur son soutien et sa force. Roudi à 3 paliers : 2♦ = 2 cartes dans la majeure (minimum ou maximum), 2♥ = 3 cartes minimum, 2♠ = 3 cartes maximum. SEF 2024 : toutes les enchères du répondant au niveau de 3 après le Roudi sont forcing de manche.
# en: After 1♣/♦ – 1♥/♠ – 1NT (or 1♥ – 1♠ – 1NT), responder's 2♣ (11+ HL, five-card major) asks opener about support and strength. Three-step Roudi: 2♦ = two cards in the major (minimum or maximum), 2♥ = three cards, minimum, 2♠ = three cards, maximum. SEF 2024: every responder's bid at the three level after Roudi is game forcing.
- id: "roudi.{m}.{M}"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}]
  seq: "1{m} 1{M} 1NT"
  call: 2C
  cond: "{M} >= 5 and hl >= 10"
  forcing: F1
  meaning: "Roudi : 10+ HL, majeure 5e, demande le soutien"
  meaning_en: "Roudi: 10+ HL, five-card major, asks for support"
  status: sef
  alert: true
- id: roudi.H.S
  seq: "1H 1S 1NT"
  call: 2C
  cond: "S >= 5 and hl >= 10"
  forcing: F1
  meaning: "Roudi : 10+ HL, 5 piques, demande le soutien"
  meaning_en: "Roudi: 10+ HL, five spades, asks for support"
  status: choix
  alert: true
# --- réponses de l'ouvreur : Roudi à 3 paliers
# en: opener's answers: three-step Roudi
- id: "roudi.{m}.H.2S"
  for: [{m: C}, {m: D}]
  seq: "1{m} 1H 1NT 2C"
  call: 2S
  cond: "H == 3 and hld >= 13"
  forcing: F1
  meaning: "Fitté maximum : 3 cartes à ♥, 13+ HLD"
  meaning_en: "Fit, maximum: three hearts, 13+ HLD"
  status: sef
  alert: true
- id: "roudi.{m}.H.2H"
  for: [{m: C}, {m: D}]
  seq: "1{m} 1H 1NT 2C"
  call: 2H
  cond: "H == 3"
  forcing: NF
  meaning: "Fitté minimum : 3 cartes à ♥, 12-13 H"
  meaning_en: "Fit, minimum: three hearts, 12-13 HCP"
  status: sef
- id: "roudi.{m}.S.2S"
  for: [{m: C}, {m: D}, {m: H}]
  seq: "1{m} 1S 1NT 2C"
  call: 2S
  cond: "S == 3 and hl >= 13"
  forcing: F1
  meaning: "Fitté maximum : 3 cartes à ♠, 13-14 H"
  meaning_en: "Fit, maximum: three spades, 13-14 HCP"
  status: choix
  alert: true
- id: "roudi.{m}.S.2H"
  for: [{m: C}, {m: D}, {m: H}]
  seq: "1{m} 1S 1NT 2C"
  call: 2H
  cond: "S == 3"
  forcing: F1
  meaning: "Fitté minimum : 3 cartes à ♠, 12-13 H"
  meaning_en: "Fit, minimum: three spades, 12-13 HCP"
  status: choix
  alert: true
- id: "roudi.{m}.{M}.2D"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}, {m: H, M: S}]
  seq: "1{m} 1{M} 1NT 2C"
  call: 2D
  cond: "true"
  forcing: F1
  meaning: "Pas fitté : 2 cartes dans la majeure, minimum ou maximum"
  meaning_en: "No fit: two cards in the major, minimum or maximum"
  status: choix
  alert: true
# --- suites du répondant
# en: responder's continuations
- id: "roudi.{m}.{M}.max.4"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}, {m: H, M: S}]
  seq: "1{m} 1{M} 1NT 2C 2S"
  call: "4{M}"
  cond: "true"
  forcing: SO
  meaning: "Fit et maximum en face : manche"
  meaning_en: "Fit and a maximum opposite: game"
  status: infere
- id: "roudi.{m}.{M}.min.4"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}, {m: H, M: S}]
  seq: "1{m} 1{M} 1NT 2C 2H"
  call: "4{M}"
  cond: "hld >= 12"
  forcing: SO
  meaning: "Fit : manche"
  meaning_en: "Fit: game"
  status: infere
- id: "roudi.{m}.H.min.p"
  for: [{m: C}, {m: D}]
  seq: "1{m} 1H 1NT 2C 2H"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Fit minimum, 11-12 : partielle"
  meaning_en: "Minimum fit, 11-12: partscore"
  status: infere
- id: "roudi.{m}.S.min.2S"
  for: [{m: C}, {m: D}, {m: H}]
  seq: "1{m} 1S 1NT 2C 2H"
  call: 2S
  cond: "true"
  forcing: NF
  meaning: "Fit minimum, 11-12 : partielle à ♠"
  meaning_en: "Minimum fit, 11-12: partscore in spades"
  status: infere
- id: "roudi.{m}.S.min.2S.p"
  for: [{m: C}, {m: D}, {m: H}]
  seq: "1{m} 1S 1NT 2C 2H 2S"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Partielle"
  meaning_en: "Partscore"
  status: infere
- id: "roudi.{m}.{M}.2D.4M"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}, {m: H, M: S}]
  seq: "1{m} 1{M} 1NT 2C 2D"
  call: "4{M}"
  cond: "{M} >= 6 and hld >= 12"
  forcing: SO
  meaning: "6 cartes, manche"
  meaning_en: "Six cards, game"
  status: infere
- id: "roudi.{m}.{M}.2D.3NT"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}, {m: H, M: S}]
  seq: "1{m} 1{M} 1NT 2C 2D"
  call: 3NT
  cond: "hl >= 12"
  forcing: SO
  meaning: "Manche à SA"
  meaning_en: "Game in NT"
  status: infere
- id: "roudi.{m}.{M}.2D.2NT"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}, {m: H, M: S}]
  seq: "1{m} 1{M} 1NT 2C 2D"
  call: 2NT
  cond: "true"
  forcing: INV
  meaning: "Naturel, 11-12 H : l'ouvreur conclut selon sa force"
  meaning_en: "Natural, 11-12 HCP: opener decides on strength"
  status: sef
- id: "roudi.{m}.{M}.2NT.o"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}, {m: H, M: S}]
  seq: "1{m} 1{M} 1NT 2C 2D 2NT"
  call: 3NT
  cond: "hl >= 13"
  forcing: SO
  meaning: "Maximum : accepte l'invitation"
  meaning_en: "Maximum: accepts the invitation"
  status: infere
- id: "roudi.{m}.{M}.2NT.op"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}, {m: H, M: S}]
  seq: "1{m} 1{M} 1NT 2C 2D 2NT"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Minimum : refuse"
  meaning_en: "Minimum: declines"
  status: infere

# ======================================================================
# A.15 3e couleur forcing
# ======================================================================
# en: A.15 Third suit forcing
# Le répondant nomme la 3e couleur après la répétition de la mineure d'ouverture : il rallonge sa couleur, demande un arrêt pour SA ou rend l'enchère forcing (9+ HL, pas auto-forcing). Réponses non forcing de l'ouvreur : retour à 2 dans la majeure du répondant, 2SA avec arrêt, répétition de sa couleur. Le soutien de la 3e couleur est naturel.
# en: Responder bids the third suit after opener rebids the opening minor: to show extra length, ask for a stopper for NT, or make the auction forcing (9+ HL, not self-forcing). Opener's non-forcing answers: back to responder's major at the two level, 2NT with a stopper, rebid of own suit. Raising the third suit is natural.
# cas : o = ouverture, M = majeure du répondant, t = 3e couleur, f = 4e couleur (non nommée)
# en: cases: o = opening, M = responder's major, t = third suit, f = fourth suit (unbid)
- id: 1C.1S.2C.2H
  seq: "1C 1S 2C"
  call: 2H
  cond: "S >= 5 and H >= 4 and hl >= 10"
  forcing: F1
  meaning: "5+♠ et 4+♥, forcing"
  meaning_en: "5+♠ and 4+♥, forcing"
  status: sef
- id: 1D.1S.2D.3C
  seq: "1D 1S 2D"
  call: 3C
  cond: "S == 4 and C >= 4 and hl >= 12"
  forcing: FM
  meaning: "Dénie 5♠, force à ♣"
  meaning_en: "Denies 5♠, forces with ♣"
  status: sef
- id: "tcf.{o}{M}.ask"
  for: [{o: C, M: H, t: D, f: S, call: 2D}, {o: C, M: S, t: D, f: H, call: 2D}, {o: D, M: H, t: S, f: C, call: 2S}, {o: D, M: S, t: H, f: C, call: 2H}]
  seq: "1{o} 1{M} 2{o}"
  call: "{call}"
  cond: "hl >= 11 and not ((balanced or semibalanced) and stop('{t}') and stop('{f}'))"
  forcing: F1
  meaning: "3e couleur forcing"
  meaning_en: "Third suit forcing"
  status: sef
  alert: true
# --- réponses de l'ouvreur
# en: opener's answers
- id: "tcf.{o}{M}.fit3"
  for: [{o: C, M: H, t: D, f: S, fit: 2H}, {o: C, M: S, t: D, f: H, fit: 2S}, {o: D, M: H, t: S, f: C, fit: 3H}, {o: D, M: S, t: H, f: C, fit: 2S}]
  seq: "1{o} 1{M} 2{o} 2{t}"
  call: "{fit}"
  cond: "{M} >= 3"
  forcing: NF
  meaning: "3 cartes dans la majeure du répondant"
  meaning_en: "3 cards in responder's major"
  status: sef
- id: "tcf.{o}{M}.raise"
  for: [{o: C, M: H, t: D, f: S}, {o: C, M: S, t: D, f: H}, {o: D, M: H, t: S, f: C}, {o: D, M: S, t: H, f: C}]
  seq: "1{o} 1{M} 2{o} 2{t}"
  call: "3{t}"
  cond: "{t} >= 4"
  forcing: NF
  meaning: "Soutien naturel de la 3e couleur (4 cartes)"
  meaning_en: "Natural support of the third suit (4 cards)"
  status: sef
- id: "tcf.{o}{M}.2NT"
  for: [{o: C, M: H, t: D, f: S}, {o: C, M: S, t: D, f: H}, {o: D, M: H, t: S, f: C}, {o: D, M: S, t: H, f: C}]
  seq: "1{o} 1{M} 2{o} 2{t}"
  call: 2NT
  cond: "stop('{f}')"
  forcing: NF
  meaning: "Arrêt dans la 4e couleur"
  meaning_en: "Stopper in the fourth suit"
  status: sef
- id: "tcf.{o}{M}.rebid"
  for: [{o: C, M: H, t: D, f: S}, {o: C, M: S, t: D, f: H}, {o: D, M: H, t: S, f: C}, {o: D, M: S, t: H, f: C}]
  seq: "1{o} 1{M} 2{o} 2{t}"
  call: "3{o}"
  cond: "true"
  forcing: NF
  meaning: "Répétition de la couleur (6+ cartes ou rien de mieux)"
  meaning_en: "Rebid of the suit (6+ cards or nothing better)"
  status: sef
- id: 1C.1S.2C.2H.r
  seq: "1C 1S 2C 2H"
  call: 3H
  cond: "H >= 4"
  forcing: NF
  meaning: "Fit ♥"
  meaning_en: "♥ fit"
  status: infere
- id: 1C.1S.2C.2H.3H.4H
  seq: "1C 1S 2C 2H 3H"
  call: 4H
  cond: "hl >= 11"
  forcing: SO
  meaning: "Manche à ♥"
  meaning_en: "Game in ♥"
  status: infere
- id: 1C.1S.2C.2H.3H.p
  seq: "1C 1S 2C 2H 3H"
  call: P
  cond: "true"
  forcing: NF
  meaning: "11 HL : partielle"
  meaning_en: "11 HL: partscore"
  status: infere
- id: 1C.1S.2C.2H.2S
  seq: "1C 1S 2C 2H"
  call: 2S
  cond: "S >= 3"
  forcing: NF
  meaning: "Fit ♠"
  meaning_en: "♠ fit"
  status: infere
- id: 1C.1S.2C.2H.2NT
  seq: "1C 1S 2C 2H"
  call: 2NT
  cond: "stop('D')"
  forcing: NF
  meaning: "Arrêt ♦"
  meaning_en: "♦ stopper"
  status: infere
- id: 1C.1S.2C.2H.3C
  seq: "1C 1S 2C 2H"
  call: 3C
  cond: "true"
  forcing: NF
  meaning: "Répétition des ♣"
  meaning_en: "Rebid of ♣"
  status: infere
- id: 1D.1S.2D.3C.r
  seq: "1D 1S 2D 3C"
  call: 3NT
  cond: "stop('H')"
  forcing: SO
  meaning: "Arrêt ♥"
  meaning_en: "♥ stopper"
  status: infere
- id: 1D.1S.2D.3C.4S
  seq: "1D 1S 2D 3C"
  call: 3S
  cond: "S >= 3"
  forcing: FM
  meaning: "3 cartes à ♠"
  meaning_en: "3 spades"
  status: infere
- id: 1D.1S.2D.3C.4C
  seq: "1D 1S 2D 3C"
  call: 4C
  cond: "C >= 4"
  forcing: FM
  meaning: "Fit ♣"
  meaning_en: "♣ fit"
  status: infere
- id: 1D.1S.2D.3C.3D
  seq: "1D 1S 2D 3C"
  call: 3D
  cond: "true"
  forcing: FM
  meaning: "Pas d'arrêt ♥"
  meaning_en: "No ♥ stopper"
  status: infere
# --- conclusion du répondant
# en: responder's conclusion
- id: "tcf.{o}{M}.c4Mfit"
  for: [{o: C, M: H, t: D, x: 2H}, {o: C, M: S, t: D, x: 2S}, {o: D, M: H, t: S, x: 3H}, {o: D, M: S, t: H, x: 2S}]
  seq: ["1{o} 1{M} 2{o} 2{t} {x}", "1{o} 1{M} 2{o} 3C 3{M}", "1C 1S 2C 2H 2S"]
  call: "4{M}"
  cond: "hl >= 12 and {M} >= 5"
  forcing: SO
  meaning: "Fit 5-3 : manche"
  meaning_en: "5-3 fit: game"
  status: infere
- id: "tcf.{o}{M}.c3Mfit"
  for: [{o: C, M: H, t: D, x: 2H}, {o: C, M: S, t: D, x: 2S}, {o: D, M: S, t: H, x: 2S}]
  seq: "1{o} 1{M} 2{o} 2{t} {x}"
  call: "3{M}"
  cond: "{M} >= 5"
  forcing: INV
  meaning: "Fit 5-3, 11 H : invitation"
  meaning_en: "5-3 fit, 11 HCP: invitation"
  status: infere
- id: "tcf.{o}{M}.c4M6"
  for: [{o: C, M: H, t: D, x: "2H|3H|3D|2NT|3C"}, {o: C, M: S, t: D, x: "2S|3S|3D|2NT|3C|2H"}, {o: D, M: H, t: S, x: "3H|3S|2NT|3D"}, {o: D, M: S, t: H, x: "2S|3S|3H|2NT|3D|3C"}]
  seq: ["1{o} 1{M} 2{o} 2{t} {x}", "1{o} 1{M} 2{o} 3C {x}"]
  call: "4{M}"
  cond: "hl >= 12 and {M} >= 6"
  forcing: SO
  meaning: "6 cartes : manche dans la majeure"
  meaning_en: "6 cards: game in the major"
  status: infere
- id: "tcf.{o}{M}.c3NT"
  for: [{o: C, M: H, t: D, x: "2H|3H|3D|2NT|3C"}, {o: C, M: S, t: D, x: "2S|3S|3D|2NT|3C|2H"}, {o: D, M: H, t: S, x: "3H|3S|2NT|3D"}, {o: D, M: S, t: H, x: "2S|3S|3H|2NT|3D|3C"}]
  seq: ["1{o} 1{M} 2{o} 2{t} {x}", "1{o} 1{M} 2{o} 3C {x}"]
  call: 3NT
  cond: "hl >= 11"
  forcing: SO
  meaning: "Manche à SA"
  meaning_en: "Game in NT"
  status: infere
# L'ouvreur a soutenu la 3e couleur : il a 5 cartes dans sa mineure (répétée) et 4 dans la 3e couleur. Sans fit dans la 3e couleur (2 cartes au plus), le répondant ne la laisse pas jouer : 3SA avec l'arrêt dans la 4e couleur, sinon retour à la mineure de l'ouvreur.
# en: Opener raised the third suit: 5 cards in the rebid minor and 4 in the third suit. With no fit in the third suit (2 cards at most), responder does not leave it in: 3NT with a stopper in the fourth suit, otherwise back to opener's minor.
- id: "tcf.{o}{M}.nofit.3NT"
  for: [{o: C, M: H, t: D, f: S}, {o: C, M: S, t: D, f: H}, {o: D, M: H, t: S, f: C}, {o: D, M: S, t: H, f: C}]
  seq: "1{o} 1{M} 2{o} 2{t} 3{t}"
  call: 3NT
  cond: "{t} <= 2 and stop('{f}')"
  forcing: SO
  meaning: "Pas de fit dans la 3e couleur, arrêt dans la 4e : 3SA"
  meaning_en: "No fit in the third suit, fourth suit stopped: 3NT"
  status: infere
- id: "tcf.{o}{M}.nofit.4o"
  for: [{o: C, M: H, t: D}, {o: C, M: S, t: D}, {o: D, M: H, t: S}, {o: D, M: S, t: H}]
  seq: "1{o} 1{M} 2{o} 2{t} 3{t}"
  call: "4{o}"
  cond: "{t} <= 2"
  forcing: NF
  meaning: "Pas de fit dans la 3e couleur ni d'arrêt dans la 4e : retour à la mineure 5e de l'ouvreur"
  meaning_en: "No fit in the third suit and no fourth-suit stopper: back to opener's 5-card minor"
  status: infere
- id: "tcf.{o}{M}.cp"
  for: [{o: C, M: H, t: D, x: "2H|3H|3D|2NT|3C"}, {o: C, M: S, t: D, x: "2S|3S|3D|2NT|3C|2H"}, {o: D, M: H, t: S, x: "3H|3S|2NT|3D"}, {o: D, M: S, t: H, x: "2S|3S|3H|2NT|3D|3C"}]
  seq: ["1{o} 1{M} 2{o} 2{t} {x}", "1{o} 1{M} 2{o} 3C {x}"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "11 H : partielle"
  meaning_en: "11 HCP: partscore"
  status: infere
- id: tcf.2H.2NT.r
  seq: "1C 1S 2C 2H 2NT"
  call: 3NT
  cond: "hl >= 12"
  forcing: SO
  meaning: "Manche à SA"
  meaning_en: "Game in NT"
  status: infere
- id: tcf.2H.2S.r
  seq: "1C 1S 2C 2H 2S"
  call: 4S
  cond: "hl >= 12"
  forcing: SO
  meaning: "Manche à ♠"
  meaning_en: "Game in ♠"
  status: infere
- id: tcf.2H.p
  seq: ["1C 1S 2C 2H 2NT|2S"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "Partielle"
  meaning_en: "Partscore"
  status: infere
- id: "tcf.inv.{k}"
  for: [{k: a, M: S, s: "1C 1S 2C 2D 2S 3S"}, {k: b, M: S, s: "1D 1S 2D 2H 2S 3S"}, {k: c, M: H, s: "1C 1H 2C 2D 2H 3H"}]
  seq: "{s}"
  call: "4{M}"
  cond: "hl >= 14"
  forcing: SO
  meaning: "Accepte l'invitation"
  meaning_en: "Accepts the invitation"
  status: infere
- id: tcf.inv.p
  seq: ["1C 1S 2C 2D 2S 3S", "1D 1S 2D 2H 2S 3S", "1C 1H 2C 2D 2H 3H"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "Minimum"
  meaning_en: "Minimum"
  status: infere
- id: q.st.4NT
  seq: ["1NT 2C 2D|2H|2S 4NT", "1NT (X) 2C 2D|2H|2S 4NT"]
  call: 6NT
  cond: "hl >= 16"
  forcing: SO
  meaning: "Accepte le quantitatif"
  meaning_en: "Accepts the quantitative bid"
  status: infere
- id: q.1m.4NT
  seq: "1C|1D 4NT"
  call: 6NT
  cond: "hl >= 13"
  forcing: SO
  meaning: "Accepte le quantitatif (19-20 en face)"
  meaning_en: "Accepts the quantitative bid (19-20 opposite)"
  status: infere
- id: q.p
  seq: ["1NT 2C 2D|2H|2S 4NT", "1C|1D 4NT", "1NT (X) 2C 2D|2H|2S 4NT"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "Refuse"
  meaning_en: "Declines"
  status: infere

# ======================================================================
# A.16 4e couleur forcing
# ======================================================================
# en: A.16 Fourth suit forcing
# Le répondant nomme la 4e couleur pour rallonger sa couleur, demander l'arrêt pour SA ou rendre l'enchère forcing ; elle est forcing de manche. Réponses de l'ouvreur, par ordre de priorité : 3 cartes dans la majeure du répondant, 2SA (ou 3SA) avec l'arrêt dans la 4e couleur (mini-maxi : 12-15 ou 18-19 HL), répétition de la 2e couleur avec 5 cartes, soutien de la 4e couleur mineure au palier de 3 avec As troisième et ouverture non minimum, répétition de la 1re couleur sans autre enchère possible. La répétition à saut de la mineure promet 6 cartes au moins.
# en: Responder bids the fourth suit to show extra length, ask for a stopper for NT, or make the auction forcing; it is game forcing. Opener's answers, in order of priority: three cards in responder's major, 2NT (or 3NT) with the fourth-suit stopper (mini-maxi: 12-15 or 18-19 HL), rebid of the second suit with 5 cards, raise of a fourth-suit minor at the three level with Axx and a non-minimum opening, rebid of the first suit with nothing else to bid. A jump rebid of the minor promises at least 6 cards.
- id: "fcf.{k}.ask"
  for: [{k: a, s: "1C 1H 1S", call: 2D, F: D, M: H, o2: S}, {k: b, s: "1D 1H 1S", call: 2C, F: C, M: H, o2: S}, {k: c, s: "1D 1S 2C", call: 2H, F: H, M: S, o2: C}, {k: e, s: "1H 1S 2C", call: 2D, F: D, M: S, o2: C}, {k: f, s: "1H 1S 2D", call: 3C, F: C, M: S, o2: D}]
  seq: "{s}"
  call: "{call}"
  cond: "hl >= 11 and not ({o2} >= 4 and '{o2}' in ('H', 'S')) and {M} < 6 and not ((balanced or semibalanced) and stop('{F}'))"
  forcing: FM
  meaning: "4e couleur forcing"
  meaning_en: "Fourth suit forcing"
  status: sef
  alert: true
# --- réponses de l'ouvreur, par ordre de priorité (forcing de manche)
# en: opener's answers, in order of priority (game forcing)
- id: "fcf.{k}.fitM"
  for: [{k: a, s: "1C 1H 1S 2D", M: H, c: 2H}, {k: b, s: "1D 1H 1S 2C", M: H, c: 2H}, {k: c, s: "1D 1S 2C 2H", M: S, c: 2S}, {k: e, s: "1H 1S 2C 2D", M: S, c: 2S}, {k: f, s: "1H 1S 2D 3C", M: S, c: 3S}]
  seq: "{s}"
  call: "{c}"
  cond: "{M} >= 3"
  forcing: FM
  meaning: "3 cartes dans la majeure du répondant"
  meaning_en: "3 cards in responder's major"
  status: sef
- id: "fcf.{k}.nt"
  for: [{k: a, s: "1C 1H 1S 2D", F: D, nt: 2NT, fo: FM}, {k: b, s: "1D 1H 1S 2C", F: C, nt: 2NT, fo: FM}, {k: c, s: "1D 1S 2C 2H", F: H, nt: 2NT, fo: FM}, {k: e, s: "1H 1S 2C 2D", F: D, nt: 2NT, fo: FM}, {k: f, s: "1H 1S 2D 3C", F: C, nt: 3NT, fo: SO}]
  seq: "{s}"
  call: "{nt}"
  cond: "stop('{F}')"
  forcing: "{fo}"
  meaning: "Arrêt dans la 4e couleur (2SA : 12-15 ou 18-19 HL)"
  meaning_en: "Stopper in the fourth suit (2NT: 12-15 or 18-19 HL)"
  status: sef
- id: "fcf.{k}.rebid2"
  for: [{k: a, s: "1C 1H 1S 2D", o2: S, c: 2S}, {k: b, s: "1D 1H 1S 2C", o2: S, c: 2S}, {k: c, s: "1D 1S 2C 2H", o2: C, c: 3C}, {k: e, s: "1H 1S 2C 2D", o2: C, c: 3C}, {k: f, s: "1H 1S 2D 3C", o2: D, c: 3D}]
  seq: "{s}"
  call: "{c}"
  cond: "{o2} >= 5"
  forcing: FM
  meaning: "Répétition de la 2e couleur : 5 cartes"
  meaning_en: "Rebid of the second suit: 5 cards"
  status: sef
- id: "fcf.{k}.raiseF"
  for: [{k: a, s: "1C 1H 1S 2D", F: D}, {k: b, s: "1D 1H 1S 2C", F: C}, {k: e, s: "1H 1S 2C 2D", F: D}]
  seq: "{s}"
  call: "3{F}"
  cond: "{F} >= 3 and ace('{F}') and hl >= 13"
  forcing: FM
  meaning: "As troisième dans la 4e couleur, ouverture non minimum"
  meaning_en: "Third-round ace in the fourth suit, non-minimum opening"
  status: sef
- id: fcf.b.jump
  seq: "1D 1H 1S 2C"
  call: 3D
  cond: "D >= 6"
  forcing: FM
  meaning: "Répétition à saut de la mineure : 6+ cartes"
  meaning_en: "Jump rebid of the minor: 6+ cards"
  status: sef
- id: "fcf.{k}.rebid"
  for: [{k: a, s: "1C 1H 1S 2D", c: 3C}, {k: b, s: "1D 1H 1S 2C", c: 2D}, {k: c, s: "1D 1S 2C 2H", c: 3D}, {k: e, s: "1H 1S 2C 2D", c: 2H}, {k: f, s: "1H 1S 2D 3C", c: 3H}]
  seq: "{s}"
  call: "{c}"
  cond: "true"
  forcing: FM
  meaning: "Répétition de la couleur d'ouverture, sans autre enchère possible"
  meaning_en: "Rebid of the opening suit, nothing else to bid"
  status: sef
# --- conclusion du répondant
# en: responder's conclusion
- id: "fcf.{k}.c4Mfit"
  for: [{k: a, s: "1C 1H 1S 2D 2H", M: H}, {k: b, s: "1D 1H 1S 2C 2H", M: H}, {k: c, s: "1D 1S 2C 2H 2S", M: S}, {k: e, s: "1H 1S 2C 2D 2S", M: S}, {k: f, s: "1H 1S 2D 3C 3S", M: S}]
  seq: "{s}"
  call: "4{M}"
  cond: "{M} >= 5"
  forcing: SO
  meaning: "Fit 5-3 : manche"
  meaning_en: "5-3 fit: game"
  status: infere
- id: "fcf.{k}.c4M6"
  for: [{k: a, s: "1C 1H 1S 2D", M: H}, {k: b, s: "1D 1H 1S 2C", M: H}, {k: c, s: "1D 1S 2C 2H", M: S}, {k: e, s: "1H 1S 2C 2D", M: S}, {k: f, s: "1H 1S 2D 3C", M: S}]
  seq: "{s} *"
  call: "4{M}"
  cond: "{M} >= 6"
  forcing: SO
  meaning: "6 cartes : manche dans la majeure"
  meaning_en: "6 cards: game in the major"
  status: infere
- id: "fcf.{k}.c4o2"
  for: [{k: a, s: "1C 1H 1S 2D 2S"}, {k: b, s: "1D 1H 1S 2C 2S"}]
  seq: "{s}"
  call: 4S
  cond: "S >= 3"
  forcing: SO
  meaning: "Fit 5-3 dans la 2e couleur de l'ouvreur : manche"
  meaning_en: "5-3 fit in opener's second suit: game"
  status: infere
- id: "fcf.{k}.c3NT"
  for: [{k: a, s: "1C 1H 1S 2D"}, {k: b, s: "1D 1H 1S 2C"}, {k: c, s: "1D 1S 2C 2H"}, {k: e, s: "1H 1S 2C 2D"}, {k: f, s: "1H 1S 2D 3C"}]
  seq: "{s} 2NT|2D|2H|2S|3C|3D|3H|3S"
  call: 3NT
  cond: "true"
  forcing: SO
  meaning: "Manche à SA"
  meaning_en: "Game in NT"
  status: infere
- id: "fcf.{k}.c3NT.p"
  for: [{k: f, s: "1H 1S 2D 3C"}]
  seq: "{s} 3NT"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Fin"
  meaning_en: "End"
  status: infere
# --- l'ouvreur 18-19 après 2SA – 3SA : continue (fiche : 4 dans la majeure avec 3 cartes, sinon 4SA)
# en: 18-19 opener after 2NT – 3NT: goes on (card: four of the major with 3 cards, otherwise 4NT)
- id: "fcf.{k}.mm.4M"
  for: [{k: a, s: "1C 1H 1S 2D", M: H}, {k: b, s: "1D 1H 1S 2C", M: H}, {k: c, s: "1D 1S 2C 2H", M: S}, {k: e, s: "1H 1S 2C 2D", M: S}]
  seq: "{s} 2NT 3NT"
  call: "4{M}"
  cond: "hl >= 17 and {M} >= 3"
  forcing: NF
  meaning: "18-19 avec 3 cartes dans la majeure"
  meaning_en: "18-19 with 3 cards in the major"
  status: sef
- id: "fcf.{k}.mm.4NT"
  for: [{k: a, s: "1C 1H 1S 2D"}, {k: b, s: "1D 1H 1S 2C"}, {k: c, s: "1D 1S 2C 2H"}, {k: e, s: "1H 1S 2C 2D"}]
  seq: "{s} 2NT 3NT"
  call: 4NT
  cond: "hl >= 17"
  forcing: INV
  meaning: "18-19 : quantitatif"
  meaning_en: "18-19: quantitative"
  status: sef
- id: "fcf.{k}.mm.6NT"
  for: [{k: a, s: "1C 1H 1S 2D"}, {k: b, s: "1D 1H 1S 2C"}, {k: c, s: "1D 1S 2C 2H"}, {k: e, s: "1H 1S 2C 2D"}]
  seq: "{s} 2NT 3NT 4NT"
  call: 6NT
  cond: "hl >= 13"
  forcing: SO
  meaning: "Accepte"
  meaning_en: "Accepts"
  status: infere
- id: "fcf.{k}.mm.p"
  for: [{k: a, s: "1C 1H 1S 2D"}, {k: b, s: "1D 1H 1S 2C"}, {k: c, s: "1D 1S 2C 2H"}, {k: e, s: "1H 1S 2C 2D"}]
  seq: "{s} 2NT 3NT 4NT"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Refuse"
  meaning_en: "Declines"
  status: infere

# ======================================================================
# A.17 Check-back Stayman (SEF 2018, option)
# ======================================================================
# en: A.17 Checkback Stayman (SEF 2018, optional)
# Actif seulement si l'option `checkback2018` est activée.
# en: Active only when the `checkback2018` option is enabled.
- id: 1D.1S.2NT.3C
  option: checkback2018
  seq: "1D 1S 2NT"
  call: 3C
  cond: "hcp >= 6 and (S == 5 or H >= 4)"
  forcing: F1
  meaning: "Check-back : demande le nombre de ♥ et de ♠"
  meaning_en: "Check-back: asks for the number of hearts and spades"
  status: sef2018
  alert: true
- id: 1D.1S.2NT.3C.3D
  option: checkback2018
  seq: "1D 1S 2NT 3C"
  call: 3D
  cond: "D >= 5"
  forcing: F1
  meaning: "5 cartes à ♦ ou espoir de chelem"
  meaning_en: "5 diamonds or slam interest"
  status: sef2018
- id: 1D.1S.2NT.3C.3H
  option: checkback2018
  seq: "1D 1S 2NT 3C"
  call: 3H
  cond: "H >= 4"
  forcing: F1
  meaning: "4♥, peut-être 3♠"
  meaning_en: "4♥, maybe 3♠"
  status: sef2018
