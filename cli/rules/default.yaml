  seq: "BW:{t} 4NT * 5NT {k}"
  call: "6{t}"
  cond: "true"
  forcing: SO
  meaning: "Petit chelem"
  meaning_en: "Small slam"
  status: infere

# ======================================================================
# A.13 Contrôles et suites de chelem
# ======================================================================
# Contrôle du 1er tour : As ou chicane (`ctrl1`). Contrôle du 2e tour : Roi ou singleton (`ctrl2`). On nomme les contrôles **du moins cher au plus cher**, en commençant par ceux du 1er tour. Un Splinter est valorisé quand le partenaire n'a pas de points perdus dans la courte (`hcp_in(courte) <= 1`).
# --- 1M – 3M (11-12 DH) : Blackwood de l'ouvreur
- id: "sl.1{M}.3{M}.bw"
  for: [{M: H, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: S, km: "true"}]
  seq: "1{M} 3{M}"
  call: 4NT
  cond: "hld >= 20 and ({km})"
  forcing: ASK
  meaning: "Blackwood 5 clés"
  meaning_en: "5-keycard Blackwood"
  status: infere
  alert: true
  trump: "{M}"
# --- Splinter du répondant : l'ouvreur sans points perdus dans la courte pose le Blackwood
- id: "sl.spl.{M}.{s}.bw"
  for: [{M: H, s: C, c: 4C, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: H, s: D, c: 4D, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: H, s: S, c: 3S, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: S, s: C, c: 4C, km: "true"}, {M: S, s: D, c: 4D, km: "true"}, {M: S, s: H, c: 4H, km: "true"}]
  seq: "1{M} {c}"
  call: 4NT
  cond: "hl >= 15 and hcp_in('{s}') <= 1 and ({km})"
  forcing: ASK
  meaning: "Splinter valorisant : Blackwood"
  meaning_en: "Improving splinter: Blackwood"
  status: infere
  alert: true
  trump: "{M}"
- id: "sl.spl.{M}.{s}.4M"
  for: [{M: H, s: C, c: 4C}, {M: H, s: D, c: 4D}, {M: H, s: S, c: 3S}, {M: S, s: C, c: 4C}, {M: S, s: D, c: 4D}, {M: S, s: H, c: 4H}]
  seq: "1{M} {c}"
  call: "4{M}"
  cond: "true"
  forcing: SO
  meaning: "Points perdus dans la courte ou minimum : manche"
  meaning_en: "Points wasted in the short suit, or minimum: game"
  status: infere
  trump: "{M}"
# --- 1SA – Stayman – fit avec espoir de chelem : l'ouvreur nomme ses contrôles
- id: "sl.st.{M}.{c}"
  for: [{M: H, x: 3S, c: C}, {M: H, x: 3S, c: D}, {M: S, x: 3H, c: C}, {M: S, x: 3H, c: D}, {M: S, x: 3H, c: H}]
  seq: ["1NT 2C 2{M} {x}", "1NT 2C 2NT 3{M}", "1NT (X) 2C 2{M} {x}", "1NT (X) 2C 2NT 3{M}"]
  call: "4{c}"
  cond: "hl >= 16 and ctrl1('{c}')"
  forcing: F1
  meaning: "Maximum : contrôle du 1er tour dans la couleur"
  meaning_en: "Maximum: first-round control in the suit"
  status: infere
  alert: true
  trump: "{M}"
- id: "sl.st.{M}.min"
  for: [{M: H, x: 3S}, {M: S, x: 3H}]
  seq: ["1NT 2C 2{M} {x}", "1NT 2C 2NT 3{M}", "1NT (X) 2C 2{M} {x}", "1NT (X) 2C 2NT 3{M}"]
  call: "4{M}"
  cond: "true"
  forcing: NF
  meaning: "Minimum ou pas de contrôle : conclusion"
  meaning_en: "Minimum or no control: signoff"
  status: infere
  trump: "{M}"
- id: "sl.st.{M}.cue.bw"
  for: [{M: H, x: 3S, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: S, x: 3H, km: "true"}]
  seq: ["1NT 2C 2{M} {x} 4C|4D|4H", "1NT 2C 2NT 3{M} 4C|4D|4H", "1NT (X) 2C 2{M} {x} 4C|4D|4H", "1NT (X) 2C 2NT 3{M} 4C|4D|4H"]
  call: 4NT
  cond: "{km}"
  forcing: ASK
  meaning: "Après un contrôle : Blackwood"
  meaning_en: "After a control: Blackwood"
  status: infere
  alert: true
- id: "sl.st.{M}.cue.4M"
  for: [{M: H, x: 3S, c: "4C|4D"}, {M: S, x: 3H, c: "4C|4D|4H"}]
  seq: ["1NT 2C 2{M} {x} {c}", "1NT 2C 2NT 3{M} {c}", "1NT (X) 2C 2{M} {x} {c}", "1NT (X) 2C 2NT 3{M} {c}"]
  call: "4{M}"
  cond: "true"
  forcing: SO
  meaning: "Pas assez de clés : conclusion"
  meaning_en: "Not enough keycards: signoff"
  status: infere
- id: "sl.st.{M}.min.bw"
  for: [{M: H, x: 3S, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: S, x: 3H, km: "true"}]
  seq: ["1NT 2C 2{M} {x} 4{M}", "1NT 2C 2NT 3{M} 4{M}", "1NT (X) 2C 2{M} {x} 4{M}", "1NT (X) 2C 2NT 3{M} 4{M}"]
  call: 4NT
  cond: "hl >= 18 and ({km})"
  forcing: ASK
  meaning: "Chelem malgré le minimum : Blackwood"
  meaning_en: "Slam despite the minimum: Blackwood"
  status: infere
  alert: true
- id: "sl.st.{M}.min.p"
  for: [{M: H, x: 3S}, {M: S, x: 3H}]
  seq: ["1NT 2C 2{M} {x} 4{M}", "1NT 2C 2NT 3{M} 4{M}", "1NT (X) 2C 2{M} {x} 4{M}", "1NT (X) 2C 2NT 3{M} 4{M}"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "Pas de chelem"
  meaning_en: "No slam"
  status: infere
# --- 1SA – Stayman – Splinter
- id: "sl.stspl.{M}.{s}.bw"
  for: [{M: H, s: C, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: H, s: D, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: S, s: C, km: "true"}, {M: S, s: D, km: "true"}]
  seq: ["1NT 2C 2{M} 4{s}", "1NT (X) 2C 2{M} 4{s}"]
  call: 4NT
  cond: "hl >= 16 and hcp_in('{s}') <= 1 and ({km})"
  forcing: ASK
  meaning: "Maximum sans points perdus dans la courte : Blackwood"
  meaning_en: "Maximum with no points wasted in the short suit: Blackwood"
  status: infere
  alert: true
  trump: "{M}"
- id: "sl.stspl.{M}.{s}.4M"
  for: [{M: H, s: C}, {M: H, s: D}, {M: S, s: C}, {M: S, s: D}]
  seq: ["1NT 2C 2{M} 4{s}", "1NT (X) 2C 2{M} 4{s}"]
  call: "4{M}"
  cond: "true"
  forcing: SO
  meaning: "Conclusion"
  meaning_en: "Signoff"
  status: infere
  trump: "{M}"
# --- Texas mineurs : l'ouvreur juge la courte du répondant
- id: "sl.tm.{c}.3NT"
  for: [{c: 3H, s: H}, {c: 3S, s: S}]
  seq: ["1NT 2S 3C {c}", "1NT (X) 2S 3C {c}"]
  call: 3NT
  cond: "stop('{s}') and hcp_in('{s}') >= 3"
  forcing: SO
  meaning: "Arrêt (points perdus) dans la courte : 3SA"
  meaning_en: "Stop (points wasted) in the short suit: 3NT"
  status: infere
- id: "sl.tm.{c}.6C"
  for: [{c: 3H, s: H}, {c: 3S, s: S}, {c: 3NT, s: D}, {c: 4D, s: D}]
  seq: ["1NT 2S 3C {c}", "1NT (X) 2S 3C {c}"]
  call: 6C
  cond: "hl >= 16 and hcp_in('{s}') <= 1 and C >= 3 and aces >= 2"
  forcing: SO
  meaning: "Maximum, fit et contrôles, rien de perdu dans la courte : chelem"
  meaning_en: "Maximum, fit and controls, nothing wasted in the short suit: slam"
  status: infere
- id: "sl.tm.{c}.5C"
  for: [{c: 3H, s: H}, {c: 3S, s: S}, {c: 3NT, s: D}, {c: 4C, s: C}, {c: 4D, s: D}]
  seq: ["1NT 2S 3C {c}", "1NT (X) 2S 3C {c}"]
  call: 5C
  cond: "true"
  forcing: SO
  meaning: "Manche à ♣"
  meaning_en: "Game in ♣"
  status: infere
- id: sl.tmd.4C.6D
  seq: ["1NT 3C 3D 4C", "1NT (X) 3C 3D 4C"]
  call: 6D
  cond: "hl >= 16 and hcp_in('C') <= 1 and D >= 3 and aces >= 2"
  forcing: SO
  meaning: "Rien de perdu dans la courte ♣ : chelem"
  meaning_en: "Nothing wasted in the short ♣: slam"
  status: infere
# --- Saut fort du répondant (6 cartes, 16+) : Blackwood après le fit de l'ouvreur
- id: "sl.js.{k}.bw"
  for: [{k: a, s: "1C|1D 2H", X: H, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {k: b, s: "1C|1D 2S", X: S, km: "true"}, {k: c, s: "1H 2S", X: S, km: "true"}, {k: d, s: "1S 3H", X: H, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}]
  seq: "{s} 4{X}"
  call: 4NT
  cond: "hl >= 17 and ({km})"
  forcing: ASK
  meaning: "Blackwood 5 clés"
  meaning_en: "5-keycard Blackwood"
  status: infere
  alert: true
  trump: "{X}"
# --- Enchère d'essai 2SA, réponse maximum : l'ouvreur très fort pose le Blackwood
- id: "sl.ess.{M}.bw"
  for: [{M: H, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: S, km: "true"}]
  seq: "1{M} 2{M} 2NT 3C|3D|3H|4C|4D"
  call: 4NT
  cond: "hld >= 21 and ({km})"
  forcing: ASK
  meaning: "Blackwood 5 clés"
  meaning_en: "5-keycard Blackwood"
  status: infere
  alert: true
  trump: "{M}"
# --- 1M – 5M : demande de qualité d'atout
- id: "sl.q.{M}.5NT"
  for: [{M: H}, {M: S}]
  seq: "1{M} 5{M}"
  call: 5NT
  cond: "top('{M}') == 3"
  forcing: F1
  meaning: "A-R-D d'atout"
  meaning_en: "A-K-Q of trumps"
  status: sef
- id: "sl.q.{M}.6"
  for: [{M: H}, {M: S}]
  seq: "1{M} 5{M}"
  call: "6{M}"
  cond: "top('{M}') == 2"
  forcing: SO
  meaning: "2 gros honneurs à l'atout : petit chelem"
  meaning_en: "2 high honors in trumps: small slam"
  status: sef
- id: "sl.q.{M}.p"
  for: [{M: H}, {M: S}]
  seq: "1{M} 5{M}"
  call: P
  cond: "true"
  forcing: NF
  meaning: "1 gros honneur (ou aucun) à l'atout"
  meaning_en: "1 high honor (or none) in trumps"
  status: sef
- id: "sl.q.{M}.5NT.r"
  for: [{M: H}, {M: S}]
  seq: "1{M} 5{M} 5NT"
  call: "7{M}"
  cond: "aces >= 3"
  forcing: SO
  meaning: "Grand chelem"
  meaning_en: "Grand slam"
  status: infere
- id: "sl.q.{M}.5NT.6"
  for: [{M: H}, {M: S}]
  seq: "1{M} 5{M} 5NT"
  call: "6{M}"
  cond: "true"
  forcing: SO
  meaning: "Petit chelem"
  meaning_en: "Small slam"
  status: infere
# --- 2♦ fort : l'ouvreur décide du chelem d'après les As montrés
- id: "sl.2D.{X}.{a}.7"
  for: [{X: S, r: "2H|2NT", a: 0}, {X: S, r: "2S|3C|3D", a: 1}, {X: S, r: "3H|3S|3NT", a: 2}, {X: S, r: "4C|4D|4H|4S", a: 3}, {X: S, r: "4NT", a: 4}, {X: H, r: "2H|2NT", a: 0}, {X: H, r: "2S|3C|3D", a: 1}, {X: H, r: "3H|3S|3NT", a: 2}, {X: H, r: "4C|4D|4H|4S", a: 3}, {X: H, r: "4NT", a: 4}, {X: D, r: "2H|2NT", a: 0}, {X: D, r: "2S|3C|3D", a: 1}, {X: D, r: "3H|3S|3NT", a: 2}, {X: D, r: "4C|4D|4H|4S", a: 3}, {X: D, r: "4NT", a: 4}, {X: C, r: "2H|2NT", a: 0}, {X: C, r: "2S|3C|3D", a: 1}, {X: C, r: "3H|3S|3NT", a: 2}, {X: C, r: "4C|4D|4H|4S", a: 3}, {X: C, r: "4NT", a: 4}]
  seq: "2D {r}"
  call: "7{X}"
  cond: "{X} >= 5 and {X} == max(S, H, D, C) and aces + {a} == 4 and ptricks >= 12"
  forcing: SO
  meaning: "Les 4 As et 12 levées de jeu : grand chelem"
  meaning_en: "All 4 aces and 12 playing tricks: grand slam"
  status: infere
- id: "sl.2D.{X}.{a}.6"
  for: [{X: S, r: "2H|2NT", a: 0}, {X: S, r: "2S|3C|3D", a: 1}, {X: S, r: "3H|3S|3NT", a: 2}, {X: S, r: "4C|4D|4H|4S", a: 3}, {X: S, r: "4NT", a: 4}, {X: H, r: "2H|2NT", a: 0}, {X: H, r: "2S|3C|3D", a: 1}, {X: H, r: "3H|3S|3NT", a: 2}, {X: H, r: "4C|4D|4H|4S", a: 3}, {X: H, r: "4NT", a: 4}, {X: D, r: "2H|2NT", a: 0}, {X: D, r: "2S|3C|3D", a: 1}, {X: D, r: "3H|3S|3NT", a: 2}, {X: D, r: "4C|4D|4H|4S", a: 3}, {X: D, r: "4NT", a: 4}, {X: C, r: "2H|2NT", a: 0}, {X: C, r: "2S|3C|3D", a: 1}, {X: C, r: "3H|3S|3NT", a: 2}, {X: C, r: "4C|4D|4H|4S", a: 3}, {X: C, r: "4NT", a: 4}]
  seq: "2D {r}"
  call: "6{X}"
  cond: "{X} >= 5 and {X} == max(S, H, D, C) and aces + {a} >= 3 and ptricks >= 10.5"
  forcing: SO
  meaning: "Un As au plus manque : petit chelem"
  meaning_en: "At most one ace missing: small slam"
  status: infere
- id: "sl.2D.{a}.6NT"
  for: [{r: "2H|2NT", a: 0}, {r: "2S|3C|3D", a: 1}, {r: "3H|3S|3NT", a: 2}, {r: "4C|4D|4H|4S", a: 3}, {r: "4NT", a: 4}]
  seq: "2D {r}"
  call: 6NT
  cond: "balanced and aces + {a} >= 3 and hcp >= 25"
  forcing: SO
  meaning: "Régulier, un As au plus manque : 6SA"
  meaning_en: "Balanced, at most one ace missing: 6NT"
  status: infere
# --- chelems à SA par les points (règle de la fiche : 4SA qui suit directement une enchère à SA est quantitatif)
- id: q.2NT.5NT
  seq: ["2NT 5NT", "2C 2D 2NT 5NT"]
  call: 6NT
  cond: "true"
