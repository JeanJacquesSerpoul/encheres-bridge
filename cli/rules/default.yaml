  seq: "1{o} 1{M} 2{o} 2{t}"
  call: 2NT
  cond: "stop('{f}')"
  forcing: NF
  meaning: "Arrêt dans la 4e couleur"
  meaning_en: "Stopper in the fourth suit"
  status: sef
- id: "tcf.{o}{M}.rebid"
  for: [{o: C, M: H, t: D, f: S}, {o: C, M: S, t: D, f: H}, {o: D, M: H, t: S, f: C}, {o: D, M: S, t: H, f: C}]
  seq: "1{o} 1{M} 2{o} 2{t}"
  call: "3{o}"
  cond: "true"
