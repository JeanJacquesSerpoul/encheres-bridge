  seq: "{s} 1NT 2NT"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Minimum : on joue 2SA"
  meaning_en: "Minimum: play 2NT"
  status: infere

# --- le répondant de 1SA après le bicolore à saut de l'ouvreur (forcing de manche)
# en: the 1NT responder after opener's jump shift (game forcing)
- id: "js.1S.1NT.3H.4H"
  seq: "1S 1NT 3H"
