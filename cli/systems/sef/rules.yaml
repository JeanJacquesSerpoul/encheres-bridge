  seq: "{s} 1NT 2NT"
  call: 3NT
  cond: "hcp >= 8"
  forcing: SO
  meaning: "Maximum : 3SA"
  meaning_en: "Maximum: 3NT"
  status: infere
- id: "o4.{s}.1NT.2NT.P"
