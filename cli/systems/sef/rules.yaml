- id: 3NT.4C.pass
  seq: "3NT 4C"
  call: P
  cond: "true"
  forcing: NF
  meaning: "La mineure est ♣"
  meaning_en: "The minor is ♣"
  status: sef
- id: "3NT.4D.4{M}"
  for: [{M: H, s: "♥"}, {M: S, s: "♠"}]
  seq: "3NT 4D"
  call: "4{M}"
  cond: "{M} <= 1"
  forcing: F1
  meaning: "Courte à {s}"
  meaning_en: "Shortness in {s}"
  status: choix
- id: 3NT.4D.5C
  seq: "3NT 4D"
  call: 5C
  cond: "min(C, D) <= 1"
  forcing: F1
  meaning: "Courte dans l'autre mineure"
  meaning_en: "Shortness in the other minor"
