- id: "bwa.{t}.low.pass"
  for: [{t: D, r: 5D}, {t: C, r: 5C}]
  seq: "BW:{t} 4NT {r}"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Deux clés manquent : la réponse est le contrat"
  meaning_en: "Two keycards missing: the answer is the contract"
