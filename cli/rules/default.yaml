  status: sef
- id: "def.{o}.2{s}"
  for: [{o: 1D, s: C, a: H, b: S}, {o: 1H, s: D, a: C, b: S}, {o: 1H, s: C, a: D, b: S}, {o: 1S, s: H, a: C, b: D}, {o: 1S, s: D, a: C, b: H}, {o: 1S, s: C, a: D, b: H}]
