  for: [{M: H, c: 3C, t: "C >= 4 and C >= D"}, {M: H, c: 3D, t: "D >= 4"}, {M: S, c: 3H, t: "H >= 4"}, {M: S, c: 3C, t: "C >= 4 and C >= D"}, {M: S, c: 3D, t: "D >= 4"}]
  seq: "1{M} 1NT"
  call: "{c}"
  cond: "{t} and hl >= 19"
  forcing: FM
