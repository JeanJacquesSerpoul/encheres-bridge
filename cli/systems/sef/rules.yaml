# Le répondant conclut sans connaître la mineure : 5♣ ou 6♣, que l'ouvreur corrige à ♦. Face à une
# courte majeure, il demande le chelem s'il n'y a pas d'honneurs perdus (un V au plus).
# en: Responder concludes without knowing the minor: 5♣ or 6♣, which opener corrects to ♦. Opposite a
# en: major shortness, he bids the slam when he has no wasted honours there (a jack at most).
- id: "3NT.4D.4{M}.6C"
  for: [{M: H}, {M: S}]
  seq: "3NT 4D 4{M}"
  call: 6C
  cond: "hcp_in('{M}') <= 1"
  forcing: REL
  meaning: "Pas d'honneurs perdus face à la courte : 6♣, l'ouvreur corrige à ♦"
  meaning_en: "No wasted honours opposite the shortness: 6♣, opener corrects to ♦"
  status: choix
- id: "3NT.4D.4{M}.5C"
  for: [{M: H}, {M: S}]
  seq: "3NT 4D 4{M}"
  call: 5C
  cond: "true"
  forcing: REL
  meaning: "Honneurs perdus face à la courte : 5♣, l'ouvreur corrige à ♦"
  meaning_en: "Wasted honours opposite the shortness: 5♣, opener corrects to ♦"
  status: choix
- id: 3NT.4D.5C.6C
  seq: "3NT 4D 5C"
  call: 6C
  cond: "true"
  forcing: REL
  meaning: "6♣, l'ouvreur corrige à ♦"
  meaning_en: "6♣, opener corrects to ♦"
  status: choix
- id: 3NT.4D.4NT.6C
  seq: "3NT 4D 4NT"
  call: 6C
  cond: "hcp >= 19"
  forcing: REL
  meaning: "19+ H : 6♣, l'ouvreur corrige à ♦"
  meaning_en: "19+ HCP: 6♣, opener corrects to ♦"
  status: choix
- id: 3NT.4D.4NT.5C
  seq: "3NT 4D 4NT"
  call: 5C
  cond: "true"
  forcing: REL
  meaning: "5♣, l'ouvreur corrige à ♦"
  meaning_en: "5♣, opener corrects to ♦"
  status: choix
- id: "3NT.4D.x.{l}C.{l}D"
  for: [{l: 5, s: "4H|4S|4NT"}, {l: 6, s: "4H|4S|4NT|5C"}]
  seq: "3NT 4D {s} {l}C"
  call: "{l}D"
  cond: "D >= 7"
  forcing: SO
  meaning: "La mineure est ♦"
  meaning_en: "The minor is ♦"
  status: choix
- id: "3NT.4D.x.{l}C.P"
  for: [{l: 5, s: "4H|4S|4NT"}, {l: 6, s: "4H|4S|4NT|5C"}]
  seq: "3NT 4D {s} {l}C"
  call: P
  cond: "true"
  forcing: NF
  meaning: "La mineure est ♣"
  meaning_en: "The minor is ♣"
  status: choix
- id: 4NT.r.5D
  seq: "4NT"
  call: 5D
  cond: "D > C"
  forcing: SO
  meaning: "Préférence ♦"
  meaning_en: "Prefers ♦"
  status: sef
- id: 4NT.r.5C
  seq: "4NT"
  call: 5C
  cond: "true"
  forcing: SO
  meaning: "Préférence ♣"
  meaning_en: "Prefers ♣"
  status: sef
- id: "4{X}.r.pass"
  for: [{X: C}, {X: D}, {X: H}, {X: S}]
  seq: "4{X}"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Passe (les enchères de contrôle et le Blackwood sont en Partie B)"
  meaning_en: "Pass (control bids and Blackwood are in Part B)"
  status: sef

# ======================================================================
# A.11 Blackwood 5 clés : réponses
# ======================================================================
# en: A.11 Keycard Blackwood: responses
# Réponses au 4SA Blackwood quand l'atout convenu est `{t}` (voir A.12 pour l'atout convenu, les entrées et la suite). Les réponses avec chicane (5SA, 6♣, 6♦) ne sont utilisées qu'avec un atout majeur.
# en: Responses to Blackwood 4NT when the agreed trump is `{t}` (see A.12 for the agreed trump, the entries and the continuation). The void-showing responses (5NT, 6♣, 6♦) are used only with a major-suit trump.
- id: "bw.{t}.6D"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT"
  call: 6D
  cond: "keycards('{t}') in (1, 3) and D == 0 and '{t}' in ('S', 'H')"
  forcing: NF
  meaning: "3 ou 1 clé + chicane ♦"
  meaning_en: "3 or 1 keycard + ♦ void"
  status: sef
- id: "bw.{t}.6C"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT"
  call: 6C
  cond: "keycards('{t}') in (1, 3) and C == 0 and '{t}' in ('S', 'H')"
  forcing: NF
  meaning: "3 ou 1 clé + chicane ♣"
  meaning_en: "3 or 1 keycard + ♣ void"
  status: sef
- id: "bw.{t}.5NT"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT"
  call: 5NT
  cond: "keycards('{t}') in (2, 4) and min(S, H, D, C) == 0 and '{t}' in ('S', 'H')"
  forcing: NF
  meaning: "2 clés (ou 4) et une chicane"
  meaning_en: "2 keycards (or 4) and a void"
  status: sef
- id: "bw.{t}.5S"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT"
  call: 5S
  cond: "keycards('{t}') == 2 and queen('{t}')"
  forcing: NF
  meaning: "2 clés avec la Dame d'atout"
  meaning_en: "2 keycards with the trump queen"
  status: sef
- id: "bw.{t}.5H"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT"
  call: 5H
  cond: "keycards('{t}') == 2"
  forcing: NF
  meaning: "2 clés sans la Dame d'atout"
  meaning_en: "2 keycards without the trump queen"
  status: sef
- id: "bw.{t}.5D"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT"
  call: 5D
  cond: "keycards('{t}') in (1, 4)"
  forcing: NF
  meaning: "4 ou 1 clé"
  meaning_en: "4 or 1 keycard"
  status: sef
- id: "bw.{t}.5C"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT"
  call: 5C
  cond: "true"
  forcing: NF
  meaning: "3 ou 0 clé"
  meaning_en: "3 or 0 keycards"
  status: sef

# ======================================================================
# A.12 Blackwood : entrées, demandeur, grand chelem
# ======================================================================
# en: A.12 Blackwood: entries, asker, grand slam
# L'atout convenu est un **état** de l'enchère : une règle qui porte `trump: X` fixe l'atout à X quand elle est choisie. Les règles `BW:X …` ne s'appliquent que si l'atout convenu est X (le préfixe vaut « n'importe quel début de séquence »). Condition de la fiche pour poser le Blackwood (jeu 30/41) : ♠ aucune clé exigée ; ♥ 2 clés ou 1 clé + la Dame ; ♦ 2 clés ; ♣ 3 clés.
# en: The agreed trump is a **state** of the auction: a rule carrying `trump: X` sets the trump to X when it is chosen. `BW:X …` rules apply only when the agreed trump is X (the prefix stands for “any start of the sequence”). Condition on the card for asking Blackwood (30/41 deck): ♠ no key card required; ♥ 2 key cards, or 1 key card + the Queen; ♦ 2 key cards; ♣ 3 key cards.
# --- demandeur après la réponse au Blackwood 5 clés (total de clés déduit de sa main)
# en: asker after the keycard response (total keycards from his own hand)
- id: "bwa.{t}.5S.5NT"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT 5S"
  call: 5NT
  cond: "keycards('{t}') == 3 and hl >= 19"
  forcing: ASK
  meaning: "Toutes les clés et la Dame : Blackwood aux Rois, proposition de grand chelem"
  meaning_en: "All keycards and the queen: king-ask Blackwood, grand slam try"
  status: sef
  alert: true
- id: "bwa.{t}.5D.5NT"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT 5D"
  call: 5NT
  cond: "keycards('{t}') == 4 and queen('{t}') and hl >= 19"
  forcing: ASK
  meaning: "Toutes les clés et la Dame : Blackwood aux Rois, proposition de grand chelem"
  meaning_en: "All keycards and the queen: king-ask Blackwood, grand slam try"
  status: sef
  alert: true
- id: "bwa.{t}.5C.6"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT 5C"
  call: "6{t}"
  cond: "keycards('{t}') == 4 or keycards('{t}') in (1, 2)"
  forcing: SO
  meaning: "Réponse 0 ou 3 clés : au plus une clé manque, petit chelem"
  meaning_en: "Answer 0 or 3 keycards: at most one keycard missing, small slam"
  status: infere
- id: "bwa.{t}.5D.6"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT 5D"
  call: "6{t}"
  cond: "keycards('{t}') >= 3 or keycards('{t}') <= 1"
  forcing: SO
  meaning: "Réponse 1 ou 4 clés : au plus une clé manque, petit chelem"
  meaning_en: "Answer 1 or 4 keycards: at most one keycard missing, small slam"
  status: infere
- id: "bwa.{t}.5H.6"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT 5H"
  call: "6{t}"
  cond: "keycards('{t}') >= 2"
  forcing: SO
  meaning: "Réponse 2 clés sans la Dame : au plus une clé manque, petit chelem"
  meaning_en: "Answer 2 keycards without the queen: at most one keycard missing, small slam"
  status: infere
- id: "bwa.{t}.5S.6"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT 5S"
  call: "6{t}"
  cond: "keycards('{t}') >= 2"
  forcing: SO
  meaning: "Réponse 2 clés avec la Dame : au plus une clé manque, petit chelem"
  meaning_en: "Answer 2 keycards with the queen: at most one keycard missing, small slam"
  status: infere
- id: "bwa.{t}.low.5"
  for: [{t: S, r: "5C|5D|5H"}, {t: H, r: "5C|5D"}, {t: D, r: "5C"}]
  seq: "BW:{t} 4NT {r}"
  call: "5{t}"
  cond: "true"
  forcing: SO
  meaning: "Deux clés manquent : on s'arrête à 5"
  meaning_en: "Two keycards missing: stop at 5"
  status: infere
- id: "bwa.{t}.low.pass"
  for: [{t: D, r: 5D}, {t: C, r: 5C}]
  seq: "BW:{t} 4NT {r}"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Deux clés manquent : la réponse est le contrat"
  meaning_en: "Two keycards missing: the answer is the contract"
  status: infere
- id: "bwa.{t}.low.6"
  for: [{t: H, r: "5S|5NT|6C|6D"}, {t: S, r: "5S|5NT|6C|6D"}, {t: D, r: "5H|5S"}, {t: C, r: "5D|5H|5S"}]
  seq: "BW:{t} 4NT {r}"
  call: "6{t}"
  cond: "true"
  forcing: SO
  meaning: "Petit chelem (ou pas de palier de 5 disponible)"
  meaning_en: "Small slam (or no 5-level available)"
  status: infere
# --- Blackwood aux Rois à 5SA : 7 avec 13 levées, sinon le Roi le plus économique
# en: 5NT king ask: grand slam with 13 tricks, otherwise the cheapest king
- id: "bwk.{t}.7"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT * 5NT"
  call: "7{t}"
  cond: "kings - king('{t}') >= 2 or (kings - king('{t}') >= 1 and ptricks >= 7)"
  forcing: SO
  meaning: "13 levées comptées : grand chelem"
  meaning_en: "13 tricks counted: grand slam"
  status: infere
- id: "bwk.{t}.king{k}"
  for: [{t: S, k: C}, {t: S, k: D}, {t: S, k: H}, {t: H, k: C}, {t: H, k: D}, {t: D, k: C}]
  seq: "BW:{t} 4NT * 5NT"
  call: "6{k}"
  cond: "king('{k}')"
  forcing: F1
  meaning: "Roi dans la couleur (ordre économique)"
  meaning_en: "King in the suit (economical order)"
  status: sef
- id: "bwk.{t}.6"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT * 5NT"
  call: "6{t}"
  cond: "true"
  forcing: SO
  meaning: "Pas de Roi à montrer : petit chelem"
  meaning_en: "No king to show: small slam"
  status: sef
- id: "bwk.{t}.after"
  for: [{t: S, k: "6C|6D|6H"}, {t: H, k: "6C|6D"}, {t: D, k: "6C"}]
  seq: "BW:{t} 4NT * 5NT {k}"
  call: "7{t}"
  cond: "ptricks >= 9"
  forcing: SO
  meaning: "Le Roi montré suffit : grand chelem"
  meaning_en: "The king shown is enough: grand slam"
  status: infere
- id: "bwk.{t}.after6"
  for: [{t: S, k: "6C|6D|6H"}, {t: H, k: "6C|6D"}, {t: D, k: "6C"}]
  seq: "BW:{t} 4NT * 5NT {k}"
  call: "6{t}"
  cond: "true"
  forcing: SO
  meaning: "Petit chelem"
  meaning_en: "Small slam"
  status: infere

# ======================================================================
# A.13 Contrôles et suites de chelem
# ======================================================================
# en: A.13 Controls and slam continuations
# Contrôle du 1er tour : As ou chicane (`ctrl1`). Contrôle du 2e tour : Roi ou singleton (`ctrl2`). On nomme les contrôles **du moins cher au plus cher**, en commençant par ceux du 1er tour. Un Splinter est valorisé quand le partenaire n'a pas de points perdus dans la courte (`hcp_in(courte) <= 1`).
# en: First-round control: Ace or void (`ctrl1`). Second-round control: King or singleton (`ctrl2`). Controls are bid **cheapest first**, starting with first-round controls. A Splinter is upgraded when partner has no wasted points in the short suit (`hcp_in(short) <= 1`).
# --- 1M – 3M (11-12 DH) : Blackwood de l'ouvreur
# en: 1M – 3M (11-12 DH): opener's Blackwood
- id: "sl.1{M}.3{M}.bw"
  for: [{M: H, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: S, km: "true"}]
  seq: "1{M} 3{M}"
  call: 4NT
  cond: "hld >= 20 and ({km})"
  forcing: ASK
  meaning: "Blackwood 5 clés"
  meaning_en: "5-keycard Blackwood"
  status: infere
  alert: true
  trump: "{M}"
# --- Splinter du répondant : l'ouvreur sans points perdus dans la courte pose le Blackwood
# en: Responder's splinter: opener with no wasted values in the shortness asks for keycards
- id: "sl.spl.{M}.{s}.bw"
  for: [{M: H, s: C, c: 4C, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: H, s: D, c: 4D, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: H, s: S, c: 3S, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: S, s: C, c: 4C, km: "true"}, {M: S, s: D, c: 4D, km: "true"}, {M: S, s: H, c: 4H, km: "true"}]
  seq: "1{M} {c}"
  call: 4NT
  cond: "hl >= 15 and hcp_in('{s}') <= 1 and ({km})"
  forcing: ASK
  meaning: "Splinter valorisant : Blackwood"
  meaning_en: "Improving splinter: Blackwood"
  status: infere
  alert: true
  trump: "{M}"
- id: "sl.spl.{M}.{s}.4M"
  for: [{M: H, s: C, c: 4C}, {M: H, s: D, c: 4D}, {M: H, s: S, c: 3S}, {M: S, s: C, c: 4C}, {M: S, s: D, c: 4D}, {M: S, s: H, c: 4H}]
  seq: "1{M} {c}"
  call: "4{M}"
  cond: "true"
  forcing: SO
  meaning: "Points perdus dans la courte ou minimum : manche"
  meaning_en: "Points wasted in the short suit, or minimum: game"
  status: infere
  trump: "{M}"
# --- 1SA – Stayman – fit avec espoir de chelem : l'ouvreur nomme ses contrôles
# en: 1NT – Stayman – fit with slam interest: opener cue-bids his controls
- id: "sl.st.{M}.{c}"
  for: [{M: H, x: 3S, c: C}, {M: H, x: 3S, c: D}, {M: S, x: 3H, c: C}, {M: S, x: 3H, c: D}, {M: S, x: 3H, c: H}]
  seq: ["1NT 2C 2{M} {x}", "1NT 2C 2NT 3{M}", "1NT (X) 2C 2{M} {x}", "1NT (X) 2C 2NT 3{M}"]
  call: "4{c}"
  cond: "hl >= 15 and ctrl1('{c}')"
  forcing: F1
  meaning: "Maximum : contrôle du 1er tour dans la couleur"
  meaning_en: "Maximum: first-round control in the suit"
  status: infere
  alert: true
  trump: "{M}"
- id: "sl.st.{M}.min"
  for: [{M: H, x: 3S}, {M: S, x: 3H}]
  seq: ["1NT 2C 2{M} {x}", "1NT 2C 2NT 3{M}", "1NT (X) 2C 2{M} {x}", "1NT (X) 2C 2NT 3{M}"]
  call: "4{M}"
  cond: "true"
  forcing: NF
  meaning: "Minimum ou pas de contrôle : conclusion"
  meaning_en: "Minimum or no control: signoff"
  status: infere
  trump: "{M}"
- id: "sl.st.{M}.cue.bw"
  for: [{M: H, x: 3S, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: S, x: 3H, km: "true"}]
  seq: ["1NT 2C 2{M} {x} 4C|4D|4H", "1NT 2C 2NT 3{M} 4C|4D|4H", "1NT (X) 2C 2{M} {x} 4C|4D|4H", "1NT (X) 2C 2NT 3{M} 4C|4D|4H"]
  call: 4NT
  cond: "{km}"
  forcing: ASK
  meaning: "Après un contrôle : Blackwood"
  meaning_en: "After a control: Blackwood"
  status: infere
  alert: true
- id: "sl.st.{M}.cue.4M"
  for: [{M: H, x: 3S, c: "4C|4D"}, {M: S, x: 3H, c: "4C|4D|4H"}]
  seq: ["1NT 2C 2{M} {x} {c}", "1NT 2C 2NT 3{M} {c}", "1NT (X) 2C 2{M} {x} {c}", "1NT (X) 2C 2NT 3{M} {c}"]
  call: "4{M}"
  cond: "true"
  forcing: SO
  meaning: "Pas assez de clés : conclusion"
  meaning_en: "Not enough keycards: signoff"
  status: infere
- id: "sl.st.{M}.min.bw"
  for: [{M: H, x: 3S, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: S, x: 3H, km: "true"}]
  seq: ["1NT 2C 2{M} {x} 4{M}", "1NT 2C 2NT 3{M} 4{M}", "1NT (X) 2C 2{M} {x} 4{M}", "1NT (X) 2C 2NT 3{M} 4{M}"]
  call: 4NT
  cond: "hl >= 17 and ({km})"
  forcing: ASK
  meaning: "Chelem malgré le minimum : Blackwood"
  meaning_en: "Slam despite the minimum: Blackwood"
  status: infere
  alert: true
- id: "sl.st.{M}.min.p"
  for: [{M: H, x: 3S}, {M: S, x: 3H}]
  seq: ["1NT 2C 2{M} {x} 4{M}", "1NT 2C 2NT 3{M} 4{M}", "1NT (X) 2C 2{M} {x} 4{M}", "1NT (X) 2C 2NT 3{M} 4{M}"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "Pas de chelem"
  meaning_en: "No slam"
  status: infere
# --- 1SA – Stayman – Splinter
# en: 1NT – Stayman – splinter
- id: "sl.stspl.{M}.{s}.bw"
  for: [{M: H, s: C, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: H, s: D, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: S, s: C, km: "true"}, {M: S, s: D, km: "true"}]
  seq: ["1NT 2C 2{M} 4{s}", "1NT (X) 2C 2{M} 4{s}"]
  call: 4NT
  cond: "hl >= 15 and hcp_in('{s}') <= 1 and ({km})"
  forcing: ASK
  meaning: "Maximum sans points perdus dans la courte : Blackwood"
  meaning_en: "Maximum with no points wasted in the short suit: Blackwood"
  status: infere
  alert: true
  trump: "{M}"
- id: "sl.stspl.{M}.{s}.4M"
  for: [{M: H, s: C}, {M: H, s: D}, {M: S, s: C}, {M: S, s: D}]
  seq: ["1NT 2C 2{M} 4{s}", "1NT (X) 2C 2{M} 4{s}"]
  call: "4{M}"
  cond: "true"
  forcing: SO
  meaning: "Conclusion"
  meaning_en: "Signoff"
  status: infere
  trump: "{M}"
# --- Texas mineurs : l'ouvreur juge la courte du répondant
# en: Minor-suit transfers: opener judges responder's shortness
- id: "sl.tm.{c}.3NT"
  for: [{c: 3H, s: H}, {c: 3S, s: S}]
  seq: ["1NT 2S 3C {c}", "1NT (X) 2S 3C {c}"]
  call: 3NT
  cond: "stop('{s}') and hcp_in('{s}') >= 3"
  forcing: SO
  meaning: "Arrêt (points perdus) dans la courte : 3SA"
  meaning_en: "Stop (points wasted) in the short suit: 3NT"
  status: infere
- id: "sl.tm.{c}.6C"
  for: [{c: 3H, s: H}, {c: 3S, s: S}, {c: 3NT, s: D}, {c: 4D, s: D}]
  seq: ["1NT 2S 3C {c}", "1NT (X) 2S 3C {c}"]
  call: 6C
  cond: "hl >= 16 and hcp_in('{s}') <= 1 and C >= 3 and aces >= 2"
  forcing: SO
  meaning: "Maximum, fit et contrôles, rien de perdu dans la courte : chelem"
  meaning_en: "Maximum, fit and controls, nothing wasted in the short suit: slam"
  status: infere
- id: "sl.tm.{c}.5C"
  for: [{c: 3H, s: H}, {c: 3S, s: S}, {c: 3NT, s: D}, {c: 4C, s: C}, {c: 4D, s: D}]
  seq: ["1NT 2S 3C {c}", "1NT (X) 2S 3C {c}"]
  call: 5C
  cond: "true"
  forcing: SO
  meaning: "Manche à ♣"
  meaning_en: "Game in ♣"
  status: infere
- id: sl.tmd.4C.6D
  seq: ["1NT 3C 3D 4C", "1NT (X) 3C 3D 4C"]
  call: 6D
  cond: "hl >= 16 and hcp_in('C') <= 1 and D >= 3 and aces >= 2"
  forcing: SO
  meaning: "Rien de perdu dans la courte ♣ : chelem"
  meaning_en: "Nothing wasted in the short ♣: slam"
  status: infere
# --- Saut fort du répondant (6 cartes, 16+) : Blackwood après le fit de l'ouvreur
# en: Responder's strong jump (6 cards, 16+): Blackwood after opener's fit
- id: "sl.js.{k}.bw"
  for: [{k: a, s: "1C|1D 2H", X: H, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {k: b, s: "1C|1D 2S", X: S, km: "true"}, {k: c, s: "1H 2S", X: S, km: "true"}, {k: d, s: "1S 3H", X: H, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}]
  seq: "{s} 4{X}"
  call: 4NT
  cond: "hl >= 17 and ({km})"
  forcing: ASK
  meaning: "Blackwood 5 clés"
  meaning_en: "5-keycard Blackwood"
  status: infere
  alert: true
  trump: "{X}"
# --- Enchère d'essai 2SA, réponse maximum : l'ouvreur très fort pose le Blackwood
# en: 2NT game try, maximum answer: a very strong opener asks for keycards
- id: "sl.ess.{M}.bw"
  for: [{M: H, km: "(keycards('H') >= 2 or (keycards('H') >= 1 and queen('H')))"}, {M: S, km: "true"}]
  seq: "1{M} 2{M} 2NT 3C|3D|3H|4C|4D"
  call: 4NT
  cond: "hld >= 21 and ({km})"
  forcing: ASK
  meaning: "Blackwood 5 clés"
  meaning_en: "5-keycard Blackwood"
  status: infere
  alert: true
  trump: "{M}"
# --- 1M – 5M : demande de qualité d'atout
