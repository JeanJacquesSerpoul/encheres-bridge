# --- réponses au contre d'appel (l'adversaire de droite a passé) : trois zones, 0-7 / 8-10 / 11+ H
# en: answers to the takeout double (right-hand opponent passed): three zones, 0-7 / 8-10 / 11+ HCP
# La réponse est obligatoire, même avec 0 point. 0-7 H : couleur 4e au moins, sans saut (4♥ et 4♠ : 1♠). 8-10 H : majeure 4e à saut, 5e à double saut, 6e à la manche ; mineure 5e à saut ; les deux majeures 4e : cue-bid ; 1SA régulier. 11+ H : manche avec une majeure 5e, 2SA 11-12 avec un arrêt et demi, 3SA 13-15 avec deux arrêts, sinon cue-bid (seule réponse forcing : majeure seulement 4e, pas d'arrêt, ou espoir de chelem).
# en: Answering is compulsory, even with 0 points. 0-7 HCP: a suit of at least 4 cards, no jump (4♥ and 4♠: 1♠). 8-10 HCP: a four-card major with a jump, five-card with a double jump, six-card at game; a five-card minor with a jump; both four-card majors: cue-bid; 1NT balanced. 11+ HCP: game with a five-card major, 2NT 11-12 with one and a half stoppers, 3NT 13-15 with two stoppers, otherwise the cue-bid (the only forcing answer: only a four-card major, no stopper, or slam hopes).
- id: "advX.{o}.4{M}"
  for: [{o: 1C, M: S, N: H}, {o: 1C, M: H, N: S}, {o: 1D, M: S, N: H}, {o: 1D, M: H, N: S}, {o: 1H, M: S, N: H}, {o: 1S, M: H, N: S}]
  seq: ["({o}) X", "({o}) P X"]
  call: "4{M}"
  cond: "(({M} >= 6 and 8 <= hcp <= 15) or ({M} >= 5 and 11 <= hcp <= 15)) and ({M} >= {N} or '{o}' in ('1H', '1S'))"
  forcing: SO
  meaning: "Manche : majeure 6e avec 8-10 H, ou majeure 5e avec 11+ H"
  meaning_en: "Game: six-card major with 8-10 HCP, or five-card major with 11+ HCP"
  status: sef
- id: "advX.{o}.3NT"
  for: [{o: 1C, os: C, nm: "H < 4 and S < 4"}, {o: 1D, os: D, nm: "H < 4 and S < 4"}, {o: 1H, os: H, nm: "S < 4"}, {o: 1S, os: S, nm: "H < 4"}]
  seq: ["({o}) X", "({o}) P X"]
  call: 3NT
  cond: "13 <= hcp <= 15 and (balanced or semibalanced) and top('{os}') >= 2 and {nm}"
  forcing: SO
  meaning: "3SA : 13-15 H, deux arrêts dans leur couleur, pas de majeure 4e"
  meaning_en: "3NT: 13-15 HCP, two stoppers in their suit, no four-card major"
  status: sef
- id: "advX.{o}.2NT"
  for: [{o: 1C, os: C, nm: "H < 4 and S < 4"}, {o: 1D, os: D, nm: "H < 4 and S < 4"}, {o: 1H, os: H, nm: "S < 4"}, {o: 1S, os: S, nm: "H < 4"}]
  seq: ["({o}) X", "({o}) P X"]
  call: 2NT
  cond: "11 <= hcp <= 12 and (balanced or semibalanced) and stop('{os}') and hcp_in('{os}') >= 4 and {nm}"
  forcing: INV
  meaning: "2SA : 11-12 H, un arrêt et demi dans leur couleur"
  meaning_en: "2NT: 11-12 HCP, one and a half stoppers in their suit"
  status: sef
- id: "advX.{o}.cue"
  for: [{o: 1C, os: C}, {o: 1D, os: D}, {o: 1H, os: H}, {o: 1S, os: S}]
  seq: ["({o}) X", "({o}) P X"]
  call: "2{os}"
  cond: "hcp >= 11"
  forcing: F1
  meaning: "Cue-bid : 11+ H, forcing (majeure seulement 4e, pas d'arrêt, ou espoir de chelem)"
  meaning_en: "Cue-bid: 11+ HCP, forcing (only a four-card major, no stopper, or slam hopes)"
  status: sef
  alert: true
- id: "advX.{o}.cue.2M"
  for: [{o: 1C, os: C}, {o: 1D, os: D}]
  seq: ["({o}) X", "({o}) P X"]
  call: "2{os}"
  cond: "8 <= hcp <= 10 and H >= 4 and S >= 4"
  forcing: F1
  meaning: "Cue-bid : 8-10 H et les deux majeures 4e"
  meaning_en: "Cue-bid: 8-10 HCP and both four-card majors"
  status: sef
  alert: true
- id: "advX.{o}.dsaut.{M}"
  for: [{o: 1C, M: S, N: H}, {o: 1C, M: H, N: S}, {o: 1D, M: S, N: H}, {o: 1D, M: H, N: S}, {o: 1H, M: S, N: H}]
  seq: ["({o}) X", "({o}) P X"]
  call: "3{M}"
  cond: "8 <= hcp <= 10 and {M} == 5 and ({M} > {N} or '{o}' == '1H' or ({M} == {N} and '{M}' == 'S'))"
  forcing: INV
  meaning: "Réponse à double saut : majeure 5e, 8-10 H"
  meaning_en: "Double-jump answer: five-card major, 8-10 HCP"
  status: sef
- id: "advX.{o}.saut.{M}"
  for: [{o: 1C, M: S, N: H, call: 2S}, {o: 1C, M: H, N: S, call: 2H}, {o: 1D, M: S, N: H, call: 2S}, {o: 1D, M: H, N: S, call: 2H}, {o: 1H, M: S, N: H, call: 2S}, {o: 1S, M: H, N: S, call: 3H}]
  seq: ["({o}) X", "({o}) P X"]
  call: "{call}"
  cond: "8 <= hcp <= 10 and {M} >= 4 and ({M} >= 5 or '{call}' != '3H') and ({M} > {N} or '{o}' in ('1H', '1S') or ({M} == {N} and '{M}' == 'S'))"
  forcing: INV
  meaning: "Réponse à saut : majeure 4e (5e sur 1♠), 8-10 H"
  meaning_en: "Jump answer: four-card major (five-card over 1♠), 8-10 HCP"
  status: sef
- id: "advX.{o}.saut.{m}"
  for: [{o: 1C, m: D, call: 2D}, {o: 1D, m: C, call: 3C}, {o: 1H, m: C, call: 3C}, {o: 1H, m: D, call: 3D}, {o: 1S, m: C, call: 3C}, {o: 1S, m: D, call: 3D}]
  seq: ["({o}) X", "({o}) P X"]
  call: "{call}"
  cond: "8 <= hcp <= 10 and {m} >= 5 and not balanced and {m} == max(S, H, D, C)"
  forcing: INV
  meaning: "Réponse à saut : mineure 5e, 8-10 H"
  meaning_en: "Jump answer: five-card minor, 8-10 HCP"
  status: sef
- id: "advX.{o}.1NT"
  for: [{o: 1C, os: C}, {o: 1D, os: D}, {o: 1H, os: H}, {o: 1S, os: S}]
  seq: ["({o}) X", "({o}) P X"]
  call: 1NT
  cond: "8 <= hcp <= 10 and (balanced or stop('{os}'))"
  forcing: NF
  meaning: "1SA : 8-10 H, régulier"
  meaning_en: "1NT: 8-10 HCP, balanced"
  status: sef
- id: "advX.{o}.{c}.{n}"
  for: [{o: 1C, c: 1S, s: S, n: 1, t: "S >= 4 and S >= H"}, {o: 1C, c: 1H, s: H, n: 1, t: "H >= 4"}, {o: 1D, c: 1S, s: S, n: 1, t: "S >= 4 and S >= H"}, {o: 1D, c: 1H, s: H, n: 1, t: "H >= 4"}, {o: 1H, c: 1S, s: S, n: 1, t: "S >= 4"}, {o: 1S, c: 2H, s: H, n: 1, t: "H >= 4"},
        {o: 1C, c: 1D, s: D, n: 2, t: "D >= 4"}, {o: 1D, c: 2C, s: C, n: 2, t: "C >= 4"}, {o: 1H, c: 2D, s: D, n: 2, t: "D >= 4 and D >= C"}, {o: 1H, c: 2C, s: C, n: 2, t: "C >= 4"}, {o: 1S, c: 2D, s: D, n: 2, t: "D >= 4 and D >= C"}, {o: 1S, c: 2C, s: C, n: 2, t: "C >= 4"},
        {o: 1C, c: 1H, s: H, n: 3, t: "H >= 3"}, {o: 1C, c: 1S, s: S, n: 3, t: "S >= 3"}, {o: 1D, c: 1H, s: H, n: 3, t: "H >= 3"}, {o: 1D, c: 1S, s: S, n: 3, t: "S >= 3"}, {o: 1H, c: 1S, s: S, n: 3, t: "S >= 3"}, {o: 1S, c: 2H, s: H, n: 3, t: "H >= 3"},
        {o: 1C, c: 1D, s: D, n: 4, t: "true"}, {o: 1D, c: 2C, s: C, n: 4, t: "true"}, {o: 1H, c: 2C, s: C, n: 4, t: "true"}, {o: 1S, c: 2C, s: C, n: 4, t: "true"}]
  seq: ["({o}) X", "({o}) P X"]
  call: "{c}"
  cond: "{t}"
  forcing: NF
  meaning: "Réponse obligatoire au contre : couleur 4e au moins, sans saut, la majeure d'abord"
  meaning_en: "Compulsory answer to the double: a suit of at least 4 cards, no jump, the major first"
  status: sef
# --- réponses à l'intervention du partenaire (l'adversaire de droite a passé)
# en: answers to partner's overcall (right-hand opponent passed)
# Loi des levées totales (J.-R. Vernes) : en compétition, on peut disputer jusqu'au palier égal au nombre d'atouts de la ligne moins 6 — 8 atouts au palier de 2, 9 au palier de 3, 10 au palier de 4.
# en: Law of total tricks (J.-R. Vernes): in competition, you may contest up to the level equal to the line's trumps minus 6 — 8 trumps at the two level, 9 at the three level, 10 at the four level.
- id: "advI.lt.{o}.{M}.4"
  for: [{o: 1C, M: H}, {o: 1D, M: H}, {o: 1C, M: S}, {o: 1D, M: S}, {o: 1H, M: S}]
  seq: "({o}) 1{M}"
  call: "4{M}"
  cond: "{M} >= 5 and 5 <= hld <= 10"
  forcing: SO
  meaning: "Barrage : 5 atouts face à l'intervention 5e (10 atouts, palier de 4)"
  meaning_en: "Preemptive raise: five trumps opposite the five-card overcall (10 trumps, four level)"
  status: choix
- id: "ovR.lt.{o}.{M}.3"
  for: [{o: 1C, M: H, r: "X|1S|1NT|2C|2D", z: "2S|2NT|3C|3D|X"}, {o: 1D, M: H, r: "X|1S|1NT|2C|2D", z: "2S|2NT|3C|3D|X"}, {o: 1C, M: S, r: "X|1NT|2C|2D|2H", z: "2NT|3C|3D|3H|X"}, {o: 1D, M: S, r: "X|1NT|2C|2D|2H", z: "2NT|3C|3D|3H|X"}, {o: 1H, M: S, r: "X|1NT|2C|2D|2H", z: "2NT|3C|3D|3H|X"}]
  seq: ["({o}) 1{M} 2{M} ({z})", "({o}) 1{M} ({r}) 2{M} ({z})"]
  call: "3{M}"
  cond: "{M} >= 6"
  forcing: NF
  meaning: "6 cartes face au soutien : 9 atouts, on dispute au palier de 3"
  meaning_en: "Six cards opposite the raise: 9 trumps, compete at the three level"
  status: choix
- id: "advI.{o}.{c}.cue"
  for: [{o: 1C, os: C, c: 1D, s: D, f: 3}, {o: 1C, os: C, c: 1H, s: H, f: 3}, {o: 1C, os: C, c: 1S, s: S, f: 3}, {o: 1D, os: D, c: 1H, s: H, f: 3}, {o: 1D, os: D, c: 1S, s: S, f: 3}, {o: 1H, os: H, c: 1S, s: S, f: 3},
        {o: 1D, os: D, c: 2C, s: C, f: 2}, {o: 1H, os: H, c: 2C, s: C, f: 2}, {o: 1H, os: H, c: 2D, s: D, f: 2}, {o: 1S, os: S, c: 2C, s: C, f: 2}, {o: 1S, os: S, c: 2D, s: D, f: 2}, {o: 1S, os: S, c: 2H, s: H, f: 2}]
  seq: "({o}) {c}"
  call: "2{os}"
  cond: "{s} >= {f} and hld >= 13"
  forcing: F1
  meaning: "Cue-bid : fitté, 13+ HLD"
  meaning_en: "Cue-bid: fit, 13+ HLD"
  status: sef
  alert: true
- id: "advI.{o}.{c}.3"
  for: [{o: 1C, c: 1D, s: D}, {o: 1C, c: 1H, s: H}, {o: 1C, c: 1S, s: S}, {o: 1D, c: 1H, s: H}, {o: 1D, c: 1S, s: S}, {o: 1H, c: 1S, s: S}]
  seq: "({o}) {c}"
  call: "3{s}"
  cond: "{s} >= 3 and 11 <= hld <= 12"
  forcing: INV
  meaning: "Soutien à saut : 11-12 HLD"
  meaning_en: "Jump raise: 11-12 HLD"
  status: sef
- id: "advI.{o}.{c}.2"
  for: [{o: 1C, c: 1D, s: D}, {o: 1C, c: 1H, s: H}, {o: 1C, c: 1S, s: S}, {o: 1D, c: 1H, s: H}, {o: 1D, c: 1S, s: S}, {o: 1H, c: 1S, s: S}]
  seq: "({o}) {c}"
  call: "2{s}"
  cond: "{s} >= 3 and 7 <= hld <= 10"
  forcing: NF
  meaning: "Soutien simple : 7-10 HLD"
  meaning_en: "Simple raise: 7-10 HLD"
  status: sef
- id: "advI.{o}.{c}.3.fit"
  for: [{o: 1D, c: 2C, s: C}, {o: 1H, c: 2C, s: C}, {o: 1H, c: 2D, s: D}, {o: 1S, c: 2C, s: C}, {o: 1S, c: 2D, s: D}, {o: 1S, c: 2H, s: H}]
  seq: "({o}) {c}"
  call: "3{s}"
  cond: "{s} >= 2 and 8 <= hld <= 12"
  forcing: NF
  meaning: "Soutien : 8-12 HLD"
  meaning_en: "Raise: 8-12 HLD"
  status: sef
- id: "advI.{o}.{c}.NT"
  for: [{o: 1C, os: C, c: 1D, lo: 1NT, mid: 2NT}, {o: 1C, os: C, c: 1H, lo: 1NT, mid: 2NT}, {o: 1C, os: C, c: 1S, lo: 1NT, mid: 2NT}, {o: 1D, os: D, c: 1H, lo: 1NT, mid: 2NT}, {o: 1D, os: D, c: 1S, lo: 1NT, mid: 2NT}, {o: 1H, os: H, c: 1S, lo: 1NT, mid: 2NT}]
  seq: "({o}) {c}"
  call: "{lo}"
  cond: "8 <= hcp <= 11 and stop('{os}')"
  forcing: NF
  meaning: "1SA : 8-11 H, arrêt"
  meaning_en: "1NT: 8-11 HCP, stopper"
  status: sef
- id: "advI.{o}.{c}.2NT"
  for: [{o: 1C, os: C, c: 1D}, {o: 1C, os: C, c: 1H}, {o: 1C, os: C, c: 1S}, {o: 1D, os: D, c: 1H}, {o: 1D, os: D, c: 1S}, {o: 1H, os: H, c: 1S}, {o: 1D, os: D, c: 2C}, {o: 1H, os: H, c: 2C}, {o: 1H, os: H, c: 2D}, {o: 1S, os: S, c: 2C}, {o: 1S, os: S, c: 2D}, {o: 1S, os: S, c: 2H}]
  seq: "({o}) {c}"
  call: 2NT
  cond: "12 <= hcp <= 13 and stop('{os}')"
  forcing: INV
  meaning: "2SA : 12-13 H, arrêt"
  meaning_en: "2NT: 12-13 HCP, stopper"
  status: sef
- id: "advI.{o}.{c}.3NT"
  for: [{o: 1C, os: C, c: 1D}, {o: 1C, os: C, c: 1H}, {o: 1C, os: C, c: 1S}, {o: 1D, os: D, c: 1H}, {o: 1D, os: D, c: 1S}, {o: 1H, os: H, c: 1S}, {o: 1D, os: D, c: 2C}, {o: 1H, os: H, c: 2C}, {o: 1H, os: H, c: 2D}, {o: 1S, os: S, c: 2C}, {o: 1S, os: S, c: 2D}, {o: 1S, os: S, c: 2H}]
  seq: "({o}) {c}"
