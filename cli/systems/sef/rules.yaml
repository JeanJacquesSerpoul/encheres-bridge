  meaning_en: "Balanced 12-14 HL"
  status: infere
- id: 1H.1S.3H
  seq: "1H 1S"
  call: 3H
  cond: "H >= 6 and hl >= 15"
  forcing: INV
  meaning: "6 cœurs, 15-17 HL"
  meaning_en: "6 hearts, 15-17 HL"
  status: infere
- id: "1H.1S.3{m}.fort"
  for: [{m: C}, {m: D}]
  seq: "1H 1S"
  call: "3{m}"
  cond: "H >= 5 and {m} >= 4 and {m} >= max(C, D) and hl >= 17"
