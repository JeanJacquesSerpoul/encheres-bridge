- id: "roudi.{m}.S.2NT"
  for: [{m: C}, {m: D}]
  seq: "1{m} 1S 1NT 2C"
  call: 2NT
  cond: "hl >= 14"
  forcing: NF
  meaning: "2 cartes à ♠, maximum"
