# Sans fit ni arrêt, une main de 13 H ne passe pas : cue-bid, l'intervenant décrit sa main. Mesuré sur le banc du par.
# en: With no fit and no stopper, a 13 HCP hand does not pass: cue-bid, overcaller describes the hand. Measured on the par benchmark.
- id: "advI.{o}.{c}.cue.fort"
  for: [{o: 1C, os: C, c: 1D}, {o: 1C, os: C, c: 1H}, {o: 1C, os: C, c: 1S}, {o: 1D, os: D, c: 1H}, {o: 1D, os: D, c: 1S}, {o: 1H, os: H, c: 1S}, {o: 1D, os: D, c: 2C}, {o: 1H, os: H, c: 2C}, {o: 1H, os: H, c: 2D}, {o: 1S, os: S, c: 2C}, {o: 1S, os: S, c: 2D}, {o: 1S, os: S, c: 2H}]
  seq: "({o}) {c}"
  call: "2{os}"
  cond: "hcp >= 13"
  forcing: F1
  meaning: "Cue-bid : 13+ H sans fit ni arrêt"
  meaning_en: "Cue-bid: 13+ HCP, no fit or stopper"
  status: infere
  alert: true
- id: "advI.{o}.{c}.pass"
  for: [{o: 1C, c: 1D}, {o: 1C, c: 1H}, {o: 1C, c: 1S}, {o: 1D, c: 1H}, {o: 1D, c: 1S}, {o: 1H, c: 1S}, {o: 1D, c: 2C}, {o: 1H, c: 2C}, {o: 1H, c: 2D}, {o: 1S, c: 2C}, {o: 1S, c: 2D}, {o: 1S, c: 2H}]
  seq: "({o}) {c}"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Passe"
  meaning_en: "Pass"
  status: infere
# --- réponses à l'intervention à 1SA (16-18) et au saut faible du partenaire
