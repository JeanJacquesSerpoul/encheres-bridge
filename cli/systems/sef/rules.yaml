# ======================================================================
# A.9 Ouvertures de 2 (2♣, 2♦, 2♥/2♠)
# ======================================================================
# en: A.9 Two-level openings (2♣, 2♦, 2♥/2♠)
- id: 2C.r.2D
  seq: "2C"
  call: 2D
  cond: "true"
  forcing: REL
  meaning: "Relais obligatoire"
  meaning_en: "Compulsory relay"
  status: sef
  alert: true
- id: 2C.2D.2NT
  seq: "2C 2D"
  call: 2NT
  cond: "balanced and 22 <= hl <= 23"
  forcing: NF
  meaning: "22-23 HL régulier (suites comme sur 2SA)"
  meaning_en: "22-23 HL balanced (continuations as over 2NT)"
  status: choix
- id: 2C.2D.3NT
  seq: "2C 2D"
  call: 3NT
  cond: "H >= 5 and S >= 5"
  forcing: NF
  meaning: "5♥ et 5♠, 3 à 3,5 perdantes"
  meaning_en: "5♥ and 5♠, 3 to 3.5 losers"
  status: sef
- id: "2C.2D.3{X}"
  for: [{X: S}, {X: H}, {X: D}, {X: C}]
  seq: "2C 2D"
  call: "3{X}"
  cond: "{X} >= 7"
  forcing: NF
  meaning: "7 cartes, 15-16 H"
  meaning_en: "7 cards, 15-16 HCP"
  status: sef
- id: "2C.2D.2{M}"
  for: [{M: S}, {M: H}]
  seq: "2C 2D"
  call: "2{M}"
  cond: "{M} >= 5 and {M} >= max(S, H)"
  forcing: NF
  meaning: "18-21 HL, 5/6 cartes"
  meaning_en: "18-21 HL, 5/6 cards"
  status: sef
- id: 2D.r.4NT
  seq: "2D"
  call: 4NT
  cond: "aces == 4"
  forcing: F1
  meaning: "4 As"
  meaning_en: "4 aces"
  status: choix
- id: 2D.r.3aces
  seq: "2D"
  call: 4C
  cond: "aces == 3 and not ace('C')"
  forcing: F1
  meaning: "3 As, sauf celui de ♣"
  meaning_en: "3 aces, except the ♣ ace"
  status: choix
- id: 2D.r.3aces.D
  seq: "2D"
  call: 4D
  cond: "aces == 3 and not ace('D')"
  forcing: F1
  meaning: "3 As, sauf celui de ♦"
  meaning_en: "3 aces, except the ♦ ace"
  status: choix
- id: 2D.r.3aces.H
  seq: "2D"
  call: 4H
  cond: "aces == 3 and not ace('H')"
  forcing: F1
  meaning: "3 As, sauf celui de ♥"
  meaning_en: "3 aces, except the ♥ ace"
  status: choix
- id: 2D.r.3aces.S
  seq: "2D"
  call: 4S
  cond: "aces == 3"
  forcing: F1
  meaning: "3 As, sauf celui de ♠"
  meaning_en: "3 aces, except the ♠ ace"
  status: choix
- id: 2D.r.3H
  seq: "2D"
  call: 3H
  cond: "aces == 2 and ((ace('S') and ace('C')) or (ace('H') and ace('D')))"
  forcing: F1
  meaning: "2 As de même couleur"
  meaning_en: "2 aces of the same color"
  status: choix
- id: 2D.r.3S
  seq: "2D"
  call: 3S
  cond: "aces == 2 and ((ace('S') and ace('H')) or (ace('D') and ace('C')))"
  forcing: F1
  meaning: "2 As de même rang"
  meaning_en: "2 aces of the same rank"
  status: choix
- id: 2D.r.3NT
  seq: "2D"
  call: 3NT
  cond: "aces == 2"
  forcing: F1
  meaning: "2 As mélangés (♠/♦ ou ♥/♣)"
  meaning_en: "2 mixed aces (♠/♦ or ♥/♣)"
  status: choix
- id: 2D.r.2S
  seq: "2D"
  call: 2S
  cond: "aces == 1 and (ace('S') or ace('H'))"
  forcing: F1
  meaning: "Un As majeur"
  meaning_en: "One major ace"
  status: choix
- id: 2D.r.3C
  seq: "2D"
  call: 3C
  cond: "aces == 1 and ace('C')"
  forcing: F1
  meaning: "As de ♣"
  meaning_en: "♣ ace"
  status: choix
- id: 2D.r.3D
  seq: "2D"
  call: 3D
  cond: "aces == 1"
  forcing: F1
  meaning: "As de ♦"
  meaning_en: "♦ ace"
  status: choix
- id: 2D.r.2NT
  seq: "2D"
  call: 2NT
  cond: "hcp >= 8"
  forcing: F1
  meaning: "Pas d'As, 8+ H"
  meaning_en: "No aces, 8+ HCP"
  status: choix
- id: 2D.r.2H
  seq: "2D"
  call: 2H
  cond: "true"
  forcing: F1
  meaning: "Pas d'As, 0 à 7 H"
  meaning_en: "No aces, 0 to 7 HCP"
  status: choix
  alert: true
- id: "2{M}.r.2NT"
  for: [{M: H}, {M: S}]
  seq: "2{M}"
  call: 2NT
  cond: "hl >= 15"
  forcing: F1
  meaning: "Relais avec espoir de manche, 15 HL et plus"
  meaning_en: "Relay with game interest, 15+ HL"
  status: sef
  alert: true
- id: "2{M}.r.4{M}"
  for: [{M: H}, {M: S}]
  seq: "2{M}"
  call: "4{M}"
  cond: "{M} >= 3 and (hcp >= 12 or {M} >= 4)"
  forcing: SO
  meaning: "Soutien : manche ou barrage"
  meaning_en: "Support: game or preempt"
  status: sef
- id: "2{M}.r.3{M}"
  for: [{M: H}, {M: S}]
  seq: "2{M}"
  call: "3{M}"
  cond: "{M} >= 3"
  forcing: NF
  meaning: "Soutien barrage"
  meaning_en: "Preemptive support"
  status: sef
- id: "2{M}.r.pass"
  for: [{M: H}, {M: S}]
  seq: "2{M}"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Pas de manche"
  meaning_en: "No game"
  status: sef
- id: "2{M}.2NT.4{s}"
  for: [{M: H, s: C}, {M: H, s: D}, {M: H, s: S}, {M: S, s: C}, {M: S, s: D}, {M: S, s: H}]
  seq: "2{M} 2NT"
  call: "4{s}"
  cond: "hl >= 9 and short('{s}')"
  forcing: FM
  meaning: "Maximum avec singleton ou chicane"
  meaning_en: "Maximum with a singleton or void"
  status: sef
- id: "2{M}.2NT.3{s}"
  for: [{M: H, s: C}, {M: H, s: D}, {M: S, s: C}, {M: S, s: D}, {M: S, s: H}]
  seq: "2{M} 2NT"
  call: "3{s}"
  cond: "hl >= 9 and (ace('{s}') or king('{s}'))"
  forcing: F1
  meaning: "Maximum : As ou Roi dans la couleur"
  meaning_en: "Maximum: ace or king in the suit"
  status: sef
- id: "2{M}.2NT.3NT"
  for: [{M: H}, {M: S}]
  seq: "2{M} 2NT"
  call: 3NT
  cond: "hl >= 8"
  forcing: NF
  meaning: "Maximum sans force annexe"
  meaning_en: "Maximum without side strength"
  status: sef
- id: "2{M}.2NT.3{M}"
  for: [{M: H}, {M: S}]
  seq: "2{M} 2NT"
  call: "3{M}"
  cond: "true"
  forcing: NF
  meaning: "Minimum"
  meaning_en: "Minimum"
  status: infere

# ======================================================================
# A.10 Ouvertures de 3, 3SA, 4 et 4SA
# ======================================================================
# en: A.10 Three-level, 3NT, four-level and 4NT openings
- id: "3{m}.r.3NT"
  for: [{m: C}, {m: D}]
  seq: "3{m}"
  call: 3NT
  cond: "hcp >= 14 and stop('S') and stop('H')"
  forcing: SO
  meaning: "Naturel"
  meaning_en: "Natural"
  status: sef
- id: "3{m}.r.5{m}"
  for: [{m: C}, {m: D}]
  seq: "3{m}"
  call: "5{m}"
  cond: "{m} >= 3 and hcp <= 12"
  forcing: SO
  meaning: "Barrage"
  meaning_en: "Preempt"
  status: sef
- id: "3{m}.r.4{m}"
  for: [{m: C}, {m: D}]
  seq: "3{m}"
  call: "4{m}"
  cond: "{m} >= 3"
  forcing: NF
  meaning: "Prolongation du barrage"
  meaning_en: "Extension of the preempt"
  status: sef
- id: "3{m}.r.pass"
  for: [{m: C}, {m: D}]
  seq: "3{m}"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Passe"
  meaning_en: "Pass"
  status: sef
- id: "3{M}.r.4{M}"
  for: [{M: H}, {M: S}]
  seq: "3{M}"
  call: "4{M}"
  cond: "({M} >= 2 and (hcp >= 14 or qtricks >= 3)) or {M} >= 4 or ({M} >= 3 and hcp >= 11)"
  forcing: SO
  meaning: "Soutien à la manche ou prolongation du barrage"
  meaning_en: "Support to game or extension of the preempt"
  status: sef
- id: "3{M}.r.3NT"
  for: [{M: H}, {M: S}]
  seq: "3{M}"
  call: 3NT
  cond: "hcp >= 16 and {M} <= 1"
  forcing: SO
  meaning: "Naturel"
  meaning_en: "Natural"
  status: sef
- id: "3{M}.r.pass"
  for: [{M: H}, {M: S}]
  seq: "3{M}"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Passe"
  meaning_en: "Pass"
  status: sef
- id: 3NT.r.4D
  seq: "3NT"
  call: 4D
  cond: "hcp >= 17"
  forcing: ASK
  meaning: "Interrogatif forcing : l'ouvreur nomme sa courte (4♥/4♠ : courte nommée, 5♣ : courte en mineure, 4SA : pas de courte)"
  meaning_en: "Forcing ask: opener names his shortness (4♥/4♠: that suit, 5♣: shortness in a minor, 4NT: none)"
  status: choix
  alert: true
- id: 3NT.r.4C
  seq: "3NT"
  call: 4C
  cond: "hcp <= 5 and (C >= 2 or D >= 2)"
  forcing: REL
  meaning: "Pour jouer 4♣ ou 4♦ : l'ouvreur passe ou corrige"
  meaning_en: "To play 4♣ or 4♦: opener passes or corrects"
  status: sef
  alert: true
- id: "3NT.r.4{M}"
  for: [{M: H}, {M: S}]
  seq: "3NT"
  call: "4{M}"
  cond: "{M} >= 7"
  forcing: SO
  meaning: "Arrêt formel : pour jouer"
  meaning_en: "Sign-off: to play"
  status: sef
- id: 3NT.r.pass
  seq: "3NT"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Pour jouer 3SA"
  meaning_en: "To play 3NT"
  status: sef
- id: 3NT.4C.4D
  seq: "3NT 4C"
  call: 4D
  cond: "D >= 7"
  forcing: SO
  meaning: "La mineure est ♦"
  meaning_en: "The minor is ♦"
