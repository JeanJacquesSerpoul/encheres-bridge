  for: [{r: 3D, t: "D > C"}, {r: 3C, t: "true"}]
  seq: ["(1NT) 2NT", "(1NT) P 2NT"]
  call: "{r}"
  cond: "{t}"
  forcing: NF
  meaning: "Choisit sa mineure"
  meaning_en: "Picks a minor"
  status: infere

