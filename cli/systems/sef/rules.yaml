# ======================================================================
# A.18 bis Compétition : interventions, réveil et suites
# ======================================================================
# en: A.18 bis Competition: overcalls, balancing and continuations
# Socle du camp de la défense sur une ouverture adverse au palier de 1 à la couleur. Seuils SEF : intervention à 1SA 16-18 H régulier avec arrêt ;
# en: Basic defence against an opposing one-level suit opening. SEF thresholds: 1NT overcall 16-18 H, balanced, with a stopper;
# contre « toutes distributions » 18 H et plus ; intervention à la couleur 5+ cartes et belle couleur, 5 H dans la couleur (9+ H, 10-17 HL au palier de 1 ; 11+ HL et 6 cartes ou 14 HL au palier de 2) ;
# en: “any shape” double with 18+ H; suit overcall with a good 5+ card suit, 5 H in the suit (9+ H, 10-17 HL at the one level; 11+ HL and six cards, or 14 HL, at the two level);
# saut faible 6 cartes 6-10 H ; contre d'appel 13+ (sur mineure : 3-4 cartes dans chaque majeure ; sur majeure : 4 cartes dans l'autre majeure, court dans l'ouverture).
# en: weak jump overcall with six cards and 6-10 H; takeout double with 13+ (over a minor: 3-4 cards in each major; over a major: four cards in the other major, short in the opened suit).
# Seuils réglés sur le banc du par (engine/testdata/par_bench.jsonl.gz) : une intervention plus légère coûte plus au camp de l'ouvreur qu'elle ne rapporte.
# en: Thresholds tuned on the par benchmark (engine/testdata/par_bench.jsonl.gz): a lighter overcall costs the overcalling side more than it gains.
# Les bicolores (Michaëls, 2SA) sont codés plus haut et gardent la priorité. Les séquences commencent par l'ouverture adverse : `P (1♦)` et `(1♦)` sont traités ensemble.
# en: Two-suiters (Michaels, 2NT) are coded earlier and keep priority. Sequences start with the opponents' opening: `P (1♦)` and `(1♦)` are handled together.
# --- intervention directe
# en: direct overcall
- id: "def.{o}.1NT"
  for: [{o: 1C, os: C}, {o: 1D, os: D}, {o: 1H, os: H}, {o: 1S, os: S}]
  seq: "({o})"
  call: 1NT
  cond: "16 <= hcp <= 18 and balanced and stop('{os}')"
  forcing: NF
  meaning: "Intervention à 1SA : 16-18 H, régulier, arrêt"
  meaning_en: "1NT overcall: 16-18 HCP, balanced, stopper"
  status: sef
- id: "def.{o}.X.fort"
  for: [{o: 1C}, {o: 1D}, {o: 1H}, {o: 1S}]
  seq: "({o})"
  call: X
  cond: "hcp >= 18"
  forcing: TO
  meaning: "Contre « toutes distributions » : 18 H et plus"
  meaning_en: "Strong double: 18+ HCP, any shape"
  status: sef
- id: "def.{o}.saut.{s}"
  for: [{o: 1C, s: S}, {o: 1C, s: H}, {o: 1D, s: S}, {o: 1D, s: H}, {o: 1H, s: S}]
  seq: "({o})"
  call: "2{s}"
  cond: "{s} == 6 and 6 <= hcp <= 10 and top('{s}') >= 1 and (not vul or top('{s}') >= 2)"
  forcing: NF
  meaning: "Intervention à saut : barrage, 6 cartes, 6-10 H"
  meaning_en: "Weak jump overcall: 6 cards, 6-10 HCP"
  status: sef
- id: "def.{o}.1{s}"
  for: [{o: 1C, s: S, a: H, b: D}, {o: 1C, s: H, a: S, b: D}, {o: 1C, s: D, a: H, b: S}, {o: 1D, s: S, a: H, b: C}, {o: 1D, s: H, a: S, b: C}, {o: 1H, s: S, a: C, b: D}]
  seq: "({o})"
  call: "1{s}"
  cond: "{s} >= 5 and {s} >= {a} and {s} >= {b} and hcp_in('{s}') >= 5 and hcp >= 9 and 10 <= hl <= 17"
  forcing: NF
  meaning: "Intervention : 5+ cartes, belle couleur, 10-17 HL"
  meaning_en: "Overcall: 5+ cards, good suit, 10-17 HL"
  status: sef
- id: "def.{o}.2{s}"
  for: [{o: 1D, s: C, a: H, b: S}, {o: 1H, s: D, a: C, b: S}, {o: 1H, s: C, a: D, b: S}, {o: 1S, s: H, a: C, b: D}, {o: 1S, s: D, a: C, b: H}, {o: 1S, s: C, a: D, b: H}]
  seq: "({o})"
  call: "2{s}"
  cond: "{s} >= 5 and {s} >= {a} and {s} >= {b} and hcp_in('{s}') >= 5 and 11 <= hl <= 17 and ({s} >= 6 or hl >= 14)"
  forcing: NF
  meaning: "Intervention au palier de 2 : belle couleur, 6 cartes ou 14+ HL"
  meaning_en: "Two-level overcall: good suit, 6 cards or 14+ HL"
  status: sef
- id: "def.{o}.X"
  for: [{o: 1C, tx: "hl >= 13 and 3 <= H <= 4 and 3 <= S <= 4 and H + S >= 7 and C <= 3"}, {o: 1D, tx: "hl >= 13 and 3 <= H <= 4 and 3 <= S <= 4 and H + S >= 7 and D <= 3"}, {o: 1H, tx: "hcp >= 13 and S == 4 and H <= 2"}, {o: 1S, tx: "hcp >= 13 and 4 <= H <= 5 and S <= 2"}]
  seq: "({o})"
  call: X
  cond: "{tx}"
  forcing: TO
  meaning: "Contre d'appel : 13+ H, les couleurs non nommées"
  meaning_en: "Takeout double: 13+ HCP, the unbid suits"
  status: sef
- id: "def.{o}.1{s}.ouverture"
  for: [{o: 1C, s: S, a: H, b: D}, {o: 1C, s: H, a: S, b: D}, {o: 1C, s: D, a: H, b: S}, {o: 1D, s: S, a: H, b: C}, {o: 1D, s: H, a: S, b: C}, {o: 1H, s: S, a: C, b: D}]
  seq: "({o})"
  call: "1{s}"
  cond: "{s} >= 5 and {s} >= {a} and {s} >= {b} and 12 <= hcp <= 17"
  forcing: NF
  meaning: "Intervention : 5 cartes et la valeur d'une ouverture"
  meaning_en: "Overcall: 5 cards and opening values"
  status: infere
- id: "def.{o}.pass"
  for: [{o: 1C}, {o: 1D}, {o: 1H}, {o: 1S}]
  seq: "({o})"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Pas d'intervention"
  meaning_en: "No overcall"
  status: sef
# --- réveil : l'ouverture revient après deux passes (le partenaire a passé)
# en: balancing: the opening comes round after two passes (partner has passed)
- id: "rev.{o}.2NT"
  for: [{o: 1C, os: C}, {o: 1D, os: D}, {o: 1H, os: H}, {o: 1S, os: S}]
  seq: "({o}) P"
  call: 2NT
  cond: "17 <= hl <= 19 and balanced and stop('{os}')"
  forcing: NF
  meaning: "Réveil à 2SA : 17-19 HL, régulier, arrêt"
  meaning_en: "Balancing 2NT: 17-19 HL, balanced, stopper"
  status: sef
- id: "rev.{o}.X.fort"
  for: [{o: 1C}, {o: 1D}, {o: 1H}, {o: 1S}]
  seq: "({o}) P"
  call: X
  cond: "hl >= 14"
  forcing: TO
  meaning: "Contre de réveil : la valeur d'une ouverture (14+ HL)"
  meaning_en: "Balancing double: opening values (14+ HL)"
  status: sef
- id: "rev.{o}.saut.{s}"
  for: [{o: 1C, s: S}, {o: 1C, s: H}, {o: 1D, s: S}, {o: 1D, s: H}, {o: 1H, s: S}]
  seq: "({o}) P"
  call: "2{s}"
  cond: "{s} >= 6 and 11 <= hl <= 13 and hcp_in('{s}') >= 4"
  forcing: NF
  meaning: "Réveil à saut : 6 cartes, 11-13 HL"
  meaning_en: "Balancing jump: 6 cards, 11-13 HL"
  status: sef
- id: "rev.{o}.1{s}"
  for: [{o: 1C, s: S, a: H, b: D}, {o: 1C, s: H, a: S, b: D}, {o: 1C, s: D, a: H, b: S}, {o: 1D, s: S, a: H, b: C}, {o: 1D, s: H, a: S, b: C}, {o: 1H, s: S, a: C, b: D}]
  seq: "({o}) P"
  call: "1{s}"
  cond: "{s} >= 5 and {s} >= {a} and {s} >= {b} and (hcp_in('{s}') >= 3 or ({s} >= 6 and hcp_in('{s}') >= 2)) and 8 <= hl <= 13"
  forcing: NF
  meaning: "Réveil : 5 cartes (dont 3 H) ou 6 cartes (dont 2 H), 8-13 HL"
  meaning_en: "Balancing overcall: 5 cards (3 HCP in the suit) or 6 cards (2 HCP), 8-13 HL"
  status: sef
- id: "rev.{o}.1NT"
  for: [{o: 1C, os: C}, {o: 1D, os: D}, {o: 1H, os: H}, {o: 1S, os: S}]
  seq: "({o}) P"
  call: 1NT
  cond: "9 <= hl <= 13 and balanced and (stop('{os}') or {os} >= 3)"
  forcing: NF
  meaning: "Réveil à 1SA : 9-13 HL, arrêt ou trois cartes"
  meaning_en: "Balancing 1NT: 9-13 HL, stopper or three cards"
  status: sef
- id: "rev.{o}.2{s}"
  for: [{o: 1D, s: C, a: H, b: S}, {o: 1H, s: D, a: C, b: S}, {o: 1H, s: C, a: D, b: S}, {o: 1S, s: H, a: C, b: D}, {o: 1S, s: D, a: C, b: H}, {o: 1S, s: C, a: D, b: H}]
  seq: "({o}) P"
  call: "2{s}"
  cond: "{s} >= 5 and {s} >= {a} and {s} >= {b} and hcp_in('{s}') >= 3 and 8 <= hl <= 13"
  forcing: NF
  meaning: "Réveil au palier de 2 : 5 cartes, 8-13 HL"
  meaning_en: "Two-level balancing overcall: 5 cards, 8-13 HL"
  status: sef
- id: "rev.{o}.X"
  for: [{o: 1C, tx: "C <= 2 and D >= 3 and H >= 3 and S >= 3"}, {o: 1D, tx: "D <= 2 and C >= 3 and H >= 3 and S >= 3"}, {o: 1H, tx: "H <= 2 and C >= 3 and D >= 3 and S >= 3"}, {o: 1S, tx: "S <= 2 and C >= 3 and D >= 3 and H >= 3"}]
