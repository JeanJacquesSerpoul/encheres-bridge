- id: "1{M}.1NT.3{M}"
  for: [{M: H}, {M: S}]
  seq: "1{M} 1NT"
  call: "3{M}"
  cond: "{M} >= 6 and hl >= 16"
  forcing: INV
  meaning: "6+ cartes, 15-17 HL"
  meaning_en: "6+ cards, 15-17 HL"
  status: infere
- id: "1{M}.1NT.2{M}"
  for: [{M: H}, {M: S}]
  seq: "1{M} 1NT"
  call: "2{M}"
  cond: "{M} >= 6"
  forcing: NF
  meaning: "6+ cartes, minimum"
