services:
  bids:
    build: .
    image: bridge-bids:latest
    container_name: bridge-bids
    ports:
      - "${PORT:-9015}:9015"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: "1.0"
