  status: infere
- id: 1H.1S.2S
  seq: "1H 1S"
  call: 2S
  cond: "S >= 4"
  forcing: NF
  meaning: "Fit ♠, minimum"
  meaning_en: "♠ fit, minimum"
  status: infere
- id: 1H.1S.2NT
  seq: "1H 1S"
