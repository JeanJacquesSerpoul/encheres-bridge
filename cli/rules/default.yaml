# ======================================================================
# A.11 Blackwood 5 clés : réponses
# ======================================================================
# Réponses au 4SA Blackwood quand l'atout convenu est `{t}` (voir A.12 pour l'atout convenu, les entrées et la suite). Les réponses avec chicane (5SA, 6♣, 6♦) ne sont utilisées qu'avec un atout majeur.
- id: "bw.{t}.6D"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT"
  call: 6D
  cond: "keycards('{t}') in (1, 3) and D == 0 and '{t}' in ('S', 'H')"
  forcing: NF
  meaning: "3 ou 1 clé + chicane ♦"
  meaning_en: "3 or 1 keycard + ♦ void"
  status: sef
- id: "bw.{t}.6C"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT"
  call: 6C
  cond: "keycards('{t}') in (1, 3) and C == 0 and '{t}' in ('S', 'H')"
  forcing: NF
  meaning: "3 ou 1 clé + chicane ♣"
  meaning_en: "3 or 1 keycard + ♣ void"
  status: sef
- id: "bw.{t}.5NT"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT"
  call: 5NT
  cond: "keycards('{t}') in (2, 4) and min(S, H, D, C) == 0 and '{t}' in ('S', 'H')"
  forcing: NF
  meaning: "2 clés (ou 4) et une chicane"
  meaning_en: "2 keycards (or 4) and a void"
  status: sef
- id: "bw.{t}.5S"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT"
  call: 5S
  cond: "keycards('{t}') == 2 and queen('{t}')"
  forcing: NF
  meaning: "2 clés avec la Dame d'atout"
  meaning_en: "2 keycards with the trump queen"
  status: sef
- id: "bw.{t}.5H"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT"
  call: 5H
  cond: "keycards('{t}') == 2"
  forcing: NF
  meaning: "2 clés sans la Dame d'atout"
  meaning_en: "2 keycards without the trump queen"
  status: sef
- id: "bw.{t}.5D"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT"
  call: 5D
  cond: "keycards('{t}') in (1, 4)"
  forcing: NF
  meaning: "4 ou 1 clé"
  meaning_en: "4 or 1 keycard"
  status: sef
