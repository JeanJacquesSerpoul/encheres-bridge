- id: "q.{m}{M}.2NT.6NT"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}]
  seq: "1{m} 1{M} 2NT"
  call: 6NT
  cond: "hl >= 15 and {M} < 6"
