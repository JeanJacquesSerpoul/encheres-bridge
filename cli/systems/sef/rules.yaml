  meaning_en: "Jump shift: 17+ HL, game forcing"
  status: infere
- id: "1H.1S.2{m}"
  for: [{m: C}, {m: D}]
  seq: "1H 1S"
  call: "2{m}"
  cond: "{m} >= 4 and {m} >= max(C, D)"
  forcing: NF
  meaning: "Bicolore, 4+ cartes"
