- id: q.1m.3NT.4NT.p
  seq: ["1C|1D 3NT 4NT", "1C|1D 1D|1H|1S 1H|1S 3NT 4NT"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "Refuse"
