# ======================================================================
# A.14 Roudi
# ======================================================================
# Après 1♣/♦ – 1♥/♠ – 1SA, 2♣ du répondant (11+ HL, majeure 5e) demande à l'ouvreur son soutien. SEF 2024 : toutes les enchères du répondant au niveau de 3 après le Roudi sont forcing de manche.
- id: "roudi.{m}.{M}"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}]
