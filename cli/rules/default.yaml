# ======================================================================
# A.15 3e couleur forcing
# ======================================================================
# Le répondant nomme la 3e couleur après la répétition de la mineure d'ouverture : il rallonge sa couleur, demande un arrêt pour SA ou rend l'enchère forcing (9+ HL, pas auto-forcing). Réponses non forcing de l'ouvreur : retour à 2 dans la majeure du répondant, 2SA avec arrêt, répétition de sa couleur. Le soutien de la 3e couleur est naturel.
# cas : o = ouverture, M = majeure du répondant, t = 3e couleur, f = 4e couleur (non nommée)
- id: 1C.1S.2C.2H
  seq: "1C 1S 2C"
  call: 2H
  cond: "S >= 5 and H >= 4 and hl >= 11"
  forcing: F1
  meaning: "5+♠ et 4+♥, forcing"
  meaning_en: "5+♠ and 4+♥, forcing"
  status: sef
- id: 1D.1S.2D.3C
  seq: "1D 1S 2D"
  call: 3C
  cond: "S == 4 and C >= 4 and hl >= 12"
  forcing: FM
  meaning: "Dénie 5♠, force à ♣"
  meaning_en: "Denies 5♠, forces with ♣"
  status: sef
- id: "tcf.{o}{M}.ask"
  for: [{o: C, M: H, t: D, f: S, call: 2D}, {o: C, M: S, t: D, f: H, call: 2D}, {o: D, M: H, t: S, f: C, call: 2S}, {o: D, M: S, t: H, f: C, call: 2H}]
  seq: "1{o} 1{M} 2{o}"
  call: "{call}"
  cond: "hl >= 11 and not ((balanced or semibalanced) and stop('{t}') and stop('{f}'))"
  forcing: F1
  meaning: "3e couleur forcing"
  meaning_en: "Third suit forcing"
  status: sef
  alert: true
# --- réponses de l'ouvreur
- id: "tcf.{o}{M}.fit3"
