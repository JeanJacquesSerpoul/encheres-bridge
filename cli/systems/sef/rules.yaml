- id: def1NT.X.2D.2S
  seq: "(1NT) X 2D"
  call: 2S
  cond: "true"
  forcing: NF
  meaning: "Majeure ♠"
  meaning_en: "Spade major"
  status: infere
- id: def1NT.2C.2D.rep
  seq: ["(1NT) 2C 2D", "(1NT) P 2C 2D"]
  call: 2H
  cond: "H >= S"
  forcing: NF
  meaning: "Majeure la plus longue (♥ à égalité)"
  meaning_en: "Longer major (♥ if equal)"
  status: infere
- id: def1NT.2C.2D.rep.S
