services:
  openrouter_proxy:
    build: .
    image: openrouter_proxy:latest
    container_name: openrouter_proxy
    restart: unless-stopped
    ports:
      - "${PORT:-9013}:${PORT:-9013}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-9013}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-9013}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
