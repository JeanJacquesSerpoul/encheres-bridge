- id: 1S.1NT.2H
  seq: "1S 1NT"
  call: 2H
  cond: "H >= 4"
  forcing: NF
  meaning: "4+ cœurs"
  meaning_en: "4+ hearts"
  status: infere
- id: "1{M}.1NT.2{m}"
  for: [{M: H, m: D}, {M: H, m: C}, {M: S, m: D}, {M: S, m: C}]
  seq: "1{M} 1NT"
  call: "2{m}"
  cond: "{m} >= 4 and {m} >= max(C, D) and not balanced"
  forcing: NF
  meaning: "4+ cartes"
  meaning_en: "4+ cards"
  status: infere
- id: "1{M}.1NT.pass"
  for: [{M: H}, {M: S}]
  seq: "1{M} 1NT"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Minimum régulier"
  meaning_en: "Balanced minimum"
  status: infere

# --- répondant après un bicolore cher (forcing)
# en: responder after a reverse (forcing)
- id: "rev.{s}.4H"
  for: [{s: "1C|1D 1S 2H"}]
  seq: "{s}"
  call: 4H
  cond: "H >= 4 and hl >= 8"
  forcing: SO
  meaning: "Fit ♥, manche"
  meaning_en: "♥ fit, game"
  status: infere
- id: "rev.{i}.6NT"
  for: [{i: a, s: "1C|1D 1S 2H"}, {i: b, s: "1C 1H|1S 2D"}]
  seq: "{s}"
  call: 6NT
  cond: "hl >= 16 and (balanced or semibalanced)"
  forcing: SO
  meaning: "16+ HL face au bicolore cher : petit chelem à SA"
  meaning_en: "16+ HL opposite a reverse: small slam in NT"
  status: infere
- id: "rev.{i}.3NT"
  for: [{i: a, s: "1C|1D 1S 2H"}, {i: b, s: "1C 1H|1S 2D"}]
  seq: "{s}"
  call: 3NT
  cond: "hl >= 8"
  forcing: SO
  meaning: "Manche à SA"
  meaning_en: "Game in NT"
  status: infere
- id: "rev.{i}.2NT"
  for: [{i: a, s: "1C|1D 1S 2H"}, {i: b, s: "1C 1H|1S 2D"}]
  seq: "{s}"
  call: 2NT
  cond: "true"
  forcing: NF
  meaning: "Minimum"
  meaning_en: "Minimum"
  status: infere
- id: "rev.{i}.2NT.r"
  for: [{i: a, s: "1C|1D 1S 2H 2NT"}, {i: b, s: "1C 1H|1S 2D 2NT"}]
  seq: "{s}"
  call: 3NT
  cond: "hl >= 19"
  forcing: SO
  meaning: "Manche"
  meaning_en: "Game"
  status: infere
- id: "rev.{i}.2NT.p"
  for: [{i: a, s: "1C|1D 1S 2H 2NT"}, {i: b, s: "1C 1H|1S 2D 2NT"}]
  seq: "{s}"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Passe"
  meaning_en: "Pass"
  status: infere

# --- 2SA mini-maxi après 2 sur 1 : le répondant dit 3SA, l'ouvreur 18-19 continue à 4SA
# en: min-max 2NT after a two-over-one: responder bids 3NT, an 18-19 opener goes on to 4NT
