- id: "rub.{i}.{t}.acc"
  for: [{i: 2H, t: 2NT, r: 3C}, {i: 2H, t: 3C, r: 3D}, {i: 2H, t: 3H, r: 3S}, {i: 2S, t: 2NT, r: 3C}, {i: 2S, t: 3C, r: 3D}, {i: 2S, t: 3D, r: 3H}]
  seq: "1NT ({i}) {t}"
  call: "{r}"
  cond: "true"
  forcing: NF
  meaning: "Complète le Texas"
  meaning_en: "Completes the transfer"
  status: sef
- id: "rub.{i}.X.{r}"
  for: [{i: 2H, r: 2S, t: "S >= 4"}, {i: 2H, r: 2NT, t: "stop('H')"}, {i: 2H, r: 3C, t: "C >= D"}, {i: 2H, r: 3D, t: "true"},
        {i: 2S, r: 3H, t: "H >= 4"}, {i: 2S, r: 2NT, t: "stop('S')"}, {i: 2S, r: 3C, t: "C >= D"}, {i: 2S, r: 3D, t: "true"}]
  seq: "1NT ({i}) X"
  call: "{r}"
  cond: "{t}"
  forcing: NF
  meaning: "Réponse au contre Spoutnik"
  meaning_en: "Answer to the Sputnik double"
  status: infere
# --- ouverture mineure contrée, surcontre : l'ouvreur attend
