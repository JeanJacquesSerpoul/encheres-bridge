# --- l'ouvreur après le 1SA de son partenaire au deuxième tour
# en: opener after partner's 1NT at the second round
- id: "o4.{s}.1NT.3NT"
  for: [{s: "1C 1D 1H"}, {s: "1C 1D 1S"}, {s: "1C 1H 1S"}, {s: "1D 1H 1S"}]
  seq: "{s} 1NT"
  call: 3NT
  cond: "hl >= 18"
  forcing: SO
  meaning: "18+ HL : manche à SA"
  meaning_en: "18+ HL: game in notrump"
  status: infere
- id: "o4.{s}.1NT.2NT"
  for: [{s: "1C 1D 1H"}, {s: "1C 1D 1S"}, {s: "1C 1H 1S"}, {s: "1D 1H 1S"}]
  seq: "{s} 1NT"
  call: 2NT
  cond: "16 <= hl <= 17"
  forcing: INV
  meaning: "16-17 HL : invitation"
  meaning_en: "16-17 HL: invitation"
