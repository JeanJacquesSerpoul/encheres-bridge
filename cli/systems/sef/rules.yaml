# --- 1SA et intervention adverse à 2♣ ou 2♦ (hors Rubensohl) : le répondant, naturel
# en: 1NT and an opposing 2♣ or 2♦ overcall (outside Rubensohl): responder, natural
- id: "1NT.int{i}.4{M}"
  for: [{i: 2C, M: S}, {i: 2C, M: H}, {i: 2D, M: S}, {i: 2D, M: H}]
  seq: "1NT ({i})"
