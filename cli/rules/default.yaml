- id: "bwa.{t}.low.6"
  for: [{t: H, r: "5S|5NT|6C|6D"}, {t: S, r: "5S|5NT|6C|6D"}, {t: D, r: "5H|5S"}, {t: C, r: "5D|5H|5S"}]
  seq: "BW:{t} 4NT {r}"
  call: "6{t}"
  cond: "true"
  forcing: SO
  meaning: "Petit chelem (ou pas de palier de 5 disponible)"
  meaning_en: "Small slam (or no 5-level available)"
