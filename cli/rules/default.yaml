# SEF 2024 — règles d'enchères
# SOURCE UNIQUE DES RÈGLES : c'est ce fichier que l'on modifie.
# Sémantique (séquences, conditions, algorithme) : SEF_2024_spec.md. Description bridge : SEF_2024.md.
# Liste ordonnée : la première règle applicable donne l'enchère.
# Les règles avec « for » sont des modèles, expansés par sef_rules.py.
# Après modification :
#   python3 tools/python_tools/sef_rules.py cli/rules/default.yaml --validate
#   (cd tools/python_tools && python3 sef_rules.py ../../cli/rules/default.yaml --json sef_rules.json)
#   (cd tools/python_tools && python3 sef_rules.py ../../cli/rules/default.yaml --gen-tests 1500 sef_tests.json --seed 2024)

# ======================================================================
# A.4 Ouvertures
# ======================================================================
# Ordre = priorité : on vérifie d'abord les ouvertures fortes, puis 1SA, les ouvertures au palier de 1, enfin les barrages.
- id: open.2D
  seq: ""
  call: 2D
  cond: "(balanced and hcp >= 24) or (hcp >= 16 and ptricks >= 9 and sidetricks >= 2)"
  forcing: FM
  meaning: "Fort, forcing de manche : 9 levées de jeu et 2 levées de défense annexes (ou régulier 24+ H)"
  meaning_en: "Strong, game-forcing: 9 playing tricks and 2 side defensive tricks (or balanced 24+ HCP)"
  status: choix
  alert: true
- id: open.2C
  seq: ""
  call: 2C
  cond: "(balanced and 22 <= hl <= 23) or (max(S, H) >= 5 and 18 <= hl <= 21 and ptricks >= 8) or (max(C, D) >= 7 and 15 <= hcp <= 16 and ptricks >= 8.5)"
  forcing: F1
  meaning: "Fort indéterminé : 5/6 cartes majeures 18-21 HL, ou 7 cartes mineures, ou 22-23 HL régulier"
  meaning_en: "Strong, undefined: 5/6-card major 18-21 HL, or 7-card minor, or balanced 22-23 HL"
  status: sef
  alert: true
- id: open.2NT
  seq: ""
  call: 2NT
  cond: "20 <= hl <= 21 and (balanced or shape == '5422' or (shape == '6322' and max(C, D) == 6))"
  forcing: NF
  meaning: "20-21 HL, régulier (5M, 5422 ou 6322 avec 6 cartes mineures possibles)"
  meaning_en: "20-21 HL, balanced (5-card major, 5422 or 6322 with a 6-card minor possible)"
  status: choix
- id: open.1NT
  seq: ""
  call: 1NT
  cond: "15 <= hl <= 17 and balanced and not (shape == '5332' and max(S, H) == 5 and hcp == 17)"
  forcing: NF
  meaning: "15-17 HL régulier ; 5332 avec majeure 5e : 15-16 H"
  meaning_en: "15-17 HL balanced; 5332 with 5-card major: 15-16 HCP"
  status: sef
- id: open.3NT
  seq: ""
  call: 3NT
  cond: "(C >= 7 and solid('C') and hcp - hcp_in('C') <= 3) or (D >= 7 and solid('D') and hcp - hcp_in('D') <= 3)"
  forcing: NF
  meaning: "Mineure 7e affranchie et rien à côté"
  meaning_en: "Solid 7-card minor and nothing outside"
  status: sef
  alert: true
- id: open.1S
  seq: ""
  call: 1S
  cond: "S >= 5 and S >= H and hcp >= 12"
  forcing: NF
  meaning: "5+ piques, 12+ H (5-5 majeur : 1♠)"
  meaning_en: "5+ spades, 12+ HCP (5-5 in the majors: 1♠)"
  status: sef
- id: open.1H
  seq: ""
  call: 1H
  cond: "H >= 5 and hcp >= 12"
  forcing: NF
  meaning: "5+ cœurs, 12+ H"
  meaning_en: "5+ hearts, 12+ HCP"
  status: sef
- id: open.1D
  seq: ""
  call: 1D
  cond: "hcp >= 12 and D >= 3 and (D > C or (D == C and D >= 4))"
  forcing: NF
  meaning: "Mineure la plus longue (4-4 : 1♦)"
  meaning_en: "Longest minor (4-4: 1♦)"
  status: sef
- id: open.1C
  seq: ""
  call: 1C
  cond: "hcp >= 12"
  forcing: NF
  meaning: "Mineure la plus longue (3-3 : 1♣)"
  meaning_en: "Longest minor (3-3: 1♣)"
  status: sef
- id: open.4NT
  seq: ""
  call: 4NT
  cond: "C >= 5 and D >= 5 and C + D >= 11 and losers <= 4"
  forcing: F1
  meaning: "Bicolore mineur 6/5+ et 4 perdantes"
  meaning_en: "6/5+ minor two-suiter and 4 losers"
  status: sef
  alert: true
- id: "open.5{m}"
  for: [{m: C}, {m: D}]
  seq: ""
  call: "5{m}"
  cond: "hcp <= 11 and ({m} >= 9 or ({m} >= 8 and C >= 4 and D >= 4))"
  forcing: NF
  meaning: "Barrage : 9 cartes, ou 8/4 en mineures"
  meaning_en: "Preempt: 9 cards, or 8/4 in the minors"
  status: sef
- id: "open.4{X}"
  for: [{X: S}, {X: H}, {X: D}, {X: C}]
  seq: ""
  call: "4{X}"
  cond: "hcp <= 11 and (({X} >= 8 and top('{X}') >= 2) or (not vul and {X} == 7 and shape in ('7411', '7420')))"
  forcing: NF
  meaning: "Barrage : 8 cartes dont 2 gros honneurs, ou main 7/4 (non vulnérable)"
  meaning_en: "Preempt: 8 cards including 2 high honors, or 7/4 hand (not vulnerable)"
  status: choix
- id: "open.3{X}"
  for: [{X: S}, {X: H}, {X: D}, {X: C}]
  seq: ""
  call: "3{X}"
  cond: "hcp <= 10 and {X} == 7 and ((vul and hcp_in('{X}') >= 6) or (not vul and opp_vul and top('{X}') >= 1) or (not vul and not opp_vul and top('{X}') >= 2))"
  forcing: NF
  meaning: "Barrage : 7 cartes avec 2 gros honneurs (vulnérable : 6 H dans la couleur ; vulnérabilité favorable : 1 gros honneur)"
  meaning_en: "Preempt: 7-card suit with 2 high honors (vulnerable: 6 HCP in the suit; favorable vulnerability: 1 high honor)"
  status: choix
- id: "open.2{M}"
  for: [{M: S}, {M: H}]
  seq: ""
  call: "2{M}"
  cond: "{M} == 6 and ((vul and 7 <= hl <= 10 and top('{M}') >= 2) or (not vul and opp_vul and 5 <= hl <= 10) or (not vul and not opp_vul and 6 <= hl <= 10))"
  forcing: NF
  meaning: "2 faible : 6 cartes, 6-10 HL (vulnérable : 7-10 HL et 2 gros honneurs ; vulnérabilité favorable : 5-10 HL)"
  meaning_en: "Weak two: 6 cards, 6-10 HL (vulnerable: 7-10 HL and 2 high honors; favorable vulnerability: 5-10 HL)"
  status: choix
- id: open.pass
  seq: ""
  call: P
  cond: "true"
  forcing: NF
  meaning: "Pas d'ouverture"
  meaning_en: "No opening"
  status: sef

# ======================================================================
# A.5 Ouverture de 1SA
# ======================================================================
# Sur 1SA contré, le camp de l'ouvreur ignore le contre (SEF : « 2♣ = Stayman, etc. ») : chaque motif porte aussi sa variante « 1NT (X) … ».
# Réponses
- id: 1NT.r.5NT
  seq: ["1NT", "1NT (X)"]
  call: 5NT
  cond: "18 <= hl <= 19 and S < 4 and H < 4"
  forcing: F1
  meaning: "18-19 HL : l'ouvreur dit 6SA (ou repart en Baron)"
  meaning_en: "18-19 HL: opener bids 6NT (or continues with Baron)"
  status: sef
- id: 1NT.r.4NT
  seq: ["1NT", "1NT (X)"]
  call: 4NT
  cond: "hl == 17 and S < 4 and H < 4"
  forcing: INV
  meaning: "Quantitatif 17 HL : proposition de petit chelem"
  meaning_en: "Quantitative 17 HL: invitation to small slam"
  status: choix
- id: 1NT.r.4D
  seq: ["1NT", "1NT (X)"]
  call: 4D
  cond: "H >= 5 and S >= 5 and 9 <= hcp <= 12"
  forcing: REL
  meaning: "Bicolore ♥/♠ 5-5, 9-12 H : l'ouvreur choisit la majeure"
  meaning_en: "5-5 in hearts/spades, 9-12 HCP: opener chooses the major"
  status: sef
  alert: true
- id: "1NT.r.3{M}.slam"
  for: [{M: S}, {M: H}, {M: D}]
  seq: ["1NT", "1NT (X)"]
  call: "3{M}"
  cond: "{M} >= 6 and hl >= 17"
  forcing: FM
  meaning: "Espoir de chelem dans la couleur (6+ cartes)"
  meaning_en: "Slam interest in the suit (6+ cards)"
  status: sef
- id: "1NT.r.4{M}"
  for: [{M: S}, {M: H}]
  seq: ["1NT", "1NT (X)"]
  call: "4{M}"
  cond: "{M} >= 6 and {M} >= max(S, H) and 9 <= hl <= 16"
  forcing: SO
  meaning: "Naturel, 6+ cartes, pour jouer"
  meaning_en: "Natural, 6+ cards, to play"
  status: sef
- id: 1NT.r.2D.55weak
  seq: ["1NT", "1NT (X)"]
  call: 2D
  cond: "H == 5 and S == 5 and 7 <= hl <= 8"
  forcing: REL
  meaning: "Texas ♥ (suivi de 2♠ : 5-5 majeur 7-8 H)"
  meaning_en: "Texas ♥ (followed by 2♠: 5-5 majors, 7-8 HCP)"
  status: sef
  alert: true
- id: 1NT.r.2C.54
  seq: ["1NT", "1NT (X)"]
  call: 2C
  cond: "max(H, S) == 5 and min(H, S) == 4 and hl >= 7"
  forcing: F1
  meaning: "Stayman (5-4 majeur, 7+ H)"
  meaning_en: "Stayman (5-4 in the majors, 7+ HCP)"
  status: sef
  alert: true
- id: 1NT.r.2C.misere
  seq: ["1NT", "1NT (X)"]
  call: 2C
  cond: "max(H, S) == 5 and 7 <= hl <= 8 and min(S, H, D, C) <= 1"
  forcing: F1
  meaning: "Stayman « misère dorée » : majeure 5e et singleton, 7-8 HL"
  meaning_en: "Golden Misery Stayman: 5-card major and singleton, 7-8 HL"
  status: sef
  alert: true
- id: 1NT.r.2C
  seq: ["1NT", "1NT (X)"]
  call: 2C
  cond: "(H == 4 or S == 4) and max(H, S) < 5 and hl >= 8 and not (shape == '4333' and hcp < 12)"
  forcing: F1
  meaning: "Stayman 4 réponses : majeure 4e, 8+ H (4333 : 12+ H)"
  meaning_en: "4-response Stayman: 4-card major, 8+ HCP (4333: 12+ HCP)"
  status: sef
  alert: true
- id: 1NT.r.2H
  seq: ["1NT", "1NT (X)"]
  call: 2H
  cond: "S >= 5 and S >= H"
  forcing: REL
  meaning: "Texas ♠ : 5+ piques"
  meaning_en: "Texas ♠: 5+ spades"
  status: sef
  alert: true
- id: 1NT.r.2D
  seq: ["1NT", "1NT (X)"]
  call: 2D
  cond: "H >= 5"
  forcing: REL
  meaning: "Texas ♥ : 5+ cœurs"
  meaning_en: "Texas ♥: 5+ hearts"
  status: sef
  alert: true
- id: 1NT.r.2S.minors
  seq: ["1NT", "1NT (X)"]
  call: 2S
  cond: "C >= 5 and D >= 5 and hl >= 9"
  forcing: REL
  meaning: "Texas ♣ (bicolore mineur 5/5 de manche : ♦ annoncés ensuite)"
  meaning_en: "Texas ♣ (game-going 5/5 minor two-suiter: diamonds bid next)"
  status: sef
  alert: true
- id: 1NT.r.2S
  seq: ["1NT", "1NT (X)"]
  call: 2S
  cond: "C >= 6 and C >= D and (hl < 8 or (hl >= 12 and min(S, H, D) <= 1))"
  forcing: REL
  meaning: "Texas ♣ : 6+ trèfles, faible ou avec courte (ambition)"
  meaning_en: "Texas ♣: 6+ clubs, weak or with shortness (ambitious)"
  status: sef
  alert: true
- id: 1NT.r.3C
  seq: ["1NT", "1NT (X)"]
  call: 3C
  cond: "D >= 6 and (hl < 8 or (hl >= 12 and min(S, H, C) <= 1))"
  forcing: REL
  meaning: "Texas ♦ : 6+ carreaux, faible ou avec courte (ambition)"
  meaning_en: "Texas ♦: 6+ diamonds, weak or with shortness (ambitious)"
  status: sef
  alert: true
- id: 1NT.r.2NT
  seq: ["1NT", "1NT (X)"]
  call: 2NT
  cond: "hl == 8"
  forcing: INV
  meaning: "8 H, proposition de manche"
  meaning_en: "8 HCP, game invitation"
  status: sef
- id: 1NT.r.3NT
  seq: ["1NT", "1NT (X)"]
  call: 3NT
  cond: "9 <= hl <= 16"
  forcing: SO
  meaning: "9-16 HL, pour jouer"
  meaning_en: "9-16 HL, to play"
  status: sef
- id: 1NT.r.6NT
  seq: ["1NT", "1NT (X)"]
  call: 6NT
  cond: "hl >= 20"
  forcing: SO
  meaning: "20+ HL : petit chelem direct"
  meaning_en: "20+ HL: direct small slam"
  status: infere
- id: 1NT.r.pass
  seq: ["1NT", "1NT (X)"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "Moins de 8 H, sans couleur à montrer"
  meaning_en: "Fewer than 8 HCP, no suit to show"
  status: sef
