# --- face à 3SA du partenaire : un bicolore 6-4 (ou plus) avec une courte joue la manche dans sa majeure 6e.
# Mesuré sur le banc du par (−139 IMP).
# en: opposite partner's 3NT: a 6-4 (or longer) two-suiter with a shortness plays game in its six-card major.
# en: Measured on the par benchmark (−139 IMP).
- id: "gen.3NT.bico.4{M}"
  for: [{M: S, o: "max(H, D, C)"}, {M: H, o: "max(S, D, C)"}]
  seq: "** 3NT"
  call: "4{M}"
  cond: "{M} >= 6 and {o} >= 4 and min(S, H, D, C) <= 1"
  forcing: SO
  meaning: "Majeure 6e, 4e couleur et courte : la manche à la couleur plutôt que 3SA"
  meaning_en: "Six-card major, a side four-card suit and a shortness: game in the suit rather than 3NT"
  status: infere

