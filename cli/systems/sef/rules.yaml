# --- Super Drury : interrogative au singleton
# en: Super Drury: singleton ask
- id: "sdrury.{M}.3C"
  for: [{M: H}, {M: S}]
  seq: "P 1{M} 2NT"
  call: 3C
  cond: "hld >= 14"
  forcing: F1
  meaning: "Interrogatif au singleton"
  meaning_en: "Singleton ask"
  status: sef
  alert: true
- id: "sdrury.{M}.3M"
  for: [{M: H}, {M: S}]
  seq: "P 1{M} 2NT"
  call: "3{M}"
  cond: "true"
  forcing: NF
  meaning: "Minimum : pas d'intérêt"
  meaning_en: "Minimum: no interest"
  status: infere
- id: "sdrury.{M}.{s}"
  for: [{M: S, s: D, c: 3D}, {M: S, s: H, c: 3H}, {M: S, s: C, c: 3S}, {M: H, s: D, c: 3D}, {M: H, s: C, c: 3H}, {M: H, s: S, c: 3S}]
  seq: "P 1{M} 2NT 3C"
  call: "{c}"
  cond: "{s} <= 1"
  forcing: F1
  meaning: "Singleton (ou chicane) dans la couleur"
  meaning_en: "Singleton (or void) in the suit"
  status: sef
  alert: true
- id: "sdrury.{M}.{s}.bw"
  for: [{M: S, s: D, c: 3D, km: "true"}, {M: S, s: H, c: 3H, km: "true"}, {M: S, s: C, c: 3S, km: "true"}, {M: H, s: D, c: 3D, km: "keycards('H') >= 2"}, {M: H, s: C, c: 3H, km: "keycards('H') >= 2"}, {M: H, s: S, c: 3S, km: "keycards('H') >= 2"}]
  seq: "P 1{M} 2NT 3C {c}"
  call: 4NT
  cond: "hl >= 18 and hcp_in('{s}') <= 1 and ({km})"
  forcing: ASK
  meaning: "Rien de perdu dans le singleton : Blackwood"
  meaning_en: "Nothing wasted in the singleton: Blackwood"
  status: infere
  alert: true
- id: "sdrury.{M}.sing.4M"
  for: [{M: H}, {M: S}]
  seq: "P 1{M} 2NT 3C 3D|3H|3S"
  call: "4{M}"
  cond: "true"
  forcing: SO
  meaning: "Manche"
  meaning_en: "Game"
  status: infere
- id: "sdrury.{M}.3M.p"
  for: [{M: H}, {M: S}]
  seq: "P 1{M} 2NT 3{M}"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Partielle"
  meaning_en: "Partscore"
  status: infere

# ======================================================================
# A.8 Ouvertures de 1♥ / 1♠ : réponses et suites
# ======================================================================
# en: A.8 1♥ / 1♠ openings: responses and continuations
- id: "1{M}.r.4NT"
  for: [{M: H, km: "keycards('H') >= 2 or (keycards('H') >= 1 and queen('H'))"}, {M: S, km: "true"}]
  seq: "1{M}"
  call: 4NT
  cond: "{M} >= 4 and hl >= 17 and ({km})"
  forcing: ASK
  meaning: "Blackwood 5 clés"
  meaning_en: "5-keycard Blackwood"
  status: sef
  alert: true
  trump: "{M}"
- id: "1{M}.r.5{M}"
  for: [{M: H}, {M: S}]
  seq: "1{M}"
  call: "5{M}"
  cond: "{M} >= 4 and hl >= 16 and top('{M}') == 0"
  forcing: ASK
  meaning: "Demande de qualité d'atout"
  meaning_en: "Trump quality ask"
  status: sef
  alert: true
- id: 1H.r.2S.strong
  seq: "1H"
  call: 2S
  cond: "S >= 6 and hl >= 15"
  forcing: FM
  meaning: "6 piques, 15+ HL : proposition de chelem"
  meaning_en: "6 spades, 15+ HL: slam try"
  status: sef
- id: 1S.r.3H.strong
  seq: "1S"
  call: 3H
  cond: "H >= 6 and hl >= 15"
  forcing: FM
  meaning: "6 cœurs, 15+ HL : proposition de chelem"
  meaning_en: "6 hearts, 15+ HL: slam try"
  status: sef
- id: "1{M}.r.3{m}.strong"
  for: [{M: H, m: C}, {M: H, m: D}, {M: S, m: C}, {M: S, m: D}]
  seq: "1{M}"
  call: "3{m}"
  cond: "{m} >= 6 and hl >= 16"
  forcing: FM
  meaning: "Unicolore 6 cartes, 16+ HL, espoir de chelem"
  meaning_en: "Solid 6-card suit, 16+ HL, slam interest"
  status: sef
- id: "1{M}.r.splinter{s}"
  for: [{M: H, s: C, call: 4C}, {M: H, s: D, call: 4D}, {M: H, s: S, call: 3S}, {M: S, s: C, call: 4C}, {M: S, s: D, call: 4D}, {M: S, s: H, call: 4H}]
  seq: "1{M}"
  call: "{call}"
  cond: "{M} >= 4 and 13 <= dh <= 15 and hcp <= 10 and short('{s}')"
  forcing: FM
  meaning: "Splinter : 4 atouts, 13-14 DH (10 H max), courte dans la couleur"
  meaning_en: "Splinter: 4-card support, 13-14 DH (10 HCP max), shortness in the suit"
  status: sef
  alert: true
- id: "1{M}.r.4{M}"
  for: [{M: H}, {M: S}]
  seq: "1{M}"
  call: "4{M}"
  cond: "{M} >= 5 and hcp <= 9"
  forcing: SO
  meaning: "Barrage, 5 atouts"
  meaning_en: "Preempt, 5-card support"
  status: sef
- id: "1{M}.r.3NT"
  for: [{M: H}, {M: S}]
  seq: "1{M}"
  call: 3NT
  cond: "{M} == 4 and balanced and 12 <= hcp <= 14"
  forcing: NF
  meaning: "3SA fitté : 4 atouts, 12-14 H, régulier"
  meaning_en: "Fit 3NT: 4-card support, 12-14 HCP, balanced"
  status: sef
  alert: true
- id: "1{M}.r.3{M}"
  for: [{M: H}, {M: S}]
  seq: "1{M}"
  call: "3{M}"
  cond: "{M} >= 4 and 11 <= dh <= 12"
  forcing: INV
  meaning: "4 atouts, 11-12 DH"
  meaning_en: "4-card support, 11-12 DH"
  status: sef
- id: "1{M}.r.2NT"
  for: [{M: H}, {M: S}]
  seq: "1{M}"
  call: 2NT
  cond: "({M} == 3 or ({M} == 4 and shape == '4333')) and 11 <= hl <= 12"
  forcing: INV
  meaning: "2SA fitté : 3 atouts (ou 4 atouts 4333), 11-12 HL"
  meaning_en: "Fit 2NT: 3-card support (or 4-card support 4333), 11-12 HL"
  status: sef
  alert: true
- id: 1H.r.1S
  seq: "1H"
  call: 1S
  cond: "S >= 4 and hcp >= 5 and (H < 3 or hl >= 12)"
  forcing: F1
  meaning: "4+ piques, 5+ H"
  meaning_en: "4+ spades, 5+ HCP"
  status: sef
- id: 1S.r.2H
  seq: "1S"
  call: 2H
  cond: "H >= 5 and hl >= 10"
  forcing: F1
  meaning: "5+ cœurs, 10+ points (HL), forcing"
  meaning_en: "5+ hearts, 10+ points (HL), forcing"
  status: choix
- id: "1{M}.r.2{m}"
  for: [{M: H, m: D}, {M: H, m: C}, {M: S, m: D}, {M: S, m: C}]
  seq: "1{M}"
  call: "2{m}"
  cond: "{m} >= 4 and hl >= 11 and {m} >= max(C, D)"
  forcing: F1
  meaning: "4+ cartes, 11+ HL"
  meaning_en: "4+ cards, 11+ HL"
  status: sef
- id: "1{M}.r.2m.fallback"
  for: [{M: H}, {M: S}]
  seq: "1{M}"
  call: 2C
  cond: "hl >= 11 and C >= D"
  forcing: F1
  meaning: "Repli : 2♣ (3+ cartes), main forte"
  meaning_en: "Fallback: 2♣ (3+ cards), strong hand"
  status: infere
- id: "1{M}.r.2d.fallback"
  for: [{M: H}, {M: S}]
  seq: "1{M}"
  call: 2D
  cond: "hl >= 11"
  forcing: F1
  meaning: "Repli : 2♦ (3+ cartes), main forte"
  meaning_en: "Fallback: 2♦ (3+ cards), strong hand"
  status: infere
- id: "1{M}.r.2{M}"
  for: [{M: H}, {M: S}]
  seq: "1{M}"
  call: "2{M}"
  cond: "{M} >= 3 and 6 <= dh <= 10"
  forcing: NF
  meaning: "Soutien simple"
  meaning_en: "Simple raise"
  status: sef
- id: "1{M}.r.1NT"
  for: [{M: H}, {M: S}]
  seq: "1{M}"
  call: 1NT
  cond: "5 <= hl <= 10"
  forcing: NF
  meaning: "5-10 HL, non fitté"
  meaning_en: "5-10 HL, no fit"
  status: sef
- id: "1{M}.r.pass"
  for: [{M: H}, {M: S}]
  seq: "1{M}"
  call: P
  cond: "hcp < 5"
  forcing: NF
  meaning: "Main nulle"
  meaning_en: "Nothing"
  status: sef
