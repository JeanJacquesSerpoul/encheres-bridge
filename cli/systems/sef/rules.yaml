- id: "js.{o}.{r}.{j}.4{r2}"
  for: [{o: 1D, r: 1H, r2: H, j: 3C}, {o: 1D, r: 1S, r2: S, j: 3C}, {o: 1H, r: 1S, r2: S, j: 3C}, {o: 1H, r: 1S, r2: S, j: 3D}]
  seq: "{o} {r} {j}"
  call: "4{r2}"
  cond: "{r2} >= 6"
  forcing: SO
