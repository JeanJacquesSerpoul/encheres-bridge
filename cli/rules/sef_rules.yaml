  meaning_en: "Quantitative"
  status: infere
- id: q.1m.3NT.4NT.acc
  seq: ["1C|1D 3NT 4NT", "1C|1D 1D|1H|1S 1H|1S 3NT 4NT"]
  call: 6NT
  cond: "hl >= 14"
  forcing: SO
  meaning: "Accepte"
  meaning_en: "Accepts"
  status: infere
- id: q.1m.3NT.4NT.p
  seq: ["1C|1D 3NT 4NT", "1C|1D 1D|1H|1S 1H|1S 3NT 4NT"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "Refuse"
  meaning_en: "Declines"
  status: infere
- id: "q.{m}{M}.2NT.6NT"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}]
  seq: "1{m} 1{M} 2NT"
  call: 6NT
  cond: "hl >= 15 and {M} < 6"
  forcing: SO
