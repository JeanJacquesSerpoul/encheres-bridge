# --- suites du répondant
- id: "roudi.{m}.{M}.max.4"
  for: [{m: C, M: H, f: 2S}, {m: D, M: H, f: 2S}, {m: C, M: S, f: 3S}, {m: D, M: S, f: 3S}]
  seq: "1{m} 1{M} 1NT 2C {f}"
  call: "4{M}"
  cond: "true"
  forcing: SO
  meaning: "Fit et maximum en face : manche"
  meaning_en: "Fit and maximum opposite: game"
  status: infere
- id: "roudi.{m}.{M}.min.4"
  for: [{m: C, M: H}, {m: D, M: H}, {m: C, M: S}, {m: D, M: S}]
  seq: "1{m} 1{M} 1NT 2C 2{M}"
