- id: "js.{M}.1NT.{c}.3NT"
  for: [{M: H, c: 3C}, {M: H, c: 3D}, {M: S, c: 3H}, {M: S, c: 3C}, {M: S, c: 3D}]
  seq: "1{M} 1NT {c}"
  call: 3NT
  cond: "true"
  forcing: SO
  meaning: "Manche à SA"
  meaning_en: "Game in notrump"
