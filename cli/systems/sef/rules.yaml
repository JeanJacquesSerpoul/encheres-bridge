  meaning: "Refuse"
  meaning_en: "Declines"
  status: infere

# --- 1SA – 2♠ – 3♣ – 3♦ (bicolore mineur de manche)
# en: 1NT – 2♠ – 3♣ – 3♦ (game-forcing minor two-suiter)
- id: 1NT.2S.3C.3D.3NT
  seq: ["1NT 2S 3C 3D", "1NT (X) 2S 3C 3D"]
  call: 3NT
  cond: "stop('H') and stop('S')"
  forcing: SO
  meaning: "Arrêts majeurs : 3SA"
  meaning_en: "Major-suit stoppers: 3NT"
  status: infere
- id: 1NT.2S.3C.3D.5D
  seq: ["1NT 2S 3C 3D", "1NT (X) 2S 3C 3D"]
  call: 5D
  cond: "D >= C"
  forcing: SO
  meaning: "Préférence ♦"
  meaning_en: "Prefers ♦"
  status: infere
- id: 1NT.2S.3C.3D.5C
  seq: ["1NT 2S 3C 3D", "1NT (X) 2S 3C 3D"]
  call: 5C
  cond: "true"
  forcing: SO
  meaning: "Préférence ♣"
  meaning_en: "Prefers ♣"
  status: infere

# --- après une réponse forte à saut (6 cartes, 16+) : simplifié
# en: after a strong jump response (6 cards, 16+): simplified
- id: "js.{s}.raise"
  for: [{s: "1C 2D", X: D}, {s: "1D 3C", X: C}, {s: "1C|1D 2H", X: H}, {s: "1C|1D 2S", X: S}, {s: "1H 2S", X: S}, {s: "1S 3H", X: H}, {s: "1H|1S 3C", X: C}, {s: "1H|1S 3D", X: D}]
  seq: "{s}"
  call: "4{X}"
  cond: "{X} >= 3 and '{X}' in ('H', 'S')"
  forcing: SO
  meaning: "Fit (les suites de chelem ne sont pas codées)"
  meaning_en: "Fit (slam continuations are not coded)"
  status: infere
- id: "js.{s}.3NT"
  for: [{s: "1C 2D", X: D}, {s: "1D 3C", X: C}, {s: "1C|1D 2H", X: H}, {s: "1C|1D 2S", X: S}, {s: "1H 2S", X: S}, {s: "1S 3H", X: H}, {s: "1H|1S 3C", X: C}, {s: "1H|1S 3D", X: D}]
  seq: "{s}"
  call: 3NT
  cond: "true"
  forcing: NF
  meaning: "Sans fit majeur : 3SA (suites de chelem non codées)"
  meaning_en: "No major fit: 3NT (slam continuations not coded)"
  status: infere
- id: "js.{s}.3NT.r"
  for: [{s: "1C 2D", X: D}, {s: "1D 3C", X: C}, {s: "1C|1D 2H", X: H}, {s: "1C|1D 2S", X: S}, {s: "1H 2S", X: S}, {s: "1S 3H", X: H}, {s: "1H|1S 3C", X: C}, {s: "1H|1S 3D", X: D}]
  seq: "{s} 3NT"
  call: "4{X}"
  cond: "{X} >= 6 and '{X}' in ('H', 'S')"
  forcing: SO
  meaning: "Manche dans la majeure"
  meaning_en: "Game in the major"
  status: infere

# --- barrages et soutiens terminaux
# en: preempts and terminal raises
- id: "pre.{s}.pass"
  for: [{s: "1C 4C"}, {s: "1D 4D"}, {s: "1C|1D 3H|3S"}]
  seq: "{s}"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Passe sur le barrage"
  meaning_en: "Pass over the preempt"
  status: infere

# --- répondant après 1♣ – 1♦ – 3♣ et après 2SA 18-19 de l'ouvreur
# en: responder after 1♣ – 1♦ – 3♣ and after opener's 18-19 2NT
- id: 1C.1D.3C.3NT
  seq: "1C 1D 3C"
  call: 3NT
  cond: "hl >= 7"
  forcing: SO
  meaning: "Manche"
  meaning_en: "Game"
  status: infere
- id: gen.r.2NT.3NT
  seq: "1C|1D|1H|1S 1D|1NT 2NT"
  call: 3NT
  cond: "hl >= 7"
  forcing: SO
  meaning: "Accepte l'invitation 18-19"
  meaning_en: "Accepts the 18-19 invitation"
  status: infere
- id: gen.r.2NT.p
  seq: ["1C|1D|1H|1S 1D|1NT 2NT", "1C 1D 3C"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "Minimum"
  meaning_en: "Minimum"
  status: infere

# --- répondant après 1♠ – 2♥ – 2♠ / 2SA / 3♥
# en: responder after 1♠ – 2♥ – 2♠ / 2NT / 3♥
- id: 1S.2H.x.4S
  seq: "1S 2H 2S|2NT|3H"
  call: 4S
  cond: "S >= 3 and hl >= 12"
  forcing: SO
  meaning: "Fit ♠, manche"
  meaning_en: "♠ fit, game"
  status: infere
- id: 1S.2H.x.4H
  seq: "1S 2H 2NT|3H"
  call: 4H
  cond: "H >= 5 and hl >= 10"
  forcing: SO
  meaning: "Manche à ♥"
  meaning_en: "Game in ♥"
  status: infere
- id: 1S.2H.x.3NT
  seq: "1S 2H 2S|2NT|3H"
  call: 3NT
  cond: "hl >= 12"
  forcing: SO
  meaning: "Manche à SA"
  meaning_en: "Game in NT"
  status: infere
- id: 1S.2H.x.3S
  seq: "1S 2H 2S"
  call: 3S
  cond: "S >= 3"
  forcing: INV
  meaning: "Fit ♠, 11-12"
  meaning_en: "♠ fit, 11-12"
  status: infere
- id: 1S.2H.x.3H
  seq: "1S 2H 2S"
  call: 3H
  cond: "H >= 6"
  forcing: INV
  meaning: "6 cœurs, 11-12"
  meaning_en: "6 hearts, 11-12"
  status: infere
- id: 1S.2H.x.2NT
  seq: "1S 2H 2S"
  call: 2NT
  cond: "true"
  forcing: INV
  meaning: "11-12"
  meaning_en: "11-12"
  status: infere
- id: 1S.2H.x.p
  seq: "1S 2H 2NT|3H"
  call: 4H
  cond: "H >= 5"
  forcing: SO
  meaning: "Manche (la réponse 2♥ promet 11+)"
  meaning_en: "Game (the 2♥ response promises 11+)"
  status: infere

# --- ouvreur après une réponse 2 sur 1 (1M – 2m, 1♦ – 2♣)
# en: opener after a two-over-one response (1M – 2m, 1♦ – 2♣)
- id: "{o}.2{m}.3NT"
  for: [{o: 1H, m: C}, {o: 1H, m: D}, {o: 1S, m: C}, {o: 1S, m: D}, {o: 1D, m: C}]
  seq: "{o} 2{m}"
  call: 3NT
  cond: "balanced and 15 <= hl <= 17"
  forcing: SO
  meaning: "Régulier 15-17 HL"
  meaning_en: "Balanced 15-17 HL"
  status: infere
- id: "{o}.2{m}.2NT"
  for: [{o: 1H, m: C}, {o: 1H, m: D}, {o: 1S, m: C}, {o: 1S, m: D}, {o: 1D, m: C}]
  seq: "{o} 2{m}"
  call: 2NT
  cond: "balanced"
  forcing: F1
  meaning: "Régulier 12-14 ou 18-19 (2SA mini-maxi)"
  meaning_en: "Balanced 12-14 or 18-19 (2NT mini-maxi)"
  status: sef
- id: "{o}.2{m}.3{m}"
  for: [{o: 1H, m: C}, {o: 1H, m: D}, {o: 1S, m: C}, {o: 1S, m: D}, {o: 1D, m: C}]
  seq: "{o} 2{m}"
  call: "3{m}"
  cond: "{m} >= 4"
  forcing: F1
  meaning: "Fit 4e"
  meaning_en: "4-card fit"
  status: infere
- id: "1S.2{m}.2H"
  for: [{m: C}, {m: D}]
  seq: "1S 2{m}"
  call: 2H
  cond: "H >= 4"
  forcing: F1
  meaning: "4+ cœurs"
  meaning_en: "4+ hearts"
  status: infere
- id: "{o}.2{m}.2{r}"
  for: [{o: 1H, m: C, r: H}, {o: 1H, m: D, r: H}, {o: 1S, m: C, r: S}, {o: 1S, m: D, r: S}, {o: 1D, m: C, r: D}]
  seq: "{o} 2{m}"
  call: "2{r}"
  cond: "true"
  forcing: F1
  meaning: "Répétition de la couleur d'ouverture"
  meaning_en: "Rebid of the opening suit"
  status: infere

# --- ouvreur : nouvelle couleur au palier de 1 après 1♣/♦ – 1♥
# en: opener: new suit at the one level after 1♣/♦ – 1♥
# (1{m} 1H 1S est déjà codé ; ici : 3e enchère du répondant)
# en: (1{m} 1H 1S is already coded; here: responder's third bid)
- id: "{o}.{r}.{b}.3NT"
  for: [{o: 1C, r: 1D, b: 1H}, {o: 1C, r: 1D, b: 1S}, {o: 1C, r: 1H, b: 1S}, {o: 1D, r: 1H, b: 1S}]
  seq: "{o} {r} {b}"
  call: 3NT
  cond: "hl >= 13 and balanced"
  forcing: SO
  meaning: "Manche à SA"
  meaning_en: "Game in NT"
  status: infere
- id: "{o}.{r}.{b}.raise"
  for: [{o: 1C, r: 1D, b: 1H, M: H}, {o: 1C, r: 1D, b: 1S, M: S}, {o: 1C, r: 1H, b: 1S, M: S}, {o: 1D, r: 1H, b: 1S, M: S}]
  seq: "{o} {r} {b}"
  call: "2{M}"
  cond: "{M} >= 4 and hld <= 10"
  forcing: NF
  meaning: "Fit 4e, minimum"
  meaning_en: "4-card fit, minimum"
  status: infere
- id: "{o}.{r}.{b}.raise4"
  for: [{o: 1C, r: 1D, b: 1H, M: H}, {o: 1C, r: 1D, b: 1S, M: S}, {o: 1C, r: 1H, b: 1S, M: S}, {o: 1D, r: 1H, b: 1S, M: S}]
  seq: "{o} {r} {b}"
  call: "4{M}"
  cond: "{M} >= 4 and hld >= 13"
  forcing: SO
  meaning: "Fit 4e, manche"
  meaning_en: "4-card fit, game"
  status: infere
- id: "{o}.{r}.{b}.raise3"
  for: [{o: 1C, r: 1D, b: 1H, M: H}, {o: 1C, r: 1D, b: 1S, M: S}, {o: 1C, r: 1H, b: 1S, M: S}, {o: 1D, r: 1H, b: 1S, M: S}]
  seq: "{o} {r} {b}"
  call: "3{M}"
  cond: "{M} >= 4"
  forcing: INV
  meaning: "Fit 4e, invitation"
  meaning_en: "4-card fit, invitation"
  status: infere
- id: "{o}.{r}.{b}.2NT"
  for: [{o: 1C, r: 1D, b: 1H}, {o: 1C, r: 1D, b: 1S}, {o: 1C, r: 1H, b: 1S}, {o: 1D, r: 1H, b: 1S}]
  seq: "{o} {r} {b}"
  call: 2NT
  cond: "11 <= hl <= 12"
  forcing: INV
  meaning: "Invitation à SA"
  meaning_en: "Invitation to NT"
  status: infere
- id: "{o}.{r}.{b}.1NT"
  for: [{o: 1C, r: 1D, b: 1H}, {o: 1C, r: 1D, b: 1S}, {o: 1C, r: 1H, b: 1S}, {o: 1D, r: 1H, b: 1S}]
  seq: "{o} {r} {b}"
  call: 1NT
  cond: "hl <= 10"
  forcing: NF
  meaning: "Minimum"
  meaning_en: "Minimum"
  status: infere
- id: "{o}.{r}.{b}.3NTx"
  for: [{o: 1C, r: 1D, b: 1H}, {o: 1C, r: 1D, b: 1S}, {o: 1C, r: 1H, b: 1S}, {o: 1D, r: 1H, b: 1S}]
  seq: "{o} {r} {b}"
  call: 3NT
  cond: "true"
  forcing: SO
  meaning: "Manche"
  meaning_en: "Game"
  status: infere

# --- 3e enchère du répondant après une redemande limitée de l'ouvreur
# en: responder's third call after a limited rebid by opener
- id: "{o}.{r}.{x}.game"
  for: [{o: "1C|1D", r: 1H, x: 2H, M: H}, {o: "1C|1D", r: 1S, x: 2S, M: S}, {o: 1H, r: 1S, x: 2S, M: S}]
  seq: "{o} {r} {x}"
  call: "4{M}"
  cond: "hld >= 13"
  forcing: SO
  meaning: "Manche"
  meaning_en: "Game"
  status: infere
- id: "{o}.{r}.{x}.inv"
  for: [{o: "1C|1D", r: 1H, x: 2H, M: H}, {o: "1C|1D", r: 1S, x: 2S, M: S}, {o: 1H, r: 1S, x: 2S, M: S}]
  seq: "{o} {r} {x}"
  call: "3{M}"
  cond: "hld >= 11"
  forcing: INV
  meaning: "Invitation"
  meaning_en: "Invitation"
  status: infere
# --- le répondant bicolore majeur 5-5 (a répondu 1♠)
# en: responder with 5-5 in the majors (has responded 1♠)
- id: 1D.1S.2C.3H
  seq: "1D 1S 2C"
  call: 3H
  cond: "H >= 5 and S >= 5 and 9 <= hcp <= 11"
  forcing: INV
  meaning: "Bicolore majeur 5-5, 9-11 H : invitation"
  meaning_en: "5-5 in the majors, 9-11 HCP: invitational"
  status: choix
- id: 1D.1S.2C.3H.4H
  seq: "1D 1S 2C 3H"
  call: 4H
  cond: "H >= 3 and H >= S and hl >= 14"
  forcing: SO
  meaning: "Fit ♥, maximum : manche"
  meaning_en: "Heart fit, maximum: game"
  status: infere
- id: 1D.1S.2C.3H.4S
  seq: "1D 1S 2C 3H"
  call: 4S
  cond: "S >= 3 and hl >= 14"
  forcing: SO
  meaning: "Fit ♠, maximum : manche"
  meaning_en: "Spade fit, maximum: game"
  status: infere
- id: 1D.1S.2C.3H.3S
  seq: "1D 1S 2C 3H"
  call: 3S
  cond: "S > H"
  forcing: NF
  meaning: "Préfère les piques, minimum"
  meaning_en: "Prefers spades, minimum"
  status: infere
- id: 1D.1S.2C.3H.P
  seq: "1D 1S 2C 3H"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Minimum : on joue 3♥"
  meaning_en: "Minimum: play 3♥"
  status: infere
- id: "1{m}.1S.1NT.2H"
  for: [{m: C}, {m: D}]
  seq: "1{m} 1S 1NT"
  call: 2H
  cond: "H >= 5 and S >= 5 and hcp <= 8"
  forcing: NF
  meaning: "Bicolore majeur 5-5 faible : l'ouvreur choisit"
  meaning_en: "Weak 5-5 in the majors: opener picks"
  status: choix
- id: "1{m}.1S.1NT.2H.2S"
  for: [{m: C}, {m: D}]
  seq: "1{m} 1S 1NT 2H"
  call: 2S
  cond: "S > H"
  forcing: NF
  meaning: "Préfère les piques"
  meaning_en: "Prefers spades"
  status: infere
- id: "1{m}.1S.1NT.2H.P"
  for: [{m: C}, {m: D}]
  seq: "1{m} 1S 1NT 2H"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Préfère les cœurs (ou autant)"
  meaning_en: "Prefers hearts (or equal)"
  status: infere
# --- le répondant après le bicolore économique de l'ouvreur (12-17 HL, non forcing)
# en: responder after opener's economical two-suiter (12-17 HL, non-forcing)
- id: "eco.{o}.{r}.{x}.4{rs}"
  for: [{o: "1D", r: "1H", x: "2C", rs: "H"}, {o: "1D", r: "1S", x: "2C", rs: "S"}, {o: "1H", r: "1S", x: "2C", rs: "S"}, {o: "1H", r: "1S", x: "2D", rs: "S"}]
  seq: "{o} {r} {x}"
  call: "4{rs}"
  cond: "{rs} >= 6 and hl >= 12"
  forcing: SO
  meaning: "Majeure 6e, 12+ HL : manche"
  meaning_en: "Six-card major, 12+ HL: game"
  status: infere
- id: "eco.{o}.{r}.{x}.4{os}"
  for: [{o: "1H", r: "1S", x: "2C", os: "H"}, {o: "1H", r: "1S", x: "2D", os: "H"}]
  seq: "{o} {r} {x}"
  call: "4{os}"
  cond: "{os} >= 3 and hld >= 12"
  forcing: SO
  meaning: "Fit dans la majeure d'ouverture, 12+ HLD : manche"
  meaning_en: "Fit in the opening major, 12+ HLD: game"
  status: infere
- id: "eco.{o}.{r}.{x}.3{os}"
  for: [{o: "1H", r: "1S", x: "2C", os: "H"}, {o: "1H", r: "1S", x: "2D", os: "H"}]
  seq: "{o} {r} {x}"
  call: "3{os}"
  cond: "{os} >= 3 and 9 <= hld <= 11"
  forcing: INV
  meaning: "Préférence à saut : 3 cartes, 9-11 HLD, invitation"
  meaning_en: "Jump preference: 3 cards, 9-11 HLD, invitational"
  status: infere
- id: "eco.{o}.{r}.{x}.3{rs}"
  for: [{o: "1D", r: "1H", x: "2C", rs: "H"}, {o: "1D", r: "1S", x: "2C", rs: "S"}, {o: "1H", r: "1S", x: "2C", rs: "S"}, {o: "1H", r: "1S", x: "2D", rs: "S"}]
  seq: "{o} {r} {x}"
  call: "3{rs}"
  cond: "{rs} >= 6 and 9 <= hl <= 11"
  forcing: INV
  meaning: "Majeure 6e, 9-11 HL : invitation"
  meaning_en: "Six-card major, 9-11 HL: invitational"
  status: infere
- id: "eco.{o}.{r}.{x}.3{xs}"
  for: [{o: "1D", r: "1H", x: "2C", xs: "C"}, {o: "1D", r: "1S", x: "2C", xs: "C"}, {o: "1H", r: "1S", x: "2C", xs: "C"}, {o: "1H", r: "1S", x: "2D", xs: "D"}]
  seq: "{o} {r} {x}"
  call: "3{xs}"
  cond: "{xs} >= 4 and 9 <= hld <= 11"
  forcing: INV
  meaning: "Soutien de la seconde couleur, 9-11 HLD : invitation"
  meaning_en: "Raise of the second suit, 9-11 HLD: invitational"
  status: infere
- id: "eco.{o}.{r}.{x}.3{os}.m"
  for: [{o: "1D", r: "1H", x: "2C", os: "D"}, {o: "1D", r: "1S", x: "2C", os: "D"}]
  seq: "{o} {r} {x}"
  call: "3{os}"
  cond: "{os} >= 3 and 9 <= hl <= 11"
  forcing: INV
  meaning: "Préférence à saut : 9-11 HL, invitation"
  meaning_en: "Jump preference: 9-11 HL, invitational"
  status: infere
- id: "eco.{o}.{r}.{x}.2{rs}"
  for: [{o: "1D", r: "1H", x: "2C", rs: "H", xs: "C"}, {o: "1D", r: "1S", x: "2C", rs: "S", xs: "C"}, {o: "1H", r: "1S", x: "2C", rs: "S", xs: "C"}, {o: "1H", r: "1S", x: "2D", rs: "S", xs: "D"}]
  seq: "{o} {r} {x}"
  call: "2{rs}"
  cond: "{rs} >= 6 and {xs} <= 2"
  forcing: NF
  meaning: "Majeure 6e, minimum"
  meaning_en: "Six-card major, minimum"
  status: infere
- id: "eco.{o}.{r}.{x}.pref"
  for: [{o: "1D", r: "1H", x: "2C", os: "D", xs: "C"}, {o: "1D", r: "1S", x: "2C", os: "D", xs: "C"}, {o: "1H", r: "1S", x: "2C", os: "H", xs: "C"}, {o: "1H", r: "1S", x: "2D", os: "H", xs: "D"}]
  seq: "{o} {r} {x}"
  call: "2{os}"
  cond: "{os} >= 2 and {os} > {xs} - 1 and {xs} <= 3"
  forcing: NF
  meaning: "Préférence pour la première couleur"
  meaning_en: "Preference for the first suit"
  status: infere
# --- le répondant de 1SA après la nouvelle couleur de l'ouvreur
# en: the 1NT responder after opener's new suit
- id: "eco.{o}.1NT.{x}.4H"
  for: [{o: "1S", x: "2H", xs: "H"}]
  seq: "{o} 1NT {x}"
  call: 4H
  cond: "H >= 4 and hld >= 11"
  forcing: SO
  meaning: "Fit ♥, 11+ HLD : manche"
  meaning_en: "Heart fit, 11+ HLD: game"
  status: infere
- id: "eco.{o}.1NT.{x}.3{xs}"
  for: [{o: "1H", x: "2C", xs: "C"}, {o: "1H", x: "2D", xs: "D"}, {o: "1S", x: "2C", xs: "C"}, {o: "1S", x: "2D", xs: "D"}, {o: "1S", x: "2H", xs: "H"}]
  seq: "{o} 1NT {x}"
  call: "3{xs}"
  cond: "{xs} >= 4 and 8 <= hld <= 10"
  forcing: INV
  meaning: "Soutien de la seconde couleur : invitation"
  meaning_en: "Raise of the second suit: invitational"
  status: infere
- id: "eco.{o}.1NT.{x}.pref"
  for: [{o: "1H", x: "2C", os: "H", xs: "C"}, {o: "1H", x: "2D", os: "H", xs: "D"}, {o: "1S", x: "2C", os: "S", xs: "C"}, {o: "1S", x: "2D", os: "S", xs: "D"}, {o: "1S", x: "2H", os: "S", xs: "H"}]
  seq: "{o} 1NT {x}"
  call: "2{os}"
  cond: "{os} >= 2 and {xs} <= 2"
  forcing: NF
  meaning: "Préférence pour la majeure d'ouverture"
  meaning_en: "Preference for the opening major"
  status: infere
# --- l'ouvreur répond à l'invitation du répondant
# en: opener answers responder's invitation
- id: "eco.{o}.{r}.{x}.{j}.{g}"
  for: [{o: "1D", r: "1H", x: "2C", j: "3D", g: "3NT", t: "hl >= 17"}, {o: "1D", r: "1H", x: "2C", j: "3H", g: "4H", t: "H >= 2 and hl >= 16"}, {o: "1D", r: "1H", x: "2C", j: "3C", g: "3NT", t: "hl >= 17"}, {o: "1D", r: "1S", x: "2C", j: "3D", g: "3NT", t: "hl >= 17"}, {o: "1D", r: "1S", x: "2C", j: "3S", g: "4S", t: "S >= 2 and hl >= 16"}, {o: "1D", r: "1S", x: "2C", j: "3C", g: "3NT", t: "hl >= 17"}, {o: "1H", r: "1S", x: "2C", j: "3H", g: "4H", t: "hld >= 18"}, {o: "1H", r: "1S", x: "2C", j: "3S", g: "4S", t: "S >= 2 and hl >= 16"}, {o: "1H", r: "1S", x: "2C", j: "3C", g: "3NT", t: "hl >= 17"}, {o: "1H", r: "1S", x: "2D", j: "3H", g: "4H", t: "hld >= 18"}, {o: "1H", r: "1S", x: "2D", j: "3S", g: "4S", t: "S >= 2 and hl >= 16"}, {o: "1H", r: "1S", x: "2D", j: "3D", g: "3NT", t: "hl >= 17"}, {o: "1H", r: "1NT", x: "2C", j: "3C", g: "3NT", t: "hl >= 17"}, {o: "1H", r: "1NT", x: "2D", j: "3D", g: "3NT", t: "hl >= 17"}, {o: "1S", r: "1NT", x: "2C", j: "3C", g: "3NT", t: "hl >= 17"}, {o: "1S", r: "1NT", x: "2D", j: "3D", g: "3NT", t: "hl >= 17"}, {o: "1S", r: "1NT", x: "2H", j: "3H", g: "4H", t: "hl >= 17"}]
  seq: "{o} {r} {x} {j}"
  call: "{g}"
  cond: "{t}"
  forcing: SO
  meaning: "Accepte l'invitation"
  meaning_en: "Accepts the invitation"
  status: infere
- id: "eco.{o}.{r}.{x}.{j}.P"
  for: [{o: "1D", r: "1H", x: "2C", j: "3D"}, {o: "1D", r: "1H", x: "2C", j: "3H"}, {o: "1D", r: "1H", x: "2C", j: "3C"}, {o: "1D", r: "1S", x: "2C", j: "3D"}, {o: "1D", r: "1S", x: "2C", j: "3S"}, {o: "1D", r: "1S", x: "2C", j: "3C"}, {o: "1H", r: "1S", x: "2C", j: "3H"}, {o: "1H", r: "1S", x: "2C", j: "3S"}, {o: "1H", r: "1S", x: "2C", j: "3C"}, {o: "1H", r: "1S", x: "2D", j: "3H"}, {o: "1H", r: "1S", x: "2D", j: "3S"}, {o: "1H", r: "1S", x: "2D", j: "3D"}, {o: "1H", r: "1NT", x: "2C", j: "3C"}, {o: "1H", r: "1NT", x: "2D", j: "3D"}, {o: "1S", r: "1NT", x: "2C", j: "3C"}, {o: "1S", r: "1NT", x: "2D", j: "3D"}, {o: "1S", r: "1NT", x: "2H", j: "3H"}]
  seq: "{o} {r} {x} {j}"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Refuse l'invitation"
  meaning_en: "Declines the invitation"
  status: infere
- id: "gen.lim.6NT"
  seq: "1C|1D|1H|1S 1D|1H|1S|1NT 1NT|2C|2D|2H|2S"
  call: 6NT
  cond: "hl >= 19 and (balanced or semibalanced)"
  forcing: SO
  meaning: "19+ HL face à une redemande minimum : petit chelem à SA"
  meaning_en: "19+ HL opposite a minimum rebid: small slam in NT"
  status: infere
- id: "gen.lim.3NT"
  seq: "1C|1D|1H|1S 1D|1H|1S|1NT 1NT|2C|2D|2H|2S"
  call: 3NT
  cond: "hl >= 12 and (balanced or semibalanced)"
  forcing: SO
  meaning: "Manche à SA"
  meaning_en: "Game in NT"
  status: infere
- id: "gen.lim.2NT"
  seq: "1C|1D|1H|1S 1D|1H|1S 1NT|2C|2D|2H|2S"
  call: 2NT
  cond: "11 <= hl <= 12 and (balanced or semibalanced)"
  forcing: INV
  meaning: "Invitation à SA"
  meaning_en: "Invitation to NT"
  status: infere
- id: "gen.lim.game"
  seq: "1C|1D 1H|1S 1NT|2C|2D"
  call: 3NT
  cond: "hl >= 13"
  forcing: SO
  meaning: "Manche"
  meaning_en: "Game"
  status: infere
- id: "gen.lim.pass"
  seq: "1C|1D|1H|1S 1D|1H|1S|1NT 1NT|2C|2D|2H|2S"
  call: P
  cond: "true"
  forcing: NF
  meaning: "Minimum : passe"
  meaning_en: "Minimum: pass"
  status: infere

# --- 2♦ fort : l'ouvreur conclut après la réponse en As (simplifié)
# en: strong 2♦: opener concludes after the ace-showing response (simplified)
# --- 2♦ fort : chelem d'après le nombre d'As montré par la réponse
# en: strong 2♦: slam from the number of aces shown by the response
- id: "2D.{g}.{t}.7"
  for: [{t: S, g: 2as, r: "3H|3S|3NT", a: 2, n: 2, p: 10}, {t: S, g: 3as, r: "4C|4D|4H|4S", a: 3, n: 1, p: 9}, {t: S, g: 4as, r: "4NT", a: 4, n: 0, p: 8}, {t: H, g: 2as, r: "3H|3S|3NT", a: 2, n: 2, p: 10}, {t: H, g: 3as, r: "4C|4D|4H|4S", a: 3, n: 1, p: 9}, {t: H, g: 4as, r: "4NT", a: 4, n: 0, p: 8}, {t: D, g: 2as, r: "3H|3S|3NT", a: 2, n: 2, p: 10}, {t: D, g: 3as, r: "4C|4D|4H|4S", a: 3, n: 1, p: 9}, {t: D, g: 4as, r: "4NT", a: 4, n: 0, p: 8}, {t: C, g: 2as, r: "3H|3S|3NT", a: 2, n: 2, p: 10}, {t: C, g: 3as, r: "4C|4D|4H|4S", a: 3, n: 1, p: 9}, {t: C, g: 4as, r: "4NT", a: 4, n: 0, p: 8}]
  seq: "2D {r}"
  call: "7{t}"
  cond: "{t} >= 5 and {t} >= max(S, H, D, C) and aces == {n} and ptricks >= {p}"
  forcing: SO
  meaning: "Les 4 As et 13 levées comptées : grand chelem"
  meaning_en: "All four aces and 13 tricks counted: grand slam"
  status: infere
- id: "2D.{g}.{t}.6"
  for: [{t: S, g: 0as, r: "2H|2NT", n: 3, p: 10}, {t: S, g: 1as, r: "2S|3C|3D", n: 2, p: 9}, {t: S, g: 2as, r: "3H|3S|3NT", n: 1, p: 8}, {t: S, g: 3as, r: "4C|4D|4H|4S", n: 0, p: 7}, {t: S, g: 4as, r: "4NT", n: 0, p: 6}, {t: H, g: 0as, r: "2H|2NT", n: 3, p: 10}, {t: H, g: 1as, r: "2S|3C|3D", n: 2, p: 9}, {t: H, g: 2as, r: "3H|3S|3NT", n: 1, p: 8}, {t: H, g: 3as, r: "4C|4D|4H|4S", n: 0, p: 7}, {t: H, g: 4as, r: "4NT", n: 0, p: 6}, {t: D, g: 0as, r: "2H|2NT", n: 3, p: 10}, {t: D, g: 1as, r: "2S|3C|3D", n: 2, p: 9}, {t: D, g: 2as, r: "3H|3S|3NT", n: 1, p: 8}, {t: D, g: 3as, r: "4C|4D|4H|4S", n: 0, p: 7}, {t: D, g: 4as, r: "4NT", n: 0, p: 6}, {t: C, g: 0as, r: "2H|2NT", n: 3, p: 10}, {t: C, g: 1as, r: "2S|3C|3D", n: 2, p: 9}, {t: C, g: 2as, r: "3H|3S|3NT", n: 1, p: 8}, {t: C, g: 3as, r: "4C|4D|4H|4S", n: 0, p: 7}, {t: C, g: 4as, r: "4NT", n: 0, p: 6}]
  seq: "2D {r}"
  call: "6{t}"
  cond: "{t} >= 5 and {t} >= max(S, H, D, C) and aces >= {n} and ptricks >= {p}"
  forcing: SO
  meaning: "Au plus un As manque et 12 levées comptées : petit chelem"
  meaning_en: "At most one ace missing and 12 tricks counted: small slam"
  status: infere
- id: "2D.{g}.7NT"
  for: [{g: 2as, r: "3H|3S|3NT", n: 2, h: 26}, {g: 3as, r: "4C|4D|4H|4S", n: 1, h: 22}, {g: 4as, r: "4NT", n: 0, h: 18}]
  seq: "2D {r}"
  call: 7NT
  cond: "balanced and aces == {n} and hcp >= {h}"
  forcing: SO
  meaning: "Régulier, les 4 As et 37 H à deux : grand chelem à SA"
  meaning_en: "Balanced, all four aces and 37 HCP together: grand slam in NT"
  status: infere
- id: "2D.{g}.6NT"
  for: [{g: 0as, r: "2H|2NT", n: 3, h: 25}, {g: 1as, r: "2S|3C|3D", n: 2, h: 26}, {g: 2as, r: "3H|3S|3NT", n: 1, h: 22}, {g: 3as, r: "4C|4D|4H|4S", n: 0, h: 18}, {g: 4as, r: "4NT", n: 0, h: 14}]
  seq: "2D {r}"
  call: 6NT
  cond: "balanced and aces >= {n} and hcp >= {h}"
  forcing: SO
  meaning: "Régulier, au plus un As manque et 33 H à deux : petit chelem à SA"
  meaning_en: "Balanced, at most one ace missing and 33 HCP together: small slam in NT"
  status: infere
- id: 2D.x.3NT
  seq: "2D 2H|2S|2NT|3C|3D"
  call: 3NT
  cond: "balanced or (semibalanced and max(S, H) <= 4)"
  forcing: NF
  meaning: "Régulier, ou 5422 / 6322 par une mineure : 3SA"
  meaning_en: "Balanced, or 5422 / 6322 with a long minor: 3NT"
  status: infere
- id: "2D.x.4{M}"
  for: [{M: S}, {M: H}]
  seq: "2D 2H|2S|2NT|3C|3D|3H|3S|3NT"
  call: "4{M}"
  cond: "{M} >= 5 and {M} >= max(S, H, D, C)"
  forcing: SO
  meaning: "Manche dans la couleur longue"
  meaning_en: "Game in the long suit"
  status: infere
- id: "2D.x.5{m}"
  for: [{m: D}, {m: C}]
  seq: "2D 2H|2S|2NT|3C|3D|3H|3S|3NT"
  call: "5{m}"
  cond: "{m} >= 5"
  forcing: SO
  meaning: "Manche dans la mineure"
  meaning_en: "Game in the minor"
  status: infere
- id: 2D.x.3NTb
  seq: "2D 2H|2S|2NT|3C|3D"
  call: 3NT
  cond: "true"
  forcing: NF
  meaning: "3SA"
  meaning_en: "3NT"
  status: infere
- id: 2D.x.4NT.pass
  seq: "2D 3H|3S|3NT|4C|4D|4H|4S|4NT"
  call: P
  cond: "false"
  forcing: NF
  meaning: "(emplacement réservé)"
  meaning_en: "(placeholder)"
  status: infere

