# SEF 2024 — règles d'enchères
# SOURCE UNIQUE DES RÈGLES : c'est ce fichier que l'on modifie.
# Sémantique (séquences, conditions, algorithme) : SEF_2024_spec.md. Description bridge : SEF_2024.md.
# Liste ordonnée : la première règle applicable donne l'enchère.
# Les règles avec « for » sont des modèles, expansés par sef_rules.py.
# Après modification, depuis la racine du dépôt : ./update-system.sh sef (.\update-system.ps1 sef sous Windows).
# Il valide ce fichier, régénère ses données de test et ses PDF, puis lance les tests.

# ======================================================================
# A.4 Ouvertures
# ======================================================================
# en: A.4 Openings
# Ordre = priorité : on vérifie d'abord les ouvertures fortes, puis 1SA, les ouvertures au palier de 1, enfin les barrages.
# en: Order = priority: strong openings are checked first, then 1NT, the one-level openings, and finally the preempts.
- id: open.2D
  seq: ""
  call: 2D
  cond: "(balanced and hcp >= 24) or (hcp >= 16 and ptricks >= 8 and sidetricks >= 2)"
  forcing: FM
  meaning: "Fort, forcing de manche : 8 levées de jeu et 2 levées de défense annexes (ou régulier 24+ H)"
  meaning_en: "Strong, game-forcing: 8 playing tricks and 2 side defensive tricks (or balanced 24+ HCP)"
  status: choix
  alert: true
- id: open.2C
  seq: ""
  call: 2C
  cond: "(balanced and 22 <= hl <= 23) or (max(S, H) >= 5 and 18 <= hl <= 21 and ptricks >= 7) or (max(C, D) >= 7 and 15 <= hcp <= 16 and ptricks >= 7.5)"
  forcing: F1
  meaning: "Fort indéterminé : 5/6 cartes majeures 18-21 HL, ou 7 cartes mineures, ou 22-23 HL régulier"
  meaning_en: "Strong, undefined: 5/6-card major 18-21 HL, or 7-card minor, or balanced 22-23 HL"
  status: sef
  alert: true
- id: open.2NT
  seq: ""
  call: 2NT
  cond: "20 <= hl <= 21 and (balanced or shape == '5422' or (shape == '6322' and max(C, D) == 6))"
  forcing: NF
  meaning: "20-21 HL, régulier (5M, 5422 ou 6322 avec 6 cartes mineures possibles)"
  meaning_en: "20-21 HL, balanced (5-card major, 5422 or 6322 with a 6-card minor possible)"
  status: choix
- id: open.1NT
  seq: ""
  call: 1NT
  cond: "15 <= hl <= 17 and balanced and not (shape == '5332' and max(S, H) == 5 and hcp == 17)"
  forcing: NF
  meaning: "15-17 HL régulier ; 5332 avec majeure 5e : 15-16 H"
  meaning_en: "15-17 HL balanced; 5332 with 5-card major: 15-16 HCP"
  status: sef
- id: open.3NT
  seq: ""
  call: 3NT
  cond: "(C >= 7 and solid('C') and hcp - hcp_in('C') <= 3) or (D >= 7 and solid('D') and hcp - hcp_in('D') <= 3)"
  forcing: NF
  meaning: "Mineure 7e affranchie et rien à côté"
  meaning_en: "Solid 7-card minor and nothing outside"
  status: sef
  alert: true
- id: open.1S
  seq: ""
  call: 1S
  cond: "S >= 5 and S >= H and hcp >= 12"
  forcing: NF
  meaning: "5+ piques, 12+ H (5-5 majeur : 1♠)"
  meaning_en: "5+ spades, 12+ HCP (5-5 in the majors: 1♠)"
  status: sef
- id: open.1H
  seq: ""
  call: 1H
  cond: "H >= 5 and hcp >= 12"
  forcing: NF
  meaning: "5+ cœurs, 12+ H"
  meaning_en: "5+ hearts, 12+ HCP"
  status: sef
- id: open.1D
  seq: ""
  call: 1D
  cond: "hcp >= 12 and D >= 3 and (D > C or (D == C and D >= 4))"
  forcing: NF
  meaning: "Mineure la plus longue (4-4 : 1♦)"
  meaning_en: "Longest minor (4-4: 1♦)"
  status: sef
- id: open.1C
  seq: ""
  call: 1C
  cond: "hcp >= 12"
  forcing: NF
  meaning: "Mineure la plus longue (3-3 : 1♣)"
  meaning_en: "Longest minor (3-3: 1♣)"
  status: sef
- id: "open.4e.{c}"
  for: [{c: 1S, x: "S >= 5 and S >= H"}, {c: 1H, x: "H >= 5"}, {c: 1D, x: "D >= 3 and (D > C or (D == C and D >= 4))"}, {c: 1C, x: "true"}]
  seq: ""
  call: "{c}"
  cond: "seat == 4 and 10 <= hcp <= 11 and hcp + S >= 15 and ({x})"
  forcing: NF
  meaning: "4e position, 10-11 H : règle des 15 (H + nombre de piques ≥ 15)"
  meaning_en: "Fourth seat, 10-11 HCP: rule of 15 (HCP + number of spades ≥ 15)"
  status: choix
- id: open.4NT
  seq: ""
  call: 4NT
  cond: "C >= 5 and D >= 5 and C + D >= 11 and losers <= 4"
  forcing: F1
  meaning: "Bicolore mineur 6/5+ et 4 perdantes"
  meaning_en: "6/5+ minor two-suiter and 4 losers"
  status: sef
  alert: true
- id: "open.5{m}"
  for: [{m: C}, {m: D}]
  seq: ""
  call: "5{m}"
  cond: "hcp <= 11 and ({m} >= 9 or ({m} >= 8 and C >= 4 and D >= 4))"
  forcing: NF
  meaning: "Barrage : 9 cartes, ou 8/4 en mineures"
  meaning_en: "Preempt: 9 cards, or 8/4 in the minors"
  status: sef
- id: "open.4{X}"
  for: [{X: S}, {X: H}, {X: D}, {X: C}]
  seq: ""
  call: "4{X}"
  cond: "hcp <= 11 and (({X} >= 8 and top('{X}') >= 2) or (not vul and {X} == 7 and shape in ('7411', '7420')))"
  forcing: NF
  meaning: "Barrage : 8 cartes dont 2 gros honneurs, ou main 7/4 (non vulnérable)"
  meaning_en: "Preempt: 8 cards including 2 high honors, or 7/4 hand (not vulnerable)"
  status: choix
- id: "open.3{X}"
  for: [{X: S}, {X: H}, {X: D}, {X: C}]
  seq: ""
  call: "3{X}"
  cond: "hcp <= 10 and {X} == 7 and ((vul and top('{X}') >= 2) or (not vul and top('{X}') >= 1))"
  forcing: NF
  meaning: "Barrage : 7 cartes, 10 H max ; non vulnérable, 1 gros honneur ; vulnérable, 2 gros honneurs"
  meaning_en: "Preempt: 7-card suit, 10 HCP max; not vulnerable, 1 high honor; vulnerable, 2 high honors"
  status: choix
- id: "open.2{M}"
  for: [{M: S}, {M: H}]
  seq: ""
  call: "2{M}"
  cond: "{M} == 6 and ((vul and 7 <= hcp <= 10 and top('{M}') >= 2) or (not vul and opp_vul and 5 <= hcp <= 10) or (not vul and not opp_vul and 6 <= hcp <= 10))"
  forcing: NF
  meaning: "2 faible : 6 cartes, 6-10 H (vulnérable : 7-10 H et 2 gros honneurs ; vulnérabilité favorable : 5-10 H)"
  meaning_en: "Weak two: 6 cards, 6-10 HCP (vulnerable: 7-10 HCP and 2 high honors; favorable vulnerability: 5-10 HCP)"
  status: choix
- id: open.pass
  seq: ""
  call: P
  cond: "true"
  forcing: NF
  meaning: "Pas d'ouverture"
  meaning_en: "No opening"
  status: sef

# ======================================================================
# A.5 Ouverture de 1SA
# ======================================================================
# en: A.5 1NT opening
# Sur 1SA contré, le camp de l'ouvreur ignore le contre (SEF : « 2♣ = Stayman, etc. ») : chaque motif porte aussi sa variante « 1NT (X) … ».
# en: Over a doubled 1NT, the opening side ignores the double (SEF: “2♣ = Stayman, etc.”): each pattern also carries its “1NT (X) …” variant.
# Réponses
# en: Responses
- id: 1NT.r.5NT
  seq: ["1NT", "1NT (X)"]
  call: 5NT
  cond: "17 <= hl <= 19 and S < 4 and H < 4"
  forcing: F1
  meaning: "17-19 HL : l'ouvreur dit 6SA (ou repart en Baron)"
  meaning_en: "17-19 HL: opener bids 6NT (or continues with Baron)"
  status: sef
- id: 1NT.r.4NT
  seq: ["1NT", "1NT (X)"]
  call: 4NT
  cond: "hl == 16 and S < 4 and H < 4"
  forcing: INV
  meaning: "Quantitatif 16 HL : proposition de petit chelem"
  meaning_en: "Quantitative 16 HL: invitation to small slam"
  status: choix
- id: 1NT.r.4D
  seq: ["1NT", "1NT (X)"]
  call: 4D
  cond: "H >= 5 and S >= 5 and 9 <= hcp <= 12"
  forcing: REL
  meaning: "Bicolore ♥/♠ 5-5, 9-12 H : l'ouvreur choisit la majeure"
  meaning_en: "5-5 in hearts/spades, 9-12 HCP: opener chooses the major"
  status: sef
  alert: true
- id: "1NT.r.3{M}.slam"
  for: [{M: S}, {M: H}, {M: D}]
  seq: ["1NT", "1NT (X)"]
  call: "3{M}"
  cond: "{M} >= 6 and hl >= 16"
  forcing: FM
  meaning: "Espoir de chelem dans la couleur (6+ cartes)"
  meaning_en: "Slam interest in the suit (6+ cards)"
  status: sef
- id: "1NT.r.4{M}"
  for: [{M: S}, {M: H}]
  seq: ["1NT", "1NT (X)"]
  call: "4{M}"
  cond: "{M} >= 6 and {M} >= max(S, H) and 8 <= hl <= 16"
  forcing: SO
  meaning: "Naturel, 6+ cartes, pour jouer"
  meaning_en: "Natural, 6+ cards, to play"
  status: sef
- id: 1NT.r.2D.55weak
  seq: ["1NT", "1NT (X)"]
  call: 2D
  cond: "H == 5 and S == 5 and 6 <= hl <= 7"
  forcing: REL
  meaning: "Texas ♥ (suivi de 2♠ : 5-5 majeur 6-7 H)"
  meaning_en: "Texas ♥ (followed by 2♠: 5-5 majors, 6-7 HCP)"
  status: sef
  alert: true
- id: 1NT.r.2C.54
  seq: ["1NT", "1NT (X)"]
  call: 2C
  cond: "max(H, S) == 5 and min(H, S) == 4 and hl >= 6"
  forcing: F1
  meaning: "Stayman (5-4 majeur, 6+ H)"
  meaning_en: "Stayman (5-4 in the majors, 6+ HCP)"
  status: sef
  alert: true
- id: 1NT.r.2C.misere
  seq: ["1NT", "1NT (X)"]
  call: 2C
  cond: "max(H, S) == 5 and 6 <= hl <= 8 and min(S, H, D, C) <= 1"
  forcing: F1
  meaning: "Stayman « misère dorée » : majeure 5e et singleton, 6-8 HL"
  meaning_en: "Golden Misery Stayman: 5-card major and singleton, 6-8 HL"
  status: sef
  alert: true
- id: 1NT.r.2C
  seq: ["1NT", "1NT (X)"]
  call: 2C
  cond: "(H == 4 or S == 4) and max(H, S) < 5 and hl >= 7 and not (shape == '4333' and hcp < 12)"
  forcing: F1
  meaning: "Stayman 4 réponses : majeure 4e, 7+ H (4333 : 12+ H)"
  meaning_en: "4-response Stayman: 4-card major, 7+ HCP (4333: 12+ HCP)"
  status: sef
  alert: true
- id: 1NT.r.2H
  seq: ["1NT", "1NT (X)"]
  call: 2H
  cond: "S >= 5 and S >= H"
  forcing: REL
  meaning: "Texas ♠ : 5+ piques"
  meaning_en: "Texas ♠: 5+ spades"
  status: sef
  alert: true
- id: 1NT.r.2D
  seq: ["1NT", "1NT (X)"]
  call: 2D
  cond: "H >= 5"
  forcing: REL
  meaning: "Texas ♥ : 5+ cœurs"
  meaning_en: "Texas ♥: 5+ hearts"
  status: sef
  alert: true
- id: 1NT.r.2S.minors
  seq: ["1NT", "1NT (X)"]
  call: 2S
  cond: "C >= 5 and D >= 5 and hl >= 8"
  forcing: REL
  meaning: "Texas ♣ (bicolore mineur 5/5 de manche : ♦ annoncés ensuite)"
  meaning_en: "Texas ♣ (game-going 5/5 minor two-suiter: diamonds bid next)"
  status: sef
  alert: true
- id: 1NT.r.2S
  seq: ["1NT", "1NT (X)"]
  call: 2S
  cond: "C >= 6 and C >= D and (hl < 8 or (hl >= 11 and min(S, H, D) <= 1))"
  forcing: REL
  meaning: "Texas ♣ : 6+ trèfles, faible ou avec courte (ambition)"
  meaning_en: "Texas ♣: 6+ clubs, weak or with shortness (ambitious)"
  status: sef
  alert: true
- id: 1NT.r.3C
  seq: ["1NT", "1NT (X)"]
  call: 3C
  cond: "D >= 6 and (hl < 8 or (hl >= 11 and min(S, H, C) <= 1))"
  forcing: REL
  meaning: "Texas ♦ : 6+ carreaux, faible ou avec courte (ambition)"
  meaning_en: "Texas ♦: 6+ diamonds, weak or with shortness (ambitious)"
  status: sef
  alert: true
- id: 1NT.r.2NT
  seq: ["1NT", "1NT (X)"]
  call: 2NT
  cond: "hl == 7"
  forcing: INV
  meaning: "7 H, proposition de manche"
  meaning_en: "7 HCP, game invitation"
  status: sef
- id: 1NT.r.3NT
  seq: ["1NT", "1NT (X)"]
  call: 3NT
  cond: "8 <= hl <= 16"
  forcing: SO
  meaning: "8-16 HL, pour jouer"
  meaning_en: "8-16 HL, to play"
  status: sef
- id: 1NT.r.6NT
  seq: ["1NT", "1NT (X)"]
  call: 6NT
  cond: "hl >= 19"
  forcing: SO
  meaning: "19+ HL : petit chelem direct"
  meaning_en: "19+ HL: direct small slam"
  status: infere
- id: 1NT.r.pass
  seq: ["1NT", "1NT (X)"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "Moins de 8 H, sans couleur à montrer"
  meaning_en: "Fewer than 8 HCP, no suit to show"
  status: sef
# Redemandes de l'ouvreur
# en: Opener's rebids
- id: 1NT.2C.2NT
  seq: ["1NT 2C", "1NT (X) 2C"]
  call: 2NT
  cond: "H >= 4 and S >= 4"
  forcing: F1
  meaning: "Stayman : 4 cartes à ♥ ET à ♠"
  meaning_en: "Stayman: 4 cards in both hearts AND spades"
  status: sef
  alert: true
- id: 1NT.2C.2H
  seq: ["1NT 2C", "1NT (X) 2C"]
  call: 2H
  cond: "H >= 4"
  forcing: NF
  meaning: "Stayman : 4 cœurs"
  meaning_en: "Stayman: 4 hearts"
  status: sef
- id: 1NT.2C.2S
  seq: ["1NT 2C", "1NT (X) 2C"]
  call: 2S
  cond: "S >= 4"
  forcing: NF
  meaning: "Stayman : 4 piques"
  meaning_en: "Stayman: 4 spades"
  status: sef
- id: 1NT.2C.2D
  seq: ["1NT 2C", "1NT (X) 2C"]
  call: 2D
  cond: "true"
  forcing: NF
  meaning: "Stayman : pas de majeure 4e"
  meaning_en: "Stayman: no 4-card major"
  status: sef
  alert: true
- id: "1NT.tex.{M}.super"
  for: [{T: 2D, M: H}, {T: 2H, M: S}]
  seq: ["1NT {T}", "1NT (X) {T}"]
  call: "3{M}"
  cond: "{M} >= 4 and hl >= 16"
  forcing: INV
  meaning: "Rectification à saut : maximum avec 4 atouts"
  meaning_en: "Jump correction: maximum with 4-card support"
  status: sef
- id: "1NT.tex.{M}"
  for: [{T: 2D, M: H}, {T: 2H, M: S}]
  seq: ["1NT {T}", "1NT (X) {T}"]
  call: "2{M}"
  cond: "true"
  forcing: NF
  meaning: "Rectifie le Texas"
  meaning_en: "Corrects the Texas transfer"
  status: sef
- id: 1NT.2S.3C
  seq: ["1NT 2S", "1NT (X) 2S"]
  call: 3C
  cond: "true"
  forcing: NF
  meaning: "Rectifie le Texas ♣ (la fiche mentionne une modulation avec gros honneur 3e, non détaillée)"
  meaning_en: "Corrects the Texas ♣ (the card mentions a variation with a 3-card high honor, not detailed)"
  status: sef
- id: 1NT.3C.3D
  seq: ["1NT 3C", "1NT (X) 3C"]
  call: 3D
  cond: "true"
  forcing: NF
  meaning: "Rectifie le Texas ♦"
  meaning_en: "Corrects the Texas ♦"
  status: sef
- id: 1NT.4D.4H
  seq: ["1NT 4D", "1NT (X) 4D"]
  call: 4H
  cond: "H >= S"
  forcing: SO
  meaning: "Choisit ♥"
  meaning_en: "Chooses ♥"
  status: sef
- id: 1NT.4D.4S
  seq: ["1NT 4D", "1NT (X) 4D"]
  call: 4S
  cond: "true"
  forcing: SO
  meaning: "Choisit ♠"
  meaning_en: "Chooses ♠"
  status: sef
- id: 1NT.2NT.3NT
  seq: ["1NT 2NT", "1NT (X) 2NT"]
  call: 3NT
  cond: "hl >= 16"
  forcing: SO
  meaning: "Accepte l'invitation"
  meaning_en: "Accepts the invitation"
  status: sef
- id: 1NT.4NT.6NT
  seq: ["1NT 4NT", "1NT (X) 4NT"]
  call: 6NT
  cond: "hl >= 15"
  forcing: SO
  meaning: "15-17 HL : accepte le petit chelem"
  meaning_en: "15-17 HL: accepts the small-slam invitation"
  status: choix
- id: 1NT.5NT.6NT
  seq: ["1NT 5NT", "1NT (X) 5NT"]
  call: 6NT
  cond: "true"
  forcing: SO
  meaning: "Dit 6SA (la fiche autorise aussi un Baron)"
  meaning_en: "Bids 6NT (the card also allows a Baron)"
  status: sef
- id: 1NT.inv.pass
  seq: ["1NT 2NT|4NT|3NT|4H|4S", "1NT (X) 2NT|4NT|3NT|4H|4S"]
  call: P
  cond: "true"
  forcing: NF
  meaning: "Minimum / contrat terminal"
  meaning_en: "Minimum / final contract"
  status: sef
# Suites du répondant après Stayman
# en: Responder's continuations after Stayman
- id: "1NT.2C.2D.2{M}"
  for: [{M: H, oM: S}, {M: S, oM: H}]
  seq: ["1NT 2C 2D", "1NT (X) 2C 2D"]
  call: "2{M}"
  cond: "{M} == 5 and {oM} == 4 and hl <= 7"
  forcing: NF
  meaning: "5-4 majeur 6-7 H (ou misère dorée) : pour jouer"
  meaning_en: "5-4 in the majors, 6-7 HCP (or Golden Misery): to play"
  status: sef
- id: 1NT.2C.2D.2M.misere
  seq: ["1NT 2C 2D", "1NT (X) 2C 2D"]
  call: 2H
  cond: "H == 5 and hl <= 7"
  forcing: NF
  meaning: "Misère dorée : pour jouer 2♥"
  meaning_en: "Golden Misery: to play 2♥"
  status: sef
- id: 1NT.2C.2D.2S.misere
  seq: ["1NT 2C 2D", "1NT (X) 2C 2D"]
  call: 2S
  cond: "S == 5 and hl <= 7"
  forcing: NF
  meaning: "Misère dorée : pour jouer 2♠"
  meaning_en: "Golden Misery: to play 2♠"
  status: sef
- id: "1NT.2C.2D.cc{call}"
  for: [{call: 3H, M: S, oM: H}, {call: 3S, M: H, oM: S}]
  seq: ["1NT 2C 2D", "1NT (X) 2C 2D"]
  call: "{call}"
  cond: "{M} == 5 and {oM} == 4 and hl >= 8"
  forcing: FM
  meaning: "Chassé-croisé : 5 cartes dans l'autre majeure, 4 dans celle-ci, 8+ H"
  meaning_en: "Crisscross: 5 cards in the other major, 4 in this one, 8+ HCP"
  status: sef
  alert: true
- id: "1NT.2C.2{M}.splinter{s}"
  for: [{M: H, s: C}, {M: H, s: D}, {M: S, s: C}, {M: S, s: D}]
  seq: ["1NT 2C 2{M}", "1NT (X) 2C 2{M}"]
  call: "4{s}"
  cond: "{M} >= 4 and 12 <= hld <= 14 and short('{s}')"
  forcing: FM
  meaning: "Splinter fitté, 12-14 HLD, courte à la couleur"
  meaning_en: "Fit splinter, 12-14 HLD, shortness in the suit"
  status: sef
  alert: true
- id: "1NT.2C.2{M}.slam"
  for: [{M: H, x: 3S}, {M: S, x: 3H}]
  seq: ["1NT 2C 2{M}", "1NT (X) 2C 2{M}"]
  call: "{x}"
  cond: "{M} >= 4 and hl >= 14"
  forcing: FM
  meaning: "Fit dans la majeure de l'ouvreur, espoir de chelem"
  meaning_en: "Fit in opener's major, slam interest"
  status: sef
  alert: true
- id: "1NT.2C.2{M}.game"
  for: [{M: H}, {M: S}]
  seq: ["1NT 2C 2{M}", "1NT (X) 2C 2{M}"]
  call: "4{M}"
  cond: "{M} >= 4 and hl >= 8"
  forcing: SO
  meaning: "Fit, manche"
  meaning_en: "Fit, game"
  status: sef
- id: "1NT.2C.2{M}.inv"
  for: [{M: H}, {M: S}]
  seq: ["1NT 2C 2{M}", "1NT (X) 2C 2{M}"]
  call: "3{M}"
  cond: "{M} >= 4 and hl == 7"
  forcing: INV
  meaning: "Fit, invitation"
  meaning_en: "Fit, invitation"
  status: infere
- id: "1NT.2C.2{M}.misere"
  for: [{M: H}, {M: S}]
  seq: ["1NT 2C 2{M}", "1NT (X) 2C 2{M}"]
  call: P
  cond: "{M} >= 4 and hl <= 7"
  forcing: NF
  meaning: "Misère dorée : pour jouer"
  meaning_en: "Golden Misery: to play"
  status: sef
- id: 1NT.2C.x.4NT
  seq: ["1NT 2C 2D|2H|2S", "1NT (X) 2C 2D|2H|2S"]
  call: 4NT
  cond: "hl == 16"
  forcing: INV
  meaning: "Quantitatif (pas de fit)"
  meaning_en: "Quantitative (no fit)"
  status: sef
- id: 1NT.2C.x.2NT
  seq: ["1NT 2C 2D|2H|2S", "1NT (X) 2C 2D|2H|2S"]
  call: 2NT
  cond: "hl <= 8"
  forcing: INV
  meaning: "Invitation sans fit"
  meaning_en: "Invitation without a fit"
  status: sef
- id: 1NT.2C.x.6NT
  seq: ["1NT 2C 2D|2H|2S", "1NT (X) 2C 2D|2H|2S"]
  call: 6NT
  cond: "hl >= 17"
  forcing: SO
  meaning: "Pas de fit, 17+ HL : petit chelem à SA"
  meaning_en: "No fit, 17+ HL: small slam in NT"
  status: infere
- id: 1NT.2C.x.3NT
  seq: ["1NT 2C 2D|2H|2S", "1NT (X) 2C 2D|2H|2S"]
  call: 3NT
  cond: "true"
  forcing: SO
  meaning: "Manche sans fit"
  meaning_en: "Game without a fit"
  status: sef
- id: 1NT.2C.2NT.slamS
  seq: ["1NT 2C 2NT", "1NT (X) 2C 2NT"]
  call: 3S
  cond: "S >= 4 and H < 4 and hl >= 14"
