  meaning_en: "King in the suit (economical order)"
  status: sef
- id: "bwk.{t}.6"
  for: [{t: S}, {t: H}, {t: D}, {t: C}]
  seq: "BW:{t} 4NT * 5NT"
  call: "6{t}"
  cond: "true"
  forcing: SO
  meaning: "Pas de Roi à montrer : petit chelem"
  meaning_en: "No king to show: small slam"
  status: sef
- id: "bwk.{t}.after"
  for: [{t: S, k: "6C|6D|6H"}, {t: H, k: "6C|6D"}, {t: D, k: "6C"}]
  seq: "BW:{t} 4NT * 5NT {k}"
  call: "7{t}"
  cond: "ptricks >= 9"
  forcing: SO
  meaning: "Le Roi montré suffit : grand chelem"
  meaning_en: "The king shown is enough: grand slam"
  status: infere
- id: "bwk.{t}.after6"
