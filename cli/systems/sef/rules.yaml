# --- répondant après 1♣/♦ – 1♥/♠ – 4♥/♠ (18+ HLD fitté)
# en: responder after 1♣/♦ – 1♥/♠ – 4♥/♠ (18+ HLD with a fit)
- id: "1{m}.1{M}.4{M}.bw"
  for: [{m: C, M: H}, {m: C, M: S}, {m: D, M: H}, {m: D, M: S}]
  seq: "1{m} 1{M} 4{M}"
  call: 4NT
  cond: "hl >= 12"
  forcing: ASK
  meaning: "Ouvreur 18+ fitté, 12+ HL : Blackwood"
  meaning_en: "Opener 18+ with a fit, 12+ HL: Blackwood"
  status: infere
  alert: true
  trump: "{M}"

# --- répondant après 1M – 2m – 2x (2 sur 1)
# en: responder after 1M – 2m – 2x (two over one)
- id: "{o}.2{m}.x.bw"
  for: [{o: 1H, M: H, m: C}, {o: 1H, M: H, m: D}, {o: 1S, M: S, m: C}, {o: 1S, M: S, m: D}]
  seq: "{o} 2{m} 2{M}|2H|3{m}"
  call: 4NT
  cond: "{M} >= 3 and hld >= 16"
  forcing: ASK
  meaning: "Fit et 16+ HLD : Blackwood"
  meaning_en: "Fit and 16+ HLD: Blackwood"
  status: infere
  alert: true
  trump: "{M}"
# 1♠ – 2m – 2♥ : avec 4 cœurs, le répondant soutient la 2e couleur de l'ouvreur (fit 4-4 ou mieux) plutôt que de dire SA.
# en: 1♠ – 2m – 2♥: with four hearts, responder raises opener's second suit (a 4-4 fit or better) rather than bidding NT.
- id: "1S.2{m}.2H.4H"
  for: [{m: C}, {m: D}]
  seq: "1S 2{m} 2H"
  call: 4H
  cond: "H >= 4 and hld >= 13"
  forcing: SO
  meaning: "Fit 4e dans la 2e couleur, manche"
  meaning_en: "4-card fit in the second suit, game"
  status: infere
- id: "1S.2{m}.2H.3H"
  for: [{m: C}, {m: D}]
  seq: "1S 2{m} 2H"
  call: 3H
  cond: "H >= 4"
  forcing: INV
  meaning: "Fit 4e dans la 2e couleur, 11-12"
  meaning_en: "4-card fit in the second suit, 11-12"
  status: infere
- id: "{o}.2{m}.x.4{M}"
  for: [{o: 1H, M: H, m: C}, {o: 1H, M: H, m: D}, {o: 1S, M: S, m: C}, {o: 1S, M: S, m: D}]
  seq: "{o} 2{m} 2{M}|2H|3{m}"
  call: "4{M}"
  cond: "{M} >= 3 and hl >= 13"
  forcing: SO
  meaning: "Fit, manche"
  meaning_en: "Fit, game"
  status: infere
- id: "{o}.2{m}.x.3{M}"
  for: [{o: 1H, M: H, m: C}, {o: 1H, M: H, m: D}, {o: 1S, M: S, m: C}, {o: 1S, M: S, m: D}]
  seq: "{o} 2{m} 2{M}|2H|3{m}"
  call: "3{M}"
  cond: "{M} >= 3"
  forcing: INV
  meaning: "Fit, 11-12"
  meaning_en: "Fit, 11-12"
  status: infere
- id: "{o}.2{m}.x.3NT"
  for: [{o: 1H, M: H, m: C}, {o: 1H, M: H, m: D}, {o: 1S, M: S, m: C}, {o: 1S, M: S, m: D}]
  seq: "{o} 2{m} 2{M}|2H|3{m}"
  call: 3NT
  cond: "hl >= 13"
  forcing: SO
  meaning: "Manche à SA"
  meaning_en: "Game in NT"
  status: infere
- id: "{o}.2{m}.x.2NT"
  for: [{o: 1H, M: H, m: C}, {o: 1H, M: H, m: D}, {o: 1S, M: S, m: C}, {o: 1S, M: S, m: D}]
  seq: "{o} 2{m} 2{M}|2H"
  call: 2NT
  cond: "true"
  forcing: INV
  meaning: "11-12, pas de fit"
  meaning_en: "11-12, no fit"
  status: infere
- id: "{o}.2{m}.3{m}.P"
  for: [{o: 1H, m: C}, {o: 1H, m: D}, {o: 1S, m: C}, {o: 1S, m: D}]
  seq: "{o} 2{m} 3{m}"
  call: P
  cond: "true"
  forcing: NF
  meaning: "11-12, pas de fit majeur : on joue 3 dans la mineure"
  meaning_en: "11-12, no major fit: play three of the minor"
  status: infere
- id: "{o}.2{m}.2NT.r"
  for: [{o: 1H, M: H, m: C}, {o: 1H, M: H, m: D}, {o: 1S, M: S, m: C}, {o: 1S, M: S, m: D}, {o: 1D, M: D, m: C}]
  seq: "{o} 2{m} 2NT"
  call: 3NT
  cond: "hl >= 13"
  forcing: SO
  meaning: "Manche"
  meaning_en: "Game"
  status: infere
- id: "{o}.2{m}.2NT.p"
  for: [{o: 1H, M: H, m: C}, {o: 1H, M: H, m: D}, {o: 1S, M: S, m: C}, {o: 1S, M: S, m: D}, {o: 1D, M: D, m: C}]
  seq: "{o} 2{m} 2NT"
  call: 3NT
  cond: "true"
  forcing: NF
  meaning: "3SA : l'ouvreur passe avec 12-14, continue avec 18-19"
  meaning_en: "3NT: opener passes with 12-14, continues with 18-19"
  status: infere
- id: 1D.2C.x.3NT
  seq: "1D 2C 2D|2H|2S|3C"
  call: 3NT
  cond: "hl >= 13"
  forcing: SO
  meaning: "Manche à SA"
  meaning_en: "Game in NT"
  status: infere
- id: 1D.2C.x.2NT
  seq: "1D 2C 2D|2H|2S"
  call: 2NT
  cond: "true"
  forcing: INV
  meaning: "11-12"
  meaning_en: "11-12"
  status: infere
- id: 1D.2C.3C.P
  seq: "1D 2C 3C"
  call: P
  cond: "true"
  forcing: NF
  meaning: "11-12 : on joue 3♣"
  meaning_en: "11-12: play 3♣"
  status: infere

# --- répondant après une redemande à saut de l'ouvreur (6 cartes, 15-17)
# en: responder after opener's jump rebid (6 cards, 15-17)
# Sans 2 cartes dans la couleur de l'ouvreur, elle ne s'affranchit pas en face : 3SA demande alors 11 HL. Mesuré sur le banc du par.
# en: Without 2 cards in opener's suit it does not run opposite: 3NT then needs 11 HL. Measured on the par benchmark.
- id: "{o}.{r}.3{X}.game"
  for: [{o: 1H, r: 1S, X: H}, {o: 1H, r: 1NT, X: H}, {o: 1S, r: 1NT, X: S}, {o: "1C|1D", r: "1H|1S", X: C}, {o: "1C|1D", r: "1H|1S", X: D}]
  seq: "{o} {r} 3{X}"
  call: "4{X}"
  cond: "{X} >= 2 and hl >= 8 and '{X}' in ('H', 'S')"
  forcing: SO
  meaning: "Manche dans la majeure"
  meaning_en: "Game in the major"
  status: infere
- id: "{o}.{r}.3{X}.3NT"
  for: [{o: 1H, r: 1S, X: H}, {o: 1H, r: 1NT, X: H}, {o: 1S, r: 1NT, X: S}, {o: "1C|1D", r: "1H|1S", X: C}, {o: "1C|1D", r: "1H|1S", X: D}]
  seq: "{o} {r} 3{X}"
  call: 3NT
  cond: "hl >= 9 and ({X} >= 2 or hl >= 11)"
  forcing: SO
